var BRAZ = { S: '星', L: '月', R: '日', F: '風' };
function brazier(sym) {
  return {
    type: 'obj', spr: 'brazier', sym: sym, script: function* (g, e) {
      var v = g.vars(); v.seq = v.seq || '';
      if (e.st.lit) { yield say('', '刻著「' + BRAZ[sym] + '」的火盆正在燃燒。'); return; }
      e.st.lit = 1; v.seq += sym; g.sfx('fire');
      yield say('', '你用引火燈點燃了刻著「' + BRAZ[sym] + '」的火盆。');
      if (v.seq.length < 4) return;
      var s = v.seq; v.seq = '';
      if (s === 'SLRF' && !g.flag('r1_open')) {
        g.set('r1_open'); g.sfx('solve'); yield fx('shake');
        yield say('', '星、月、日、風。四道火光連成一線，北邊的石門緩緩升起。');
      } else if (s === 'FRLS' && !g.flag('r1_secret')) {
        g.set('r1_secret'); g.sfx('secret'); yield fx('shake');
        yield say('', '風、日、月、星。火焰倒著燒了一圈——東牆的沙簌簌落下，露出一道向下的窄門。');
      } else {
        g.sfx('deny'); yield fx('shake');
        yield say('', '四座火盆同時「噗」地熄滅了。順序似乎不對。');
      }
      g.ents.forEach(function (o) { if (o.spr === 'brazier') delete o.st.lit; });
    }
  };
}

        if (!moving && !transDir && !game.busy() && !modalKind && !needRelease) {
          var dir = curDir();
          if (dir) tryMove(dir);
        }
        if (!NOTICK && !game.busy() && !modalKind && t - lastTick > 430) { lastTick = t; var before = game.pending; game.tick(); processEvents(); if (game.pending) startPending(); }
        if (autosavePending && !game.busy() && !modalKind) { autosavePending = false; game.save(); }
        weatherTick(dt, t);
        render(t, dt);
      }
    } catch (err) { if (window.console) console.error(err); }
    requestAnimationFrame(frame);
  }

  /* ---------- 測試掛鉤 ---------- */
  window.__GAME__ = {
    game: game,
    getState: function () {
      var S = game.S || {};
      var solved = Object.keys(S.flags || {}).filter(function (f) { return /_open$|_solved$|_secret$|^c_secret$|^master_awake$/.test(f); });
      return { mode: mode, room: game.rid, roomName: game.def && game.def.name, x: S.x, y: S.y, dir: S.dir, flags: Object.assign({}, S.flags), items: Object.keys(S.items || {}), journal: (S.journal || []).slice(), trust: S.trust, embers: S.flags ? game.embers() : 0, solved: solved, endings: game.endings(), endingsTotal: 4, view: [VW, VH, SCALE], storageOk: store.ok };
    },
    isBusy: function () { return !!(game.busy() || modalKind || P.path.length || transDir); },
    get dialog() { return { open: !dlg.hidden || !!modalKind, kind: ui.kind || modalKind, who: ui.who ? NAMES[ui.who] : '', text: ui.kind === 'say' ? ui.text : ui.kind === 'choice' ? dtext.textContent : (modalKind ? mbox.textContent : ''), options: ui.kind === 'choice' ? ui.options.slice() : [] }; },
    debug: {
      warp: function (room, x, y) {
        if (!ROOMS[room]) return false;
        if (mode !== 'play') { if (!game.S) game.newGame(); while (game.pending) game.resume(game.pending.op === 'choice' ? 0 : undefined); startPlay(true); }
        hideDialog(); if (modalKind) closeModal();
        game.it = null; game.pending = null; game.queue = [];
        game.syncRoom(); game.loadRoom(room);
        if (x == null) { var w = game.ents.find(function (e) { return e.type === 'warp'; }); x = w.x; y = w.y; var nbs = [[0, 1], [0, -1], [1, 0], [-1, 0]]; for (var i = 0; i < 4; i++) if (!game.blockedAt(w.x + nbs[i][0], w.y + nbs[i][1]) && game.tile(w.x + nbs[i][0], w.y + nbs[i][1]) !== ' ') { x = w.x + nbs[i][0]; y = w.y + nbs[i][1]; break; } }
        game.S.x = x; game.S.y = y; game.S.entry = [x, y, 'down'];
        game.refresh(); game.events.push({ t: 'warp', rid: room }); processEvents(); return true;
      },
      give: function (id) { game.give(id); updateHud(); },
      run: function (fn) { game.run(fn); processEvents(); if (game.pending) startPending(); },
      menu: function (tab) { openMenu(tab); },
      flag: function (f, v) { game.set(f, v); updateHud(); },
      fast: function (v) { FAST = !!v; },
      noTick: function (v) { NOTICK = !!v; },
      step: function (d) { if (mode !== 'play' || game.busy() || modalKind || P.path.length || transDir) return false; tryMove(d); return true; },
      press: function (k) { if (k === 'ok') confirmKey(); else if (k === 'cancel') cancelKey(); else if (KEYMAP[k]) { pressDir(KEYMAP[k], true); setTimeout(function () { pressDir(KEYMAP[k], false); }, 60); } }
    }
  };

  window.addEventListener('resize', function () { layout(); });
  function saveNow() { if (mode === 'play' && !game.busy() && !modalKind) game.save(); }
  window.addEventListener('pagehide', saveNow);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') saveNow(); });
  layout();
  toTitle();
  requestAnimationFrame(frame);
})();
</script>
</body></html>
