<style>
:root{--ink:#1a1420;--panel:#221c34;--panel2:#2c2444;--line:#f2e2b8;--line2:#7a5a3a;--txt:#f6efe0;--dim:#b8aec8;--gold:#f0c050;--acc:#7ad0e8;--bad:#e8705a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0c0a14;color:var(--txt);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{position:fixed;inset:0;width:100%}
#modal .box{touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#stage{position:relative;line-height:0;box-shadow:0 0 0 3px #000,0 0 0 6px #3a3050,0 10px 40px #000a;background:#000;flex:none}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.frame{background:repeating-linear-gradient(0deg,var(--panel) 0 3px,var(--panel2) 3px 4px);border:3px solid var(--line);box-shadow:0 0 0 3px var(--ink),inset 0 0 0 3px var(--line2);clip-path:polygon(0 6px,6px 6px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0 calc(100% - 6px));line-height:1.6}
#hud[hidden]{display:none}
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:6px;pointer-events:none;line-height:1.2}
#hud .l{display:flex;gap:6px;align-items:center;background:#0008;padding:4px 8px;border:2px solid #0006;font-size:var(--fs-s)}
#embers{display:flex;gap:3px}
#embers i{width:10px;height:14px;display:block;background:#3a3448;clip-path:polygon(50% 0,100% 55%,80% 100%,20% 100%,0 55%);opacity:.7}
#hud .r{display:flex;gap:6px;pointer-events:auto}
.hb{font:inherit;font-size:var(--fs-s);color:var(--txt);background:#000a;border:2px solid #f2e2b888;padding:6px 10px;min-height:44px;min-width:44px;cursor:pointer}
.hb:active,.hb:focus-visible{background:#3a3050;outline:none;border-color:var(--gold)}
#banner{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%);font-size:var(--fs-l);letter-spacing:.3em;text-shadow:0 2px 0 #000,0 0 12px #000;opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap;line-height:1.2;color:#fff8e0}
#banner small{display:block;font-size:.5em;letter-spacing:.2em;text-align:center;color:var(--dim)}
#banner.on{opacity:1}
#toast{position:absolute;left:50%;top:48px;transform:translateX(-50%);font-size:var(--fs-s);background:#000c;border:2px solid var(--gold);padding:4px 12px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;line-height:1.5;color:var(--gold)}
#toast.on{opacity:1}
#dialog{position:absolute;left:8px;right:8px;bottom:8px;padding:10px 14px 12px;display:flex;gap:12px;min-height:calc(var(--fs) * 5.6);font-size:var(--fs)}
#dialog[hidden],#modal[hidden]{display:none}
#modal.k-ending{align-items:flex-end;background:#0004}
#ptwrap{flex:none;width:calc(var(--fs) * 4);height:calc(var(--fs) * 4);border:2px solid var(--line);box-shadow:0 0 0 2px var(--ink);align-self:flex-start;margin-top:4px}
#ptwrap canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
#dbody{flex:1;min-width:0}
#dname{color:var(--gold);font-weight:bold;font-size:.92em;line-height:1.4}
#dtext{white-space:pre-wrap;word-break:break-word;min-height:3.2em}
#dmore{position:absolute;right:14px;bottom:8px;color:var(--gold);animation:bob .6s steps(2) infinite;font-size:.8em}
@keyframes bob{50%{transform:translateY(3px)}}
#choices{display:flex;flex-direction:column;gap:4px;margin-top:6px}
#choices button,.mbtn{font:inherit;text-align:left;color:var(--txt);background:#0004;border:2px solid transparent;padding:6px 10px 6px 26px;cursor:pointer;position:relative;min-height:44px;line-height:1.4}
#choices button.sel,.mbtn:focus-visible,.mbtn.sel{border-color:var(--gold);background:#f0c05022;outline:none}
#choices button.sel::before,.mbtn.sel::before,.mbtn:focus-visible::before{content:"";position:absolute;left:9px;width:8px;height:10px;background:var(--gold);clip-path:polygon(0 0,100% 50%,0 100%);top:50%;transform:translateY(-50%)}
#modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0008;padding:10px}
#modal .box{width:100%;max-width:560px;max-height:100%;overflow:auto;padding:14px 16px;font-size:var(--fs)}
.box h2{margin:0 0 8px;font-size:1.15em;color:var(--gold);letter-spacing:.1em}
.box p{margin:.4em 0}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs .mbtn{flex:1;text-align:center;padding:4px 6px;min-height:44px}
.tabs .mbtn.on{background:var(--line2);border-color:var(--line)}
.tabs .mbtn::before{display:none}
.list{display:flex;flex-direction:column;gap:4px}
.mbtn{display:block;width:100%}
.item{display:flex;gap:10px;align-items:center}
.item canvas{width:32px;height:32px;image-rendering:pixelated;flex:none;background:#0006;border:2px solid #fff2}
.jent{border-left:3px solid var(--line2);padding:4px 10px;margin:6px 0;background:#0003;line-height:1.6}
.jent b{color:var(--gold);font-size:.9em}
.jent .c{font-size:.75em;color:var(--dim);margin-left:6px}
.hint{color:var(--dim);font-size:.82em}
.codes{display:flex;gap:8px;justify-content:center;margin:12px 0}
.wheel{display:flex;flex-direction:column;align-items:center;gap:4px}
.wheel button{font:inherit;width:48px;height:44px;color:var(--txt);background:#0006;border:2px solid #fff3;cursor:pointer}
.wheel .d{width:48px;height:56px;display:flex;align-items:center;justify-content:center;font-size:1.8em;background:#000;border:3px solid var(--line2);color:var(--gold);font-family:Consolas,monospace}
.wheel.sel .d{border-color:var(--gold);box-shadow:0 0 10px #f0c05066}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.row .mbtn{width:auto;flex:1;text-align:center;padding:6px 12px;min-width:110px}
.row .mbtn::before{display:none}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 12px 6%;gap:6px;pointer-events:none}
#title[hidden]{display:none}
#title h1{position:absolute;top:12%;left:0;right:0;text-align:center;margin:0;font-size:calc(var(--fs-l) * 1.5);letter-spacing:.35em;color:#fff4d8;text-shadow:0 3px 0 #2a1a10,0 0 18px #ffd88066;line-height:1.2}
#title h1 small{display:block;font-size:.32em;letter-spacing:.4em;color:#c8d4f0;margin-top:10px;text-shadow:0 2px 0 #000}
#title .menu{pointer-events:auto;width:min(300px,100%);padding:10px;font-size:var(--fs)}
#title .menu .mbtn{text-align:center;padding-left:10px}
#title .ver{font-size:.7em;color:#fff6;line-height:1}
#pad{display:none;width:100%;max-width:520px;box-sizing:border-box;justify-content:space-between;align-items:center;padding:4px 22px 8px;user-select:none;-webkit-user-select:none;touch-action:none;flex:none}
body.touch #pad{display:flex}
.dpad{position:relative;width:168px;height:168px;touch-action:none}
.dpad button,.ab button{position:absolute;font:inherit;color:#f6efe0;background:#2c2444;border:3px solid #f2e2b8aa;box-shadow:0 4px 0 #000;font-size:22px;touch-action:none}
.dpad button{width:56px;height:56px;pointer-events:none}
.dpad button::before{content:"";position:absolute;left:50%;top:50%;width:20px;height:17px;background:currentColor;clip-path:polygon(50% 0,100% 100%,0 100%);transform:translate(-50%,-50%) rotate(var(--r,0deg))}.dpad .r{--r:90deg}.dpad .d{--r:180deg}.dpad .l{--r:270deg}
.dpad .u{left:56px;top:0}.dpad .d{left:56px;bottom:0}.dpad .l{left:0;top:56px}.dpad .r{right:0;top:56px}
.dpad .c{left:56px;top:56px;width:56px;height:56px;background:#1a1426;border-radius:0;pointer-events:none;position:absolute}
.ab{position:relative;width:160px;height:150px}
.ab button{width:72px;height:72px;border-radius:50%;font-weight:bold;font-size:26px}
.ab .a{right:0;top:8px;background:#7a3a3a}.ab .b{left:4px;bottom:0;background:#3a3a6a}
.dpad button.on,.ab button.on{transform:translateY(3px);box-shadow:0 1px 0 #000;border-color:var(--gold)}
.ab span{position:absolute;font-size:11px;color:#fff8;line-height:1}
.ab .la{right:22px;top:86px}.ab .lb{left:30px;bottom:-14px}

var I18N_EN = {"strings":{"霧嶼守燈人":"Mist Isle","蕨":"Fern","蘆婆":"Granny Reed","朧":"Haze","柏翁":"Old Cypress","阿麥":"Barley","小穗":"Tassel","老槳":"Old Oar","鈴子":"Chime","苔爺":"Grandpa Moss","礫":"Grit","蓼":"Sorrel","曦":"Dawn","？？？":"???","守鐘人":"Bellkeeper","翠火":"Jade Ember","蒼火":"Azure Ember","赤火":"Crimson Ember","白火":"White Ember","引火燈":"Ember Lantern","燈匠用來盛裝火種的提燈。有它在，霧不敢靠得太近。":"The lantern a lampwright carries embers in. While it burns, the mist keeps its distance.","師父的銅匙":"Master's Brass Key","匙柄上刻著一個「柏」字。師父從不離身的東西，這次卻留在了櫃子裡。":"The handle is engraved with one word: “Cypress.” Master never let it out of his sight, yet this time he left it in the cabinet.","捕霧瓶":"Mist-Catcher Jar","貼著村長封條的玻璃瓶，裡面關著一隻霧螢。它偶爾會撞一下瓶壁。":"A glass jar sealed with the elder's tag. A mistfly is trapped inside. Now and then it bumps the glass.","鎖霧瓶":"Mistlock Bottle","村長交給你的黑色瓶子。握在手裡，像握著一口很深的井。":"The black bottle the elder gave you. Holding it feels like holding a very deep well.","苔語森林的火種。像一片燒不完的葉子。":"The ember of Mosswood. Like a leaf that never finishes burning.","潮鳴洞的火種。湊近聽，有浪的聲音。":"The ember of Tidecall Cave. Hold it close and you can hear waves.","赤砂遺跡的火種。握久了掌心會留下沙。":"The ember of the Redsand Ruins. Hold it long and sand gathers in your palm.","霜鐘山的火種。是冷的。":"The ember of Frostbell Peak. It is cold.","拓片・其一":"Rubbing I","在森林深處拓下的碑文。內容記在日誌裡。":"An inscription rubbed deep in the forest. Its text is in your journal.","拓片・其二":"Rubbing II","在洞窟暗室拓下的碑文。內容記在日誌裡。":"An inscription rubbed in the cave's hidden chamber. Its text is in your journal.","拓片・其三":"Rubbing III","在遺跡裡室拓下的碑文。內容記在日誌裡。":"An inscription rubbed in the ruins' inner room. Its text is in your journal.","任務":"Quest","四顆火種":"The Four Embers","大燈塔熄了三夜，霧正在吃掉村人的記憶。蘆婆說，要重新點燃大燈，得取回供在島上四處的火種：西邊的苔語森林、南邊海岸的潮鳴洞、東邊的赤砂遺跡、東北的霜鐘山。":"The Great Lighthouse has been dark three nights, and the mist is eating the villagers' memories. Granny Reed says relighting the Great Lamp needs the four embers enshrined around the island: Mosswood to the west, Tidecall Cave on the south coast, the Redsand Ruins to the east, Frostbell Peak to the northeast.","線索":"Clue","師父的字條":"Master's Note","「蕨：我若沒回來，引火燈在櫃子裡。鎖的數字我怕自己也忘，所以藏在村裡三樣不會忘的東西上——鐘樓每晚敲幾下、井邊有幾個桶、全村有幾根燈柱。照這個順序。——柏」":"“Fern: if I don't come back, the Ember Lantern is in the cabinet. I feared I'd forget the lock's numbers myself, so I hid them in three things this village never forgets — how many times the bell tower rings each night, how many buckets stand by the well, how many lampposts the village has. In that order. — Cypress”","鐘樓的鐘聲":"Bell Tower Chimes","鈴子說，鐘樓每晚敲七下，她天天數。":"Chime says the bell tower rings seven times a night; she counts every time.","搖籃謠・前半":"Lullaby (1st half)","鈴子哼的搖籃謠前半段：「咚、咚、叮」。（咚是低音，叮是高音。）":"The first half of the lullaby Chime hums: “Bong, bong, ding.” (Bong is the low note, ding the high one.)","搖籃謠・後半":"Lullaby (2nd half)","師父的音樂盒只肯唱後半段：「噹、叮、咚」。（噹是中音。）":"Master's music box will only play the second half: “Clang, ding, bong.” (Clang is the middle note.)","日記":"Diary","師父的日記・一":"Master's Diary I","「十二年前的霧夜，我在碼頭的空船裡撿到一個孩子。孩子不哭，只是盯著我的燈看。我叫他『蕨』——霧裡也長得好的那種草。」":"“Twelve years ago, on a misty night, I found a child in an empty boat at the dock. He didn't cry; he only stared at my lamp. I named him ‘Fern’ — the kind of plant that grows well even in the mist.”","師父的日記・二":"Master's Diary II","「每晚點燈前，我總要先哼完那首搖籃謠。不哼完，手會抖。四十年了，改不掉。」":"“Every night before lighting the lamp, I must hum that lullaby to the end. If I don't, my hands shake. Forty years, and I can't stop.”","師父的日記・三":"Master's Diary III","「今晚又聽見了。大燈的火焰裡有哭聲，很輕，像小孩子。我問蘆婆，她說是風。塔頂沒有風。」":"“I heard it again tonight: crying in the Great Lamp's flame, faint, like a small child. Granny Reed said it was the wind. There is no wind atop the tower.”","師父的日記・四":"Master's Diary IV","「若那盞燈是一座牢，那我守了四十年的，究竟是什麼？明晚我要上塔，親手把它熄掉。蕨還小，不能讓他知道。」":"“If that lamp is a prison, then what is it I have guarded for forty years? Tomorrow night I will climb the tower and put it out with my own hands. Fern is still young. He must not know.”","苔爺的話":"Grandpa Moss's Tip","溪水切斷了路，木頭推進水裡就是橋。另外，祠堂東邊草長得特別高的地方，後面有一條連樵夫都忘了的路，盡頭有「先民不想被讀到的字」。":"The creek cuts the path; push logs into the water and they make a bridge. Also: east of the shrine, where the grass grows especially tall, a path lies behind it that even the woodcutters have forgotten. At its end are “words the Ancients didn't want read.”","碑文":"Inscription","翠火祠碑文":"Jade Shrine Stele","「翠火，四鎖之一。入塔之時，翠火不居東，亦不居西。」":"“The Jade Ember, first of four locks. Within the tower, the Jade rests neither in the East nor in the West.”","礫的筆記":"Grit's Notes","「光打在會亮的晶上，門會開。但阿磐說過，要把光打在『不會亮』的那顆上，才看得到真正的東西。」":"“Shine the light on a crystal that glows, and the door opens. But Crag always said: shine it on the one that ‘doesn't glow’, and you'll see what's really there.”","蒼火祠碑文":"Azure Shrine Stele","「蒼火，四鎖之二。入塔之時，蒼火與翠火遙遙相對。」":"“The Azure Ember, second of four locks. Within the tower, the Azure faces the Jade from the opposite side.”","蓼的說明":"Sorrel's Briefing","庭院裡四座火盆刻著星、月、日、風，要照壁畫的順序點燃，北門才會開。壁畫碎成三片散在院子裡。先民的數字只用點和橫槓，院子裡有幾處標了數量，可以對照。":"The courtyard's four braziers are carved Star, Moon, Sun and Wind; lit in the order the mural shows, they open the north gate. The mural broke into three pieces scattered around the courtyard. The Ancients wrote numbers with only dots and bars; a few spots in the courtyard are marked with counts to compare against.","壁畫殘片・甲":"Mural Fragment A","「星落而月升。」":"“The Star sets, and the Moon rises.”","壁畫殘片・乙":"Mural Fragment B","「月沉而日出。」":"“The Moon sinks, and the Sun comes up.”","壁畫殘片・丙":"Mural Fragment C","「日盛則風起。」":"“When the Sun is high, the Wind rises.”","石柱旁的刻痕":"Pillar Marks","庭院中央的石柱旁刻著：「▬● 柱，承天。」":"Carved beside the pillars in the middle of the courtyard: “▬● pillars, holding up the sky.”","陶甕旁的刻痕":"Urn Marks","一排陶甕旁刻著：「●●● 甕，盛雨。」":"Carved beside a row of clay urns: “●●● urns, holding the rain.”","空台座的刻痕":"Empty Pedestal Mark","一座上面什麼都沒有的台座，刻著：「○」":"A pedestal with nothing on it, carved with: “○”","壁畫背面的小字":"Back of the Mural","蓼發現壁畫背面還刻了一行：「逆行者見其裡。」":"On the mural's back Sorrel found one more line: “Who walks it backward sees what lies within.”","符文廊石碑":"Rune Hall Stele","「循『眼、手、心』而行，周而復始。先見，後取，方知。踏錯者，歸於沙。」":"“Walk by ‘Eye, Hand, Heart’, and when it ends, begin again. First see, then take, then know. Who steps wrong returns to the sand.”","石門前的石板":"Door Tablet","石板上刻著四組記號：「▬●●　○　●●●●　▬●●●●」":"The tablet bears four groups of marks: “▬●●   ○   ●●●●   ▬●●●●”","赤火祠碑文":"Crimson Shrine Stele","「赤火，四鎖之三。入塔之時，赤火居蒼火之次——依北、東、南、西之序，順行一位。」":"“The Crimson Ember, third of four locks. Within the tower, the Crimson stands next after the Azure — one step onward in the order North, East, South, West.”","鐘台的銘牌":"Belfry Plaque","「鐘聲不識字，只認得哄孩子入睡的那支曲子。」大鐘的聲音是「咚」，中鐘是「噹」，小鐘是「叮」。":"“The bells cannot read. They know only the song that lulls a child to sleep.” The great bell sounds “bong,” the middle bell “clang,” the small bell “ding.”","白火祠碑文":"White Shrine Stele","「白火，四鎖之末。入塔之時，白火不見日落。」":"“The White Ember, last of four locks. Within the tower, the White never sees the sun go down.”","拓片":"Rubbing","「燈中之焰，非火也，乃靈。先民呼之曰『曦』。曦者，晨光也。」":"“The flame within the lamp is no fire, but a spirit. The Ancients called it ‘Dawn’ — Dawn, the light of morning.”","「霧本一雙。先民誘其半入燈，鎖以四火：先翠、次蒼、次赤、末白。失其半者，年年漫島尋之。」":"“The mist was once a pair. The Ancients lured one half into the lamp and locked it with four fires: first Jade, then Azure, then Crimson, last White. The half left behind roams the island year after year, searching for it.”","「解鎖之法：逆封之序而滅四火，呼其真名。然霧若不願，則鎖不開——強求者，兩失之。」":"“To undo the lock: put out the four fires in reverse of the sealing order, and call its true name. But if the mist is unwilling, the lock stays shut — force it, and both are lost.”","師父的話":"Master's Words","大燈裡燒的不是油，是一個叫「曦」的靈。師父熄了燈想放它走，但四把火鎖還在。他說：鎖是照順序上的，要解就得反著來。還有——小心蘆婆，她想的是換一個新的進去。":"What burns in the Great Lamp isn't oil but a spirit called “Dawn.” Master put out the lamp to free it, but the four fire-locks still hold. He said the locks were set in order, so to undo them, go in reverse. And: beware Granny Reed. She wants to put a new one inside.","村長的提議":"The Elder's Offer","蘆婆說大燈裡的靈快燒完了，重新點燃也撐不了幾年。她要我在塔頂打開「鎖霧瓶」，把朧也鎖進燈裡，換來下一個一百年。":"Granny Reed says the spirit in the Great Lamp is nearly burned out; relit, it would last only a few years. She wants me to open the “Mistlock Bottle” atop the tower and lock Haze into the lamp too, buying another hundred years.","塔底的羅盤":"The Tower Compass","塔底地板嵌著一面羅盤：北方指向通往上層的樓梯。四座台座分別立在北、東、南、西。":"A compass is set into the floor of the tower base: north points to the stairs leading up. Four pedestals stand at the north, east, south and west.","一":"I","長明之夜":"Night of Endless Light","把火種放回它們原本的位置。":"Return the embers to where they belong.","二":"II","無燈之島":"The Lampless Isle","有些東西砸碎了就回不來。":"Some things, once shattered, never come back.","三":"III","曦與朧":"Dawn and Haze","三張拓片、一個想起自己的人、一份足夠的信任。":"Three rubbings, one who remembers himself, and enough trust.","四":"IV","第二盞燈":"The Second Lamp","收下村長給的東西，並且用掉它。":"Accept what the elder gives you — and use it.","霧影穿過了你的身體。……你一時想不起自己為什麼站在這裡，只好走回剛才的入口。":"The mist shade passes through you. …For a moment you can't recall why you're standing here, so you walk back to the entrance.","腳下的石板一沉，流沙把你送回了廊道的起點。":"The slab sinks underfoot, and the quicksand carries you back to the start of the hall.","沙子退去時，地上的符文全都換了位置。":"As the sand drains away, every rune on the floor has changed places.","門緊緊關著。附近應該有讓它打開的機關。":"The door is shut tight. Something nearby must open it.","空了的祭壇。碑文還在：":"An empty altar. The inscription remains: ","祭壇上浮著一顆火種。台座刻著先民的字：":"An ember floats above the altar. The pedestal bears words of the Ancients:","柏翁的工坊":"Cypress's Workshop","你的床。被子還是溫的。":"Your bed. The blanket is still warm.","桌上壓著一張字條，是師父的筆跡。":"A note lies on the desk, in Master's handwriting.","字條下面還有一本攤開的日記。":"Beneath the note lies an open diary.","一只舊音樂盒。你轉動發條，它只肯唱出後半段：":"An old music box. You wind it, and it will only play the second half:","「……噹、叮、咚。」":"“…Clang, ding, bong.”","前半段的簧片鏽住了。師父每晚點燈前哼的，就是這支搖籃謠。":"The reeds for the first half have rusted. This is the lullaby Master hummed every night before lighting the lamp.","櫃子已經空了。":"The cabinet is empty now.","師父的櫃子。上面掛著一把三位數的轉盤鎖。":"Master's cabinet. A three-digit dial lock hangs on it.","櫃子的轉盤鎖":"Cabinet Dial Lock","鎖沒有反應。":"The lock doesn't budge.","你決定先在村子裡找找線索。":"You decide to look around the village for clues first.","喀噠。鎖開了。":"Click. The lock opens.","櫃子深處還躺著一把銅匙，匙柄刻著「柏」字。師父從不離身的東西，這次卻沒帶走。":"Deeper in the cabinet lies a brass key, its handle engraved “Cypress.” Master never let it out of his sight, yet this time he left it behind.","師父……你是故意留下來的嗎？":"Master… did you leave this for me on purpose?","……咚。……咚。……咚。":"…Bong. …Bong. …Bong.","鐘樓的鐘聲把你從夢裡拉了出來。":"The tolling of the bell tower pulls you out of a dream.","窗外白茫茫一片。霧嶼的霧，從來沒有這麼濃過。":"Outside the window, everything is white. The mist on Mist Isle has never been this thick.","師父……還是沒回來。":"Master… still isn't back.","三天前的夜裡，島中央的大燈塔熄了。師父柏翁提著工具上了山，從此沒有消息。":"Three nights ago, the Great Lighthouse at the island's heart went dark. Master Cypress took his tools up the hill, and no word has come since.","【操作】方向鍵或 WASD 移動，空白鍵或 Enter 調查與對話，Esc 或 M 開啟選單（物品、日誌、存檔）。":"[Controls] Arrow keys or WASD to move, Space or Enter to examine and talk, Esc or M for the menu (items, journal, saving).","蕨，你醒了。……你師父還是沒有回來。":"Fern, you're awake. …Your master still hasn't come back.","大燈熄了三夜，霧每晚往村裡多爬一步。你也看到了——阿麥開始記不住女兒的名字。":"Three nights dark, and each night the mist creeps further into the village. You've seen it — Barley's forgetting his own daughter's name.","霧會吃掉記憶。等它吃到最後，我們會連「自己是誰」都忘了。":"The mist eats memories. When it's done, we'll forget even who we are.","要重新點燃大燈，需要四顆火種。它們供在島的四個角落：西邊的苔語森林、南邊海岸的潮鳴洞、東邊的赤砂遺跡、東北的霜鐘山。":"To relight the Great Lamp we need four embers, enshrined at the island's four corners: Mosswood to the west, Tidecall Cave on the south coast, the Redsand Ruins to the east, Frostbell Peak to the northeast.","你師父的引火燈能盛火種，應該鎖在工坊的櫃子裡。去把它拿出來。":"Your master's Ember Lantern can hold the embers. It should be locked in the cabinet in his workshop. Go and get it.","你已經拿到引火燈了？很好。先去西邊的苔語森林。":"You've got the Ember Lantern already? Good. Head west to Mosswood first.","等等。你背包裡那個……是我放在森林的捕霧瓶。裡面有東西？":"Wait. That thing in your bag… is the Mist-Catcher Jar I left in the forest. Is something in it?","交給她":"Give it to her","「這瓶子是做什麼用的？」":"“What's this jar for?”","抓霧的碎屑。霧是什麼做的、怕什麼，總得有人弄清楚。給我吧。":"For catching scraps of mist. What the mist is made of, what it fears — someone has to find out. Give it here.","「我想自己留著。」":"“I'd rather keep it.”","……隨你。別把它放出來就好。":"…Suit yourself. Just don't let it out.","好孩子。這對村子很有用。":"Good child. This will be a great help to the village.","引火燈在你師父工坊的櫃子裡。鎖的數字我不知道，他那個人，連我都防。":"The Ember Lantern's in the cabinet in your master's workshop. I don't know the lock's numbers. That man kept secrets even from me.","有引火燈就能走進霧裡了。先去西邊的苔語森林。":"With the Ember Lantern you can walk into the mist. Head west to Mosswood first.","……路上若看見「霧裡的東西」，別跟它說話。":"…And if you see “something in the mist” on the way, don't talk to it.","第一顆。很好。":"The first one. Good.","南邊碼頭旁有個洞口，潮鳴洞的霧要一顆火種才照得開。":"There's a cave mouth by the dock to the south. The mist in Tidecall Cave takes one ember to light through.","兩顆了。接下來是東邊的赤砂遺跡。":"Two now. Next is the Redsand Ruins, to the east.","先民就是在那裡……算了。你把火種拿回來就好。":"That's where the Ancients… never mind. Just bring the ember back.","只剩霜鐘山。上山的路在村子東北角。":"Only Frostbell Peak is left. The mountain path starts at the village's northeast corner.","……蕨，你最近是不是常常一個人自言自語？":"…Fern, have you been talking to yourself a lot lately?","霧隱村":"Mistveil Village","村長家的門鎖著。蘆婆這幾天都守在廣場上。":"The elder's door is locked. Granny Reed has kept watch in the square these past few days.","麵包店。門縫裡飄出有點焦的味道。":"The bakery. A slightly burnt smell drifts through the crack in the door.","鐘樓的門。裡面的樓梯又窄又陡，只有鈴子爬得上去。":"The bell tower door. The stairs inside are narrow and steep — only Chime can climb them.","村子的水井。井邊擺著幾個木桶——數數看有幾個。":"The village well. Some wooden buckets stand beside it — count how many.","一個木桶。":"A wooden bucket.","燈柱。火還亮著，但光圈比以前小了一圈。":"A lamppost. Its fire still burns, but its circle of light has shrunk.","鐘樓的銘牌：「霧起鳴鐘，以告歸人。」":"The bell tower plaque: “When mist rises, ring the bell, to call the wanderers home.”","字的下方有人用炭筆畫了七道槓，像是小孩子的筆跡。":"Beneath the words, someone has drawn seven strokes in charcoal, in what looks like a child's hand.","剛才有個腿凍傷的老人家從山上下來，說要借一根拐杖……那背影，好像柏翁啊。":"An old fellow with frostbitten legs just came down the mountain, asking to borrow a walking stick… From behind, he looked just like Old Cypress.","是小蕨啊。今天的麵包……我放過鹽了嗎？":"Oh, it's little Fern. Today's bread… did I salt it?","最近老是忘東忘西。一定是霧的關係。":"I keep forgetting things lately. Must be the mist.","小穗？……喔對，小穗是我女兒。":"Tassel? …Oh, right. Tassel's my daughter.","我剛才居然愣了一下。小蕨，燈什麼時候會亮？":"I actually blanked for a second just now. Fern, when's the lamp coming back on?","……請問你是？":"…I'm sorry, who are you?","啊，是小蕨。抱歉抱歉。我今天烤了麵包嗎？":"Ah, it's little Fern. Sorry, sorry. Did I bake bread today?","爸爸昨天叫我「那個誰」。":"Yesterday Daddy called me “um, what's-her-name.”","霧是不是會把名字吃掉？那我要把名字寫在手上。":"Does the mist eat names? Then I'm gonna write mine on my hand.","你看，我把名字寫在手上了。小、穗。":"Look, I wrote my name on my hand. T-A-S-S-E-L.","小蕨哥哥，你後面那個白白的小朋友是誰？……咦，不見了。":"Big brother Fern, who's the little white kid behind you? …Huh? They're gone.","我是鈴子，鐘是我敲的！每晚七下，我天天數，一下都不會少。":"I'm Chime, and I ring the bell! Seven times every night. I count every night, and I never miss one!","敲完鐘，柏爺爺會在塔上哼歌。我只記得前面：":"After the bell, Grandpa Cypress hums up in the tower. I only remember the start:","「咚、咚、叮——」後面我老是記不住。他的音樂盒裡好像有。":"“Bong, bong, ding—” I can never remember the rest. I think his music box has it.","霧從海上來的時候，是沒有聲音的。":"When the mist comes in off the sea, it makes no sound.","我爺爺說，以前的霧不是這樣。以前的霧會「找東西」——在每一扇窗戶外面停一下，再飄走。":"My grandpa said the mist wasn't always like this. The old mist went “looking for something” — stopped at every window a while, then drifted on.","找了一百年還沒找到，換作是我，也要發脾氣的。":"A hundred years looking and still hasn't found it. I'd be in a foul temper too.","鐘樓那口鐘每晚敲……幾下來著？":"That bell in the tower rings every night… how many times, now?","你看，連我也開始了。":"See? Now it's got me too.","往森林的路被濃霧整個吞沒了。":"The road to the forest has been swallowed whole by thick mist.","沒有燈，走進去就出不來。":"Without a lamp, you'd walk in and never come out.","洞口湧出的霧又濕又重，引火燈的光被壓得只剩一點。":"The mist pouring from the cave is wet and heavy, crushing the Ember Lantern's light to a speck.","燈裡至少要有一顆火種，才照得開這裡。":"The lantern needs at least one ember to light the way here.","往東的路上，霧濃得像一堵牆。":"On the road east, the mist stands thick as a wall.","燈裡要有兩顆火種才照得開。":"The lantern needs two embers to light the way.","上山的路結了霜，霧裡什麼都看不見。":"The mountain path is rimed with frost; nothing can be seen in the mist.","燈裡要有三顆火種才照得開。":"The lantern needs three embers to light the way.","通往燈塔的石階消失在霧裡。":"The stone steps to the lighthouse vanish into the mist.","四顆火種到齊之前，上不去的。":"You can't go up until all four embers are gathered.","苔語森林・溪畔":"Mosswood · Creek","……唔。……燈匠的……孩子。":"…Mm. …The lampwright's… child.","溪水……把路……切斷了。木頭……會浮。推進水裡……就是橋。":"The creek… has cut… the path. Logs… float. Push them in… and there's… a bridge.","還有……一件事。祠堂東邊……草長得特別高。草後面……有一條……連樵夫都忘了的路。":"And… one more thing. East of the shrine… the grass grows… very tall. Behind it… is a path… even woodcutters… forgot.","路的盡頭……有先民……不想被讀到的字。":"At its end… are words… the Ancients… didn't want read.","草特別高的地方……後面有路。別忘了。……我已經忘了……很多事。":"Where the grass is tallest… a path lies behind. Don't forget. …I've already forgotten… so much.","你身後那個孩子……我認得。它……找了一百年了。":"That child behind you… I know it. It has been searching… a hundred years.","樹根上綁著一只玻璃瓶，瓶口貼著村長的封條。瓶裡有一小團發光的霧，正用力撞著瓶壁。":"A glass jar is tied to a tree root, its mouth sealed with the elder's tag. Inside, a small wisp of glowing mist beats hard against the glass.","是霧螢……我們裡面最小的那種。它出不來。":"It's a mistfly… the littlest of us. It can't get out.","蘆婆婆在森林裡放了好多這種瓶子。我不知道她要做什麼。":"Granny Reed put lots of these jars in the forest. I don't know what she wants them for.","打開瓶子放走它":"Open the jar and free it","把瓶子收進背包":"Put the jar in your bag","先不管它":"Leave it for now","你撕開封條。霧螢繞著你的燈飛了三圈，鑽進樹冠不見了。":"You tear off the seal. The mistfly circles your lamp three times, then vanishes into the treetops.","……謝謝你。":"…Thank you.","瓶裡的光暗了一點。":"The light in the jar dims a little.","踏進森林的那一刻，燈火忽然縮了一下。":"The moment you step into the forest, the lamp's flame flinches.","霧裡有個小小的影子，蹲在路中央，歪著頭看你的燈。":"In the mist, a small shadow crouches in the middle of the path, head tilted, watching your lamp.","……那個光，好溫暖。可以借我看一下嗎？":"…That light is so warm. Can I look at it for a bit?","「你是誰？」":"“Who are you?”","「別過來！」":"“Stay back!”","（默默把燈舉高一點）":"(Lift the lamp a bit higher)","我……不太知道。大家叫我們「霧」，可是我覺得那不是名字。":"I… don't really know. Everyone calls us “mist,” but I don't think that's a name.","很久以前有人叫過我「朧」。你也可以這樣叫。":"A long time ago, someone called me “Haze.” You can call me that too.","……對不起。我站遠一點。":"…Sorry. I'll stand further away.","我叫朧。我不會吃你的東西，真的。":"My name's Haze. I won't eat your things, really.","啊，謝謝。你人真好。":"Oh, thank you. You're really nice.","我叫朧。已經很久沒有人看得見我了。":"My name's Haze. It's been so long since anyone could see me.","你要去找那些「會痛的火」對不對？我知道路。我跟著你，好嗎？":"You're off to find those “fires that hurt,” right? I know the way. Can I come with you?","不等你回答，影子已經飄到了你身後。奇怪的是，你並不覺得冷。":"Before you can answer, the shadow has drifted behind you. Strangely, you don't feel cold.","苔語森林・翠火祠":"Mosswood · Shrine","石碑的碑腳塞著一頁紙，是從師父日記上撕下來的。":"Stuffed under the foot of the stele is a page torn from Master's diary.","……唔。":"…Mm.","沒事。只是每次靠近那種火，胸口就會痛。":"It's nothing. Whenever I get near that kind of fire, my chest hurts, that's all.","可是你把它拿起來之後……又好像輕了一點。":"But after you picked it up… I felt a little lighter.","【翠火】收進了引火燈。南邊碼頭旁的洞口，現在應該照得開了。":"The [Jade Ember] goes into the Ember Lantern. Its light should now get you through the mist at the cave by the south dock.","三塊石板同時沉了下去。祠堂的藤門緩緩鬆開。":"All three slabs sink at once. The shrine's vine gate slowly loosens.","苔語森林・忘路":"Mosswood · Lost Way","一面被苔蘚蓋住的石碑。你撥開苔蘚，把紙覆上去拓了下來。":"A moss-covered stele. You brush the moss aside, lay paper over it, and take a rubbing.","曦……":"Dawn…","這個名字，我好像在哪裡聽過。很久、很久以前。":"That name… I feel like I've heard it somewhere. A long, long time ago.","藤蔓退開，露出一間被遺忘的石室。":"The vines draw back, revealing a forgotten stone chamber.","高高的草後面，果然藏著一條路。這裡的樹老得連鳥都不來。":"Behind the tall grass, sure enough, a path lies hidden. The trees here are so old even birds stay away.","潮鳴洞・前廳":"Tidecall · Entry","岩壁上有一道很細的裂縫，手指伸不進去。":"There's a hairline crack in the rock wall. Your fingers won't fit.","阿磐最喜歡這個洞的回音。他說像有人在很遠的地方敲鐘。":"Crag loved the echo in this cave. Said it was like someone ringing a bell far away.","我再坐一會兒就回村子。謝謝你，小兄弟。":"I'll sit a little longer, then head back to the village. Thanks, lad.","兩把鎬……算了。想不起來，大概就是不重要吧。":"Two picks… forget it. If I can't remember, it can't be important.","嗯？你是……來採晶的？還是我是來採晶的？":"Hm? Are you… here to mine crystal? Or am I the one here to mine?","奇怪。我記得我帶了兩把鎬。為什麼要帶兩把？":"Strange. I remember bringing two picks. Why would I bring two?","他的筆記本攤在地上。最新的一頁寫著：":"His notebook lies open on the ground. The newest page reads:","下面還有一行，墨跡很新：「阿磐是誰？」":"Below it is one more line, the ink still fresh: “Who is Crag?”","鏡子可以轉動：站在鏡子旁按調查鍵，就能改變光的方向。":"Mirrors can be turned: stand next to one and press Examine to change the light's direction.","他弄丟的東西在我這裡。霧撿到的記憶，我都留著。":"The thing he lost is with me. I keep every memory the mist picks up.","阿磐是他的搭檔。去年洞頂塌下來的時候……只有他一個人走出去。":"Crag was his partner. Last year, when the cave roof came down… he was the only one who walked out.","要還給他嗎？他會哭的。":"Should I give it back? He'll cry.","還給他，那是他的記憶":"Give it back—it's his memory","別還了，忘記比較不痛":"Don't. Forgetting hurts less","先問他自己想不想知道":"Ask him if he wants to know","……嗯。那我繼續替他保管。":"…Okay. Then I'll keep holding it for him.","你們在說什麼？……算了，我想我的鎬去。":"What are you two on about? …Never mind. I'll go think about my picks.","礫大哥，如果有一件你忘掉的事，想起來會很難過——你想知道嗎？":"Grit, if there were something you'd forgotten, and remembering it would hurt — would you want to know?","想。難過也得是我自己難過，不能讓別人替我忘。":"I would. If it hurts, it should be me hurting. Nobody else should forget it for me.","朧把手輕輕放在礫的額頭上。":"Haze gently lays a hand on Grit's forehead.","……阿磐。":"…Crag.","……對。第二把鎬是他的。":"…Right. The second pick was his.","謝謝你，小兄弟。痛也是我的。":"Thank you, lad. The pain's mine too.","你先問了他。……我以前從來沒想過，可以先問。":"You asked him first. …I never thought before that you could ask first.","晶石亮了起來。東邊的石門轟隆隆地打開。":"The crystal lights up. The stone door to the east rumbles open.","那顆暗淡的晶石沒有發光——但北邊的岩壁，無聲地裂開了一道門。":"The dull crystal doesn't glow — but in the north rock wall, a doorway silently splits open.","潮鳴洞・晶廳":"Tidecall · Crystals","一只燈匠的工具袋，掛在石筍上。裡面夾著一頁日記。":"A lampwright's tool bag hangs from a stalagmite. A diary page is tucked inside.","又輕了一點。":"A little lighter again.","……小蕨，我是不是忘了一件很重要的事？":"…Fern, did I forget something really important?","【蒼火】收進了引火燈。村子東邊的霧牆，現在應該照得開了。":"The [Azure Ember] goes into the Ember Lantern. Its light should now get you through the wall of mist east of the village.","一道光同時穿過三顆晶石。祭壇前的石門打開了。":"A single beam passes through all three crystals at once. The stone door before the altar opens.","大廳裡有三顆晶石。看來得讓同一道光把它們全部串起來。":"There are three crystals in the hall. It looks like one beam has to string them all together.","小心那個飄來飄去的影子。它是霧，可是它已經不記得自己是誰了。被它碰到，你也會忘記一下下。":"Careful of that drifting shadow. It's mist, but it doesn't remember who it is anymore. If it touches you, you'll forget for a little bit too.","潮鳴洞・暗室":"Tidecall · Grotto","暗室中央立著一面石碑，字跡被人刻意鑿過，但還讀得出來。你把它拓了下來。":"A stele stands in the middle of the dark room. Someone chiseled at the words on purpose, but they can still be read. You take a rubbing.","所以我一直在找的，不是「東西」。":"So what I've been searching for all along isn't a “thing.”","是一個人。":"It's a person.","星":"Star","月":"Moon","日":"Sun","風":"Wind","刻著「":"carved with “","」的火盆正在燃燒。":"” is burning.","你用引火燈點燃了刻著「":"You light the brazier carved with “","」的火盆。":"”.","星、月、日、風。四道火光連成一線，北邊的石門緩緩升起。":"Star, Moon, Sun, Wind. The four flames join in a line, and the north stone gate slowly rises.","風、日、月、星。火焰倒著燒了一圈——東牆的沙簌簌落下，露出一道向下的窄門。":"Wind, Sun, Moon, Star. The fire burns its circle backward — sand hisses down the east wall, revealing a narrow doorway leading down.","四座火盆同時「噗」地熄滅了。順序似乎不對。":"All four braziers go out at once with a “poof.” The order must be wrong.","赤砂遺跡・火盆庭":"Redsand · Braziers","一面普通的砂岩牆。":"An ordinary sandstone wall.","一片壁畫殘片：":"A fragment of mural: ","一只陶甕。裡面積著很久以前的雨水。":"A clay urn. It holds rainwater from long, long ago.","陶甕旁的刻痕：「●●● 甕，盛雨。」":"Marks by the urns: “●●● urns, holding the rain.”","石柱之間的刻痕：「▬● 柱，承天。」":"Marks among the pillars: “▬● pillars, holding up the sky.”","（庭院中央立著幾根石柱——數數看。）":"(Several stone pillars stand in the middle of the courtyard — count them.)","一座空台座，上面什麼也沒有。台座正面刻著：「○」":"An empty pedestal with nothing on it. Its front is carved with: “○”","別踩！——喔，是燈匠。抱歉，這裡每一粒沙我都編了號。":"Don't step there! —Oh, the lampwright. Sorry, I've numbered every grain of sand in here.","我是蓼，從本島來做研究的。這座庭院有四座火盆，各刻著星、月、日、風。照壁畫說，得按正確的順序點燃，北門才會開。":"I'm Sorrel, here from the mainland to do research. This courtyard has four braziers, carved Star, Moon, Sun and Wind. The mural says they must be lit in the right order to open the north gate.","可惜壁畫碎成三片，散在院子裡。你腳程快，自己去讀吧。":"Sadly the mural broke into three pieces, scattered about. You're quick on your feet — go read them.","對了，先民的數字很有意思——他們不寫字，只畫點和橫槓。院子裡有幾處標了數量，對照實物就看得懂。":"Oh, and the Ancients' numbers are fascinating — no writing, just dots and bars. A few spots in the courtyard are marked with counts; compare them with the real objects and you'll crack it.","門開了！你比我帶來的三個助手加起來還管用。":"The gate's open! You're more use than my three assistants put together.","……奇怪，壁畫背面還刻了一行小字：「逆行者見其裡」。":"…Odd. There's a line of small writing on the back of the mural: “Who walks it backward sees what lies within.”","逆行……是要把什麼反過來呢？":"Backward… but reverse what?","東牆居然有暗門！等你出來，一定要告訴我裡面寫了什麼。……不，還是別告訴我，我自己看。":"A hidden door in the east wall! When you come out, you must tell me what's written inside. …No, don't tell me. I'll look myself.","「逆行者見其裡」……我還在想。":"“Who walks it backward sees what lies within”… I'm still thinking.","星、月、日、風，哪個先哪個後，壁畫上應該都有寫。":"Star, Moon, Sun, Wind — which comes first and which after, the mural should say.","走出石廊的瞬間，天色變成了鐵鏽色。沙暴來了。":"As you leave the stone hall, the sky turns the color of rust. A sandstorm!","小蕨，躲到我裡面來！霧擋得住沙。":"Fern, hide inside my mist! Mist can keep the sand out.","可是……你的燈太亮了。我一靠近就會被燙到。":"But… your lamp is too bright. If I get close, it burns me.","把燈火捻到最小":"Turn the lamp down low","「不行，燈一暗我會忘記事情。」":"“If it dims, I'll forget.”","你把燈芯捻到只剩一粒豆大的光。霧立刻裹住了你，涼涼的，像井水。":"You turn the wick down to a flame no bigger than a bean. The mist wraps around you at once, cool, like well water.","沙暴過去了。你發現自己一時想不起今天早餐吃了什麼——但也只是這樣而已。":"The sandstorm passes. You find you can't recall what you had for breakfast — but that's all.","你看，我沒有吃你的記憶。……只是不小心碰掉了一點點。對不起。":"See? I didn't eat your memories. …I just knocked a tiny bit loose by accident. Sorry.","你護著燈蹲在石柱後面。朧站在風口替你擋沙，霧氣被燈火燙得滋滋作響。":"You crouch behind a pillar, shielding the lamp. Haze stands in the wind to block the sand, her mist hissing against the flame.","……沒關係。我知道你會怕。":"…It's okay. I know you're scared.","赤砂遺跡・符文廊":"Redsand · Rune Hall","廊道入口的石碑：":"The stele at the hall's entrance:","（前方的地板刻滿了三種符文：眼睛、手掌、心。流沙一動，它們就會換位置。）":"(The floor ahead is carved with three kinds of runes: eye, hand, heart. Whenever the quicksand shifts, they change places.)","石門前的石板上刻著四組記號：":"The tablet before the stone door bears four groups of marks:","「▬●●　○　●●●●　▬●●●●」":"“▬●●   ○   ●●●●   ▬●●●●”","石門上嵌著四個可以轉動的石環，每個石環都刻著 0 到 9。":"Four stone rings are set into the door, each one carved with 0 to 9.","石門的數字環":"Stone Door Number Rings","石環轉回了原位。數字不對。":"The rings turn back to their places. Wrong numbers.","你決定再看看附近的線索。":"You decide to look at the clues nearby again.","四個石環同時卡進定位。石門沉入地下。":"All four rings lock into place. The stone door sinks into the ground.","祭壇旁壓著一頁日記，紙邊被風沙磨得發毛。":"A diary page lies pinned beside the altar, its edges frayed by wind and sand.","小蕨……你師父，是自己把燈熄掉的。":"Fern… your master put out the lamp himself.","三顆了。胸口不痛了，可是……好像有誰在很遠的地方叫我。":"Three now. My chest doesn't hurt anymore, but… it's like someone far away is calling me.","【赤火】收進了引火燈。村子東北角的山路，現在應該照得開了。":"The [Crimson Ember] goes into the Ember Lantern. Its light should now get you up the mountain path at the village's northeast corner.","赤砂遺跡・裡室":"Redsand · Sanctum","壁畫上，兩個孩子手牽著手站在海面上。一個身上是晨光，一個身上是霧。":"In the mural, two children stand hand in hand upon the sea. One is clothed in dawn light, the other in mist.","畫的下半部被人用鑿子毀掉了。":"Someone has chiseled away the lower half.","裡室的石碑保存得很完整，像是刻的人希望有一天會有人讀到。你把它拓了下來。":"The stele in the inner room is perfectly preserved, as if its carver hoped someone would read it one day. You take a rubbing.","逆著順序、叫出名字，還有……我願不願意。":"Put them out in reverse, call the name, and… whether I'm willing.","我不知道。小蕨，我還不知道。":"I don't know. Fern, I don't know yet.","霜鐘山・冰湖":"Frostbell · Tarn","一小堆營火。柴是新添的。":"A small campfire. Fresh wood has been added.","先上塔吧，蕨。我腿凍傷了走不快，隨後就到。記住——鎖要反著解。":"Go on up the tower, Fern. My legs are frostbitten and slow; I'll follow. Remember — the locks must be undone in reverse.","噓——別吵。我在等鐘響。":"Shh — quiet. I'm waiting for the bell.","我是這座山的守鐘人……大概吧。醒來的時候，就坐在這裡了。":"I'm the bellkeeper of this mountain… I think. When I woke, I was sitting here.","你手上那盞燈，樣子真眼熟。":"That lamp in your hand looks awfully familiar.","是師父。可是他看你的眼神，像在看一個陌生人。":"It's Master. But he looks at you the way one looks at a stranger.","你拿出那把刻著「柏」字的銅匙。":"You take out the brass key engraved “Cypress.”","柏……？":"Cypress…?","等等。讓我想想。":"Wait. Let me think.","孩子，我問你幾件事。也許問著問著，我就想起來了。":"Child, let me ask you a few things. Perhaps in the asking, I'll remember.","再試一次吧。我問，你答。":"Let's try again. I ask, you answer.","森林的樹洞裡":"Inside a hollow forest tree","碼頭的空船裡":"In an empty boat at the dock","鐘樓的台階上":"On the bell tower steps","我……是在哪裡遇見你的？":"Where… was it that I found you?","把燈罩擦三遍":"Wipe the lamp glass 3 times","喝一杯熱茶":"Drink a cup of hot tea","哼完一首搖籃謠":"Hum a lullaby to the end","我每晚點燈之前，一定會做一件事。是什麼？":"Every night before I light the lamp, there's one thing I always do. What is it?","去替大燈添油":"To add oil to the Great Lamp","去親手把燈熄掉":"To put the lamp out myself","去修理被霧弄壞的鎖":"To fix a lock the mist broke","最後一個。……三天前，我為什麼要上塔？":"Last one. …Three days ago, why did I go up the tower?","……不對。聽起來不像我。":"…No. That doesn't sound like me.","抱歉，孩子。我還是想不起來。（也許該回頭讀一讀日誌裡的日記。）":"Sorry, child. I still can't remember. (Maybe reread the diary pages in your journal.)","……蕨。":"…Fern.","你長高了。……不對，才三天。是我忘得太多了。":"You've grown taller. …No, it's only been three days. I've simply forgotten too much.","聽我說。大燈裡燒的不是油，是一個活著的靈，叫做曦。一百年了，它一直在哭。":"Listen. What burns in the Great Lamp isn't oil. It's a living spirit, called Dawn. For a hundred years it has been crying.","我把燈熄了，想放它走。但四把火鎖還在，它出不來；霧卻趁燈滅湧了上來，把我的名字也捲走了。":"I put out the lamp to let it go. But the four fire-locks still hold, and it can't get out. And with the lamp dark, the mist surged up and swept away even my name.","蘆婆知道這件事，歷代村長都知道。……小心她。她想的不是放走曦，而是換一個新的進去。":"Granny Reed knows all this; every village elder has known. …Be careful of her. She doesn't want Dawn freed — she wants to put a new one in.","老爺爺，對不起。你的名字是我撿走的。現在還你了。":"Grandpa, I'm sorry. I was the one who picked up your name. I'm giving it back now.","不怪你，孩子。是我自己走進霧裡的。":"It's not your fault, child. I walked into the mist myself.","我腿凍傷了，走不快。你先上塔。記住——鎖是先民照順序上的，要解，就得反著來。":"My legs are frostbitten; I can't go fast. You go up the tower first. Remember — the Ancients set the locks in order. To undo them, go in reverse.","好高。從這裡看得到燈塔。":"So high. You can see the lighthouse from here.","小蕨，如果大燈重新亮起來，我就再也不能靠近村子了。":"Fern, if the Great Lamp lights again, I'll never be able to go near the village again.","……你還是會點它嗎？":"…Will you still light it?","「我會想出別的辦法。」":"“I'll find another way.”","「村子裡的人比較重要。」":"“The villagers matter more.”","「你只是霧而已。」":"“You're just mist.”","別的辦法……":"Another way…","嗯。我等你。":"Mm. I'll wait for you.","……也是。他們會忘記自己的名字。我懂。":"…I guess so. They'd forget their own names. I understand.","…………嗯。我只是霧。":"…………Mm. I'm just mist.","冰面很滑：一踏上去，就會一路滑到撞上東西為止。":"The ice is slippery: once you step on, you slide all the way until you hit something.","大鐘":"Great Bell","咚——":"Bong—","中鐘":"Middle Bell","噹——":"Clang—","小鐘":"Small Bell","叮——":"Ding—","：「":": “","」":"”","咚、咚、叮、噹、叮、咚。最後一個音落下，整座山安靜了一瞬。":"Bong, bong, ding, clang, ding, bong. As the last note fades, the whole mountain falls silent for a moment.","祠堂的冰門裂開了。":"The shrine's ice door cracks open.","這首歌……我也會。很久以前，有人每天晚上對著海唱。":"This song… I know it too. Long ago, someone sang it to the sea every night.","霜鐘山・鐘台":"Frostbell · Belfry","鐘台的銘牌：「鐘聲不識字，只認得哄孩子入睡的那支曲子。」":"The belfry plaque: “The bells cannot read. They know only the song that lulls a child to sleep.”","三口鐘由大到小排成一列。":"Three bells hang in a row, from largest to smallest.","四顆都在你的燈裡了。……它們在叫我。好吵。":"All four are in your lamp now. …They're calling me. So loud.","【白火】收進了引火燈。四顆火種到齊，通往燈塔的石階應該看得見了——就在村子正北方。":"The [White Ember] goes into the Ember Lantern. All four embers gathered — the stone steps to the lighthouse should be visible now, due north of the village.","北":"North","東":"East","南":"South","西":"West","火種在台座上靜靜燃燒。":"The ember burns quietly on the pedestal.","你把":"You take the ","收回燈裡。":" back into the lamp.","放上":"Place the ","先不放":"Not now","方的台座。要放上哪一顆火種？":" pedestal. Which ember goes here?","四顆火種各歸其位。地板上的羅盤亮了起來，通往上層的鐵門打開了。":"Each ember in its place. The compass on the floor lights up, and the iron door to the upper floor opens.","火種化成四道光，順著牆上的溝槽往塔頂流去——它們還在你的燈裡留著餘燼。":"The embers become four beams of light that flow up the grooves in the walls toward the top — yet their glow still lingers in your lamp.","火焰猛地晃了一下，四顆火種滾回了你的燈裡。位置不對。":"The flames lurch, and the four embers roll back into your lamp. Wrong positions.","（四座祠堂的碑文都記在日誌裡。）":"(All four shrine inscriptions are in your journal.)","燈塔・塔底":"Lighthouse · Base","到了塔頂，拔開瓶塞就行。為了村子，蕨。":"At the top of the tower, just pull the stopper. For the village, Fern.","瓶子就在那裡。上到塔頂，你會明白我是對的。":"The bottle's right there. Get to the top and you'll see I'm right.","蘆婆留下的鎖霧瓶。":"The Mistlock Bottle Granny Reed left behind.","拿起來":"Pick it up","不碰它":"Leave it be","小蕨……？":"Fern…?","你來了。四顆都齊了，很好。":"You've come. All four gathered. Good.","蕨，有件事只有歷代村長知道。大燈燒的不是油，是霧靈的半身。它燒了一百年，快燒完了。":"Fern, only the elders have known this. The Great Lamp doesn't burn oil — it burns half of a mist spirit. A hundred years now, and it's nearly spent.","就算你把火種放回去，也撐不了幾年。到時候霧會再來，而島上不會再有第二個燈匠。":"Even if you put the embers back, it won't last more than a few years. Then the mist will return, and this island will have no second lampwright.","但還有一個辦法。":"But there is one other way.","你身後那個——別裝了，我看得見它的輪廓——那是另外半身。把它也鎖進去，燈就能再亮一百年。":"That thing behind you — don't pretend, I can see its outline — is the other half. Lock it in too, and the lamp will burn another hundred years.","你從森林帶回來的那瓶霧螢，我試過了。瓶子管用。":"The mistfly jar you brought back from the forest — I tested it. The jar works.","這是鎖霧瓶。到了塔頂，拔開瓶塞就行。":"This is a Mistlock Bottle. At the top of the tower, just pull the stopper.","收下鎖霧瓶":"Take the Mistlock Bottle","「我不會這麼做。」":"“I won't do it.”","好孩子。為了村子。":"Good child. For the village.","……跟你師父一個脾氣。":"…Just as stubborn as your master.","瓶子我放在這裡。上到塔頂，你會改變主意的。":"I'll leave the bottle here. Once you reach the top, you'll change your mind.","塔底立著四座台座。得先把四顆火種放到正確的位置，上層的門才會開。":"Four pedestals stand in the tower base. Set the four embers in the right places and the upper door will open.","燈塔・機關層":"Lighthouse · Gears","光穿過兩道柵門，點亮了晶石。通往塔頂的門開了。":"The light passes through both bar gates and lights the crystal. The door to the top opens.","先民留下的最後一道機關：壓力板、柵門、鏡子，全都用上了。":"The Ancients' final mechanism: pressure plates, bar gates, mirrors — all of them at once.","上面就是它了。我聽得見。":"It's right up there. I can hear it.","放回四顆火種，重新點燃大燈":"Relight with all four embers","砸碎燈座":"Smash the lamp's base","逆著封印，解開四把火鎖":"Unseal the locks in reverse","拔開鎖霧瓶的瓶塞":"Open the Mistlock Bottle","再想一想":"Think it over","你站在大燈前。燈座裡那一小團微光，隨著你的呼吸一明一滅。":"You stand before the Great Lamp. In its base, a tiny glimmer brightens and dims with your breathing.","該怎麼做？":"What will you do?","……又要關起來了嗎。……沒關係。我習慣了。":"…Locked up again? …It's all right. I'm used to it.","點燃大燈":"Light the Great Lamp","等一下":"Wait","你把四顆火種一一按回鎖孔。":"One by one, you press the four embers back into the keyholes.","大燈轟然亮起。":"The Great Lamp roars to life.","光像潮水一樣漫過整座島，霧退到了海平線之外。":"Light floods the island like a tide, and the mist retreats beyond the horizon.","燈裡的哭聲停了——或者只是被火焰的聲音蓋了過去。":"The crying in the lamp stops — or perhaps it's only drowned out by the roar of the flame.","小蕨，謝謝你陪我走這一段。……再見。":"Fern, thank you for walking this stretch with me. …Goodbye.","你回頭時，身後已經沒有任何影子。":"When you look back, there's no shadow behind you anymore.","村子保住了。阿麥又叫得出女兒的名字。":"The village is saved. Barley can call his daughter by name again.","你成了新的守燈人。每晚點燈前，你也開始哼那首搖籃謠——不哼完，手會抖。":"You become the new lampkeeper. Every night before lighting the lamp, you too hum that lullaby — if you don't finish it, your hands shake.","小蕨，等一下，鎖還——":"Fern, wait, the locks are still—","砸下去":"Bring it down","停手":"Stop","你舉起師父留在塔頂的鐵鎚，砸向燈座。":"You raise the iron hammer Master left up here and bring it down on the lamp's base.","四把火鎖還扣著。燈座碎了，曦卻沒能出來——那團微光閃了兩下，散進風裡。":"The four fire-locks still hold. The base shatters, but Dawn cannot get out — the glimmer flickers twice and scatters on the wind.","曦——！":"Dawn—!","霧失去了要找的東西，也失去了停下來的理由。它漫過村子，漫過碼頭，漫過每一張臉。":"Having lost what it was searching for, the mist loses its reason to stop. It rolls over the village, over the dock, over every face.","很多年後，島上的人過得平靜而快樂。沒有人記得這裡曾經有過燈，也沒有人記得自己忘了什麼。":"Many years later, the islanders live calm and happy lives. No one remembers there was ever a lamp here, and no one remembers what they've forgotten.","只有你偶爾會在霧裡停下腳步，覺得好像有誰跟在身後。":"Only you, now and then, stop in the mist, feeling as if someone is following you.","小蕨？那個瓶子……":"Fern? That bottle…","拔開瓶塞":"Pull the stopper","把瓶子收回去":"Put the bottle away","你拔開了瓶塞。":"You pull the stopper.","等——":"Wai—","霧被瓶子吸了進去，連同那聲沒喊完的名字。你把瓶子按進燈座。":"The mist is sucked into the bottle, along with the name it never finished calling. You press the bottle into the lamp's base.","大燈亮了。比以前任何時候都亮，亮得刺眼。":"The Great Lamp lights. Brighter than it has ever been — so bright it hurts.","做得好。這樣，又是一百年。":"Well done. That's another hundred years.","現在，燈裡的哭聲有兩個。":"Now there are two voices crying in the lamp.","村裡的人什麼也沒忘——除了你以外的人，都睡得很好。":"No one in the village forgets anything — and everyone but you sleeps well.","你記得每一件事，包括它最後看你的那個眼神。":"You remember everything, including the last look Haze gave you.","小蕨，我……還不敢。":"Fern, I… I'm still too scared.","這一路上，我不確定你是不是真的把我當成「誰」。":"This whole way, I wasn't sure you really saw me as a “someone.”","對不起。碑文說，我不願意的話，鎖是不會開的。":"I'm sorry. The inscription said that if I'm not willing, the lock won't open.","嗯。我願意。小蕨，我相信你。":"Mm. I'm willing. Fern, I trust you.","碑文說：逆封之序而滅四火，呼其真名。":"The inscription: put out the four fires in reverse of the sealing order, and call its true name.","第 ":"Lock "," 把鎖——要先熄滅哪一顆火種？":" — which ember do you put out?","曜":"Blaze","晞":"Dusk","暉":"Glow","「":"“","四顆火種都按進了鎖孔。現在，呼喚燈中之靈的真名——":"All four embers are pressed into the keyholes. Now, call the true name of the spirit in the lamp—","鎖孔噴出一陣熱風，把你推開。四顆火種滾回了燈裡。":"Hot wind bursts from the keyholes and throws you back. The four embers roll back into your lamp.","不對……再想想。碑文上都寫了的。":"That's not it… think again. It's all written in the inscriptions.","白、赤、蒼、翠。四把鎖依序熄滅。":"White, Crimson, Azure, Jade. The four locks go out one by one.","——曦！":"—Dawn!","燈座裂開。一團晨光般的火，搖搖晃晃地飄了出來。":"The lamp's base splits open. A flame like the light of dawn comes floating out, wobbling.","朧。妳長大了。":"Haze. You've grown.","是妳變小了啦。":"No, you got smaller!","兩個靈的手碰在一起。霧沒有散，卻變得很薄、很亮，像清晨照進窗戶的那種光。":"The two spirits' hands touch. The mist doesn't clear — it turns thin and bright, like the light through a window at daybreak.","……原來如此。不是用燈把霧趕走，是讓霧自己帶著光。":"…So that's how it is. Not driving the mist away with a lamp — but letting the mist carry its own light.","被霧撿走的記憶，一夜之間都回到了主人身上。阿麥抱著小穗，哭了一整個早上。":"Overnight, every memory the mist had taken returned to its owner. Barley held Tassel and cried all morning.","……一百年。我們居然關了它一百年。":"…A hundred years. We kept it locked up for a hundred years.","霧嶼從此沒有大燈。每天清晨，會有一層發光的薄霧從海上升起，島民管它叫「曦朧」。":"From then on, Mist Isle has no Great Lamp. Every dawn a thin, glowing mist rises from the sea, and the islanders call it “Dawnhaze.”","而燈匠工坊的窗台上，偶爾會多出兩個小小的、並肩坐著的影子。":"And on the windowsill of the lampwright's workshop, now and then, two small shadows sit side by side.","燈塔・塔頂":"Lighthouse · Summit","塔頂。巨大的燈座裡沒有火，只有四個空著的鎖孔，和一小團幾乎看不見的微光。":"The top of the tower. There's no fire in the huge lamp base — only four empty keyholes, and a tiny, nearly invisible glimmer.","……誰？":"…Who's there?","……好冷。朧？是朧嗎？":"…So cold. Haze? Is that you, Haze?","……曦。":"…Dawn.","我想起來了。我一直在找的，是妳。":"I remember now. The one I've been searching for all along — it was you.","你握緊了引火燈。四顆火種在燈裡輕輕地響。":"You grip the Ember Lantern. The four embers chime softly inside.","日誌更新：":"Journal updated: ","霧嶼・西岸":"Mist Isle · West Shore","翠火之地":"Land of the Jade Ember","蒼火之地":"Land of the Azure Ember","赤火之地":"Land of the Crimson Ember","白火之地":"Land of the White Ember","大燈塔":"The Great Lighthouse","獲得物品":"Item Obtained","【":"[","】":"]","好":"OK","點 ▲▼ 轉動數字，再按「確定」。":"Tap ▲▼ to turn the digits, then press “OK”.","←→ 選擇轉盤，↑↓ 轉動數字，Enter 確定，Esc 離開。":"←→ choose a dial, ↑↓ turn it, Enter to confirm, Esc to leave."," 位加一":" up"," 位減一":" down","確定":"OK","離開":"Leave","全部":"All","物品":"Items","日誌":"Journal","系統":"System","火種 ":"Embers ","背包是空的。":"Your bag is empty.","還沒有記錄。調查場景、和人說話，線索會自動記在這裡。":"Nothing recorded yet. Examine things and talk to people; clues are noted here automaticall function warpTo(room, marker, dir, cond, denyLines) {
  var w = { type: 'warp', to: [room, marker, dir] };
  if (cond) { w.cond = cond; w.fog = true; w.deny = function* (g) { g.sfx('deny'); yield* talk('', denyLines); }; }
  return w;
}
function sign(spr, lines, extra) {
  return Object.assign({ type: 'obj', spr: spr, script: function* (g) { yield* talk('', typeof lines === 'function' ? lines(g) : lines); } }, extra || {});
}
function altar(n, noteId, clue, after) {
  return {
    type: 'obj', spr: 'altar', ember: n, light: 3,
    script: function* (g) {
      if (g.flag('ember' + n)) { yield say('', '空了的祭壇。碑文還在：' + clue); return; }
      yield say('', '祭壇上浮著一顆火種。台座刻著先民的字：');
      yield say('', clue);
      g.note(noteId);
      g.set('ember' + n);
      yield fx('flash', { color: '#ffffff' });
      yield* gain(g, 'ember' + n);
      yield* after(g);

}

var BRAZ = { S: '星', L: '月', R: '日', F: '風' };
function brazier(sym) {
  return {
    type: 'obj', spr: 'brazier', sym: sym, script: function* (g, e) {
      var v = g.vars(); v.seq = v.seq || '';
      if (e.st.lit) { yield say('', '刻著「' + BRAZ[sym] + '」的火盆正在燃燒。'); return; }
      e.st.lit = 1; v.seq += sym; g.sfx('fire');
      yield say('', '你用引火燈點燃了刻著「' + BRAZ[sym] + '」的火盆。');
      if (v.seq.length < 4) return;
      var s = v.seq; v.seq = '';
      if (s === 'SLRF' && !g.flag('r1_open')) {
        g.set('r1_open'); g.sfx('solve'); yield fx('shake');
        yield say('', '星、月、日、風。四道火光連成一線，北邊的石門緩緩升起。');
      } else if (s === 'FRLS' && !g.flag('r1_secret')) {
        g.set('r1_secret'); g.sfx('secret'); yield fx('shake');
        yield say('', '風、日、月、星。火焰倒著燒了一圈——東牆的沙簌簌落下，露出一道向下的窄門。');
      } else {
        g.sfx('deny'); yield fx('shake');
        yield say('', '四座火盆同時「噗」地熄滅了。順序似乎不對。');
      }
      g.ents.forEach(function (o) { if (o.spr === 'brazier') delete o.st.lit; });
    }
  };
}
