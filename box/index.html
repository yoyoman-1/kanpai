<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>剛好框｜框出剛好的數字</title>
<meta name="description" content="拖曳框出數字加總剛好等於目標的長方形，找齊全部就過關。每日一題、免註冊、手機就能玩的數字小遊戲。">
<meta property="og:title" content="剛好框｜一個框，剛剛好">
<meta property="og:description" content="拖曳框出加總剛好等於目標的長方形，你能找齊幾個？每日一題，和朋友比秒數。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://yoyoman-1.github.io/kanpai/box/">
<meta name="theme-color" content="#fbf4e6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='14' fill='%23fbf4e6' stroke='%23ff6b4a' stroke-width='7'/%3E%3Ctext x='32' y='43' font-size='28' text-anchor='middle' font-family='sans-serif' font-weight='900' fill='%23332a24'%3E=%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#fbf4e6; --paper:#fffdf8; --ink:#332a24; --soft:#8a7d70; --line:#e8dcc8;
  --accent:#ff6b4a; --good:#22a06b; --bad:#e5484d; --cell:#fff7ea;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Huninn","jf open 粉圓","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{width:100%;max-width:480px;padding:16px 16px 28px;flex:1;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;letter-spacing:1px;background:none;border:0;padding:0}
.logo i{width:26px;height:26px;border:4px solid var(--accent);border-radius:8px;display:inline-block;position:relative}
.logo i:after{content:"";position:absolute;inset:5px;border:3px solid var(--ink);border-radius:3px}
.hbtn{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}
.hidden{display:none!important}

/* home */
.hero{text-align:center;padding:18px 0 8px}
.hero small{display:block;color:var(--accent);font-weight:700;letter-spacing:3px;font-size:12px}
.hero h1{font-size:44px;margin:6px 0 4px;letter-spacing:4px}
.hero h1 span{border:5px solid var(--accent);border-radius:16px;padding:0 8px;margin-left:4px}
.hero p{color:var(--soft);margin:6px 0 0;font-size:15px;line-height:1.6}
.demo{margin:16px auto 6px;width:180px}
.modes{display:grid;gap:10px;margin-top:14px}
.mode{display:flex;align-items:center;gap:12px;text-align:left;background:var(--paper);border:2px solid var(--line);
  border-radius:18px;padding:14px;transition:transform .12s,border-color .12s}
.mode:active{transform:scale(.98)}
.mode:hover{border-color:var(--accent)}
.mode .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;font-weight:900;flex:none}
.mode b{display:block;font-size:17px}
.mode span{display:block;color:var(--soft);font-size:13px;margin-top:2px}
.mode em{margin-left:auto;font-style:normal;font-size:12px;color:var(--soft);text-align:right;white-space:nowrap}
.mode.daily{border-color:var(--accent);background:#fff1ea}
.rule{margin-top:16px;background:var(--paper);border:2px dashed var(--line);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.7;color:#5b4f45}
.rule b{color:var(--ink)}
footer{text-align:center;color:var(--soft);font-size:12px;margin-top:18px;letter-spacing:1px}
footer a{color:var(--soft)}

/* game */
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:4px 0 10px}
.target{justify-self:center;text-align:center}
.target small{display:block;font-size:12px;color:var(--soft);letter-spacing:2px}
.target b{display:inline-block;font-size:38px;line-height:1;min-width:76px;padding:6px 12px;border:4px solid var(--accent);border-radius:16px;background:var(--paper)}
.stat{font-size:14px;color:var(--soft)}
.stat b{display:block;font-size:22px;color:var(--ink)}
.stat.r{text-align:right}
.live{height:34px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.pill{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:700;font-size:16px;transition:all .12s}
.pill.eq{border-color:var(--good);color:var(--good);transform:scale(1.08)}
.pill.over{color:var(--bad);border-color:#f3b3b5}
.board{position:relative;width:100%;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;margin:0 auto}
.grid{position:absolute;inset:0;display:grid;gap:5px}
.cell{background:var(--cell);border:2px solid var(--line);border-radius:12px;display:grid;place-items:center;font-weight:800;
  font-size:var(--fs,26px);transition:background .1s}
.cell.sel{background:#ffe2d8;border-color:#ffb39f}
.cell.sel.eq{background:#d9f5e6;border-color:#8fd6b0}
.frames{position:absolute;inset:0;pointer-events:none}
.frame{position:absolute;border:4px solid;border-radius:14px;animation:pop .35s ease-out}
.frame.hint{border-style:dashed;opacity:.75}
.frame.miss{border-style:dotted;opacity:.9}
@keyframes pop{0%{transform:scale(1.12);opacity:0}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,-10px);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;
  font-size:15px;opacity:0;pointer-events:none;transition:all .2s;z-index:20;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:14px 0 4px;min-height:14px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.actions{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:11px 8px;font-weight:700;font-size:15px}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45}
.tip{color:var(--soft);font-size:13px;text-align:center;margin-top:10px;line-height:1.5}

/* modal */
.mask{position:fixed;inset:0;background:rgba(51,42,36,.45);display:grid;place-items:center;padding:16px;z-index:30}
.card{width:100%;max-width:380px;background:var(--paper);border-radius:22px;padding:22px 18px 18px;text-align:center;animation:pop .3s}
.card h2{margin:4px 0 2px;font-size:26px}
.card .big{font-size:44px;font-weight:900;margin:8px 0 2px}
.card p{color:var(--soft);margin:4px 0;font-size:14px;line-height:1.6}
.stars{font-size:30px;letter-spacing:4px;margin:4px 0}
.card .actions{flex-wrap:wrap}
.card .btn{min-width:40%}
@media (max-width:360px){.hero h1{font-size:38px}.target b{font-size:32px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="logo" id="home-btn" aria-label="回首頁"><i></i>剛好框</button>
    <button class="hbtn hidden" id="back-btn">← 換題型</button>
  </header>

  <!-- 首頁 -->
  <section id="home">
    <div class="hero">
      <small>JUST · RIGHT · BOX</small>
      <h1>剛好<span>框</span></h1>
      <p>一張數字盤，藏著好幾個「剛剛好」。<br>你能把它們全部框出來嗎？</p>
    </div>
    <svg class="demo" viewBox="0 0 180 120" aria-hidden="true">
      <g font-size="22" font-weight="800" text-anchor="middle" fill="#332a24">
        <rect x="2" y="2" width="56" height="56" rx="10" fill="#fff7ea" stroke="#e8dcc8" stroke-width="2"/><text x="30" y="38">2</text>
        <rect x="62" y="2" width="56" height="56" rx="10" fill="#fff7ea" stroke="#e8dcc8" stroke-width="2"/><text x="90" y="38">5</text>
        <rect x="122" y="2" width="56" height="56" rx="10" fill="#fff7ea" stroke="#e8dcc8" stroke-width="2"/><text x="150" y="38">1</text>
        <rect x="2" y="62" width="56" height="56" rx="10" fill="#fff7ea" stroke="#e8dcc8" stroke-width="2"/><text x="30" y="98">4</text>
        <rect x="62" y="62" width="56" height="56" rx="10" fill="#fff7ea" stroke="#e8dcc8" stroke-width="2"/><text x="90" y="98">3</text>
        <rect x="122" y="62" width="56" height="56" rx="10" fill="#fff7ea" stroke="#e8dcc8" stroke-width="2"/><text x="150" y="98">6</text>
      </g>
      <rect x="1" y="1" width="118" height="58" rx="12" fill="none" stroke="#ff6b4a" stroke-width="4"/>
      <rect x="121" y="1" width="58" height="118" rx="12" fill="none" stroke="#4a7dff" stroke-width="4"/>
    </svg>
    <p class="tip" style="margin-top:0">目標 7：2＋5 ✓、1＋6 ✓、4＋3 ✓ … 還有嗎？</p>

    <div class="modes" id="modes"></div>

    <div class="rule">
      <b>怎麼玩</b>：在盤面上<b>拖曳</b>框出一個長方形（單一格也算），裡面的數字加起來<b>剛好等於目標</b>就算找到。<br>
      把所有符合的長方形找齊就過關。卡住可以按「提示」，但會加 15 秒。
    </div>
    <footer>BOXED JUST RIGHT · <a href="../">乾杯遊戲機</a> 的小遊戲</footer>
  </section>

  <!-- 遊戲 -->
  <section id="game" class="hidden">
    <div class="bar">
      <div class="stat"><span id="mode-name">普通</span><b id="timer">0:00</b></div>
      <div class="target"><small>目標</small><b id="target">0</b></div>
      <div class="stat r">已找到<b><span id="found">0</span> / <span id="total">0</span></b></div>
    </div>
    <div class="live"><div class="pill" id="live">拖曳框出數字</div></div>
    <div class="board" id="board">
      <div class="grid" id="grid"></div>
      <div class="frames" id="frames"></div>
    </div>
    <div class="dots" id="dots"></div>
    <div class="actions">
      <button class="btn" id="hint-btn">💡 提示 (+15秒)</button>
      <button class="btn" id="give-btn">🏳️ 看答案</button>
    </div>
    <p class="tip">從一格按住，拖到另一格放開。點一下單格＝框那一格。</p>
  </section>
</div>

<div class="toast" id="toast"></div>
<div class="mask hidden" id="result"><div class="card" id="result-card"></div></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const SITE = 'https://yoyoman-1.github.io/kanpai/box/';

// ---------- 統計 ----------
const UMAMI_ID = '7116ffc5-6612-4917-9ff3-f57cf074b807';
const track = (name, data) => { try { window.umami && window.umami.track(name, data); } catch (e) {} };
if (UMAMI_ID && /github\.io$/.test(location.hostname)) {
  const sc = document.createElement('script');
  sc.defer = true; sc.src = 'https://cloud.umami.is/script.js'; sc.dataset.websiteId = UMAMI_ID;
  document.head.appendChild(sc);
}
const store = {
  get(k, d) { try { const v = localStorage.getItem('box:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('box:' + k, JSON.stringify(v)); } catch (e) {} },
};

// ---------- 題型 ----------
const MODES = {
  daily: { name: '每日一題', desc: '全世界同一題，和朋友比秒數', icon: '📅', color: '#ffd9cc', n: 5, lo: 1, hi: 9, zero: 0, range: [7, 12] },
  easy:  { name: '輕鬆',   desc: '4×4・數字 1～5',             icon: '4',  color: '#d9f5e6', n: 4, lo: 1, hi: 5, zero: 0, range: [4, 7] },
  normal:{ name: '普通',   desc: '5×5・數字 1～9',             icon: '5',  color: '#dce6ff', n: 5, lo: 1, hi: 9, zero: 0, range: [6, 10] },
  hard:  { name: '燒腦',   desc: '6×6・有 0 混在裡面，小心',     icon: '6',  color: '#f1defc', n: 6, lo: 1, hi: 9, zero: .14, range: [10, 16] },
};
const COLORS = ['#ff6b4a', '#4a7dff', '#22a06b', '#d14bd8', '#f5a524', '#0fa3b1', '#e5484d', '#7a5af8', '#8a6a00', '#ff4f9a'];

// 可重現亂數（每日一題用）
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

function allRects(g, n) {
  const P = Array.from({ length: n + 1 }, () => new Array(n + 1).fill(0));
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) P[r + 1][c + 1] = g[r][c] + P[r][c + 1] + P[r + 1][c] - P[r][c];
  const out = [];
  for (let r1 = 0; r1 < n; r1++) for (let r2 = r1; r2 < n; r2++) for (let c1 = 0; c1 < n; c1++) for (let c2 = c1; c2 < n; c2++)
    out.push({ r1, r2, c1, c2, s: P[r2 + 1][c2 + 1] - P[r1][c2 + 1] - P[r2 + 1][c1] + P[r1][c1] });
  return out;
}

function makePuzzle(modeId, rnd) {
  const m = MODES[modeId];
  for (let tries = 0; tries < 400; tries++) {
    const g = Array.from({ length: m.n }, () => Array.from({ length: m.n }, () =>
      rnd() < m.zero ? 0 : m.lo + Math.floor(rnd() * (m.hi - m.lo + 1))));
    const rects = allRects(g, m.n);
    const cnt = {};
    for (const r of rects) (cnt[r.s] = cnt[r.s] || []).push(r);
    // 目標至少 6 以上，答案要有大有小，不能全是單格
    const ok = Object.keys(cnt).map(Number).filter(t => {
      const L = cnt[t]; if (t < 6 || L.length < m.range[0] || L.length > m.range[1]) return false;
      const areas = new Set(L.map(r => (r.r2 - r.r1 + 1) * (r.c2 - r.c1 + 1)));
      return areas.size >= 3 && L.some(r => r.r2 > r.r1 && r.c2 > r.c1);
    });
    if (ok.length) {
      const t = ok[Math.floor(rnd() * ok.length)];
      return { g, n: m.n, target: t, answers: cnt[t].map(r => ({ ...r, key: `${r.r1},${r.c1},${r.r2},${r.c2}` })) };
    }
  }
  throw new Error('puzzle gen failed');
}

// ---------- 首頁 ----------
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function renderHome() {
  const best = store.get('best', {});
  const daily = store.get('daily', {});
  $('#modes').innerHTML = Object.entries(MODES).map(([id, m]) => {
    let right = best[id] != null ? `最佳 ${fmt(best[id])}` : '';
    if (id === 'daily') right = daily.date === today() ? `今天 ${fmt(daily.sec)} ✓` : '今日未挑戰';
    return `<button class="mode ${id === 'daily' ? 'daily' : ''}" data-mode="${id}">
      <div class="ic" style="background:${m.color}">${m.icon}</div>
      <div><b>${m.name}</b><span>${m.desc}</span></div><em>${right}</em></button>`;
  }).join('');
  document.querySelectorAll('.mode').forEach(b => b.onclick = () => start(b.dataset.mode));
}
function showHome() {
  stopTimer(); $('#result').classList.add('hidden');
  $('#game').classList.add('hidden'); $('#home').classList.remove('hidden'); $('#back-btn').classList.add('hidden');
  renderHome(); window.scrollTo(0, 0);
}
$('#home-btn').onclick = showHome; $('#back-btn').onclick = showHome;

// ---------- 遊戲 ----------
let G = null, timerId = 0;
function stopTimer() { clearInterval(timerId); timerId = 0; }
function elapsed() { return (performance.now() - G.t0) / 1000 + G.penalty; }

function start(modeId) {
  const rnd = modeId === 'daily' ? mulberry32(hashStr('box-' + today())) : Math.random;
  const P = makePuzzle(modeId, rnd);
  G = { ...P, mode: modeId, found: new Map(), hints: 0, penalty: 0, t0: performance.now(), done: false };
  $('#home').classList.add('hidden'); $('#game').classList.remove('hidden'); $('#back-btn').classList.remove('hidden');
  $('#mode-name').textContent = MODES[modeId].name;
  $('#target').textContent = G.target;
  $('#total').textContent = G.answers.length;
  const grid = $('#grid');
  grid.style.gridTemplateColumns = `repeat(${G.n},1fr)`;
  grid.style.setProperty('--fs', G.n >= 6 ? 'clamp(18px,6vw,26px)' : 'clamp(22px,7.5vw,32px)');
  grid.innerHTML = G.g.flat().map((v, i) => `<div class="cell" data-i="${i}">${v}</div>`).join('');
  $('#frames').innerHTML = ''; $('#hint-btn').disabled = false; $('#give-btn').disabled = false;
  setLive(null); renderProgress();
  stopTimer(); timerId = setInterval(() => $('#timer').textContent = fmt(elapsed()), 250); $('#timer').textContent = '0:00';
  track('box_start', { mode: modeId });
  window.scrollTo(0, 0);
}

function renderProgress() {
  $('#found').textContent = G.found.size;
  $('#dots').innerHTML = G.answers.map((a, i) => `<span class="dot" style="${i < G.found.size ? `background:${COLORS[i % COLORS.length]}` : ''}"></span>`).join('');
}

function addFrame(r, color, cls = '') {
  const n = G.n, k = G.found.size;
  const inset = 2 + (k % 3) * 3;
  const f = document.createElement('div');
  f.className = 'frame ' + cls;
  f.style.cssText = `left:calc(${r.c1 / n * 100}% + ${inset - 2}px);top:calc(${r.r1 / n * 100}% + ${inset - 2}px);` +
    `width:calc(${(r.c2 - r.c1 + 1) / n * 100}% - ${inset * 2 - 6}px);height:calc(${(r.r2 - r.r1 + 1) / n * 100}% - ${inset * 2 - 6}px);border-color:${color}`;
  $('#frames').appendChild(f);
}

let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1100); }
function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

function setLive(sum) {
  const el = $('#live');
  el.classList.remove('eq', 'over');
  if (sum == null) { el.textContent = G && G.found.size ? `還差 ${G.answers.length - G.found.size} 個` : '拖曳框出數字'; return; }
  el.textContent = `框內合計 ${sum}`;
  if (sum === G.target) el.classList.add('eq'); else if (sum > G.target) el.classList.add('over');
}

// 拖曳選取
let sel = null;
const board = $('#board');
function cellAt(e) {
  const b = board.getBoundingClientRect();
  const c = Math.floor((e.clientX - b.left) / b.width * G.n), r = Math.floor((e.clientY - b.top) / b.height * G.n);
  return { r: Math.max(0, Math.min(G.n - 1, r)), c: Math.max(0, Math.min(G.n - 1, c)) };
}
function curRect() {
  const { a, b } = sel;
  return { r1: Math.min(a.r, b.r), r2: Math.max(a.r, b.r), c1: Math.min(a.c, b.c), c2: Math.max(a.c, b.c) };
}
function paintSel() {
  const R = curRect(); let s = 0;
  for (let r = R.r1; r <= R.r2; r++) for (let c = R.c1; c <= R.c2; c++) s += G.g[r][c];
  const eq = s === G.target;
  document.querySelectorAll('.cell').forEach(el => {
    const i = +el.dataset.i, r = Math.floor(i / G.n), c = i % G.n;
    const on = r >= R.r1 && r <= R.r2 && c >= R.c1 && c <= R.c2;
    el.classList.toggle('sel', on); el.classList.toggle('eq', on && eq);
  });
  setLive(s); return { R, s };
}
board.addEventListener('pointerdown', e => {
  if (!G || G.done) return;
  e.preventDefault(); board.setPointerCapture(e.pointerId);
  const p = cellAt(e); sel = { a: p, b: p, id: e.pointerId }; paintSel();
});
board.addEventListener('pointermove', e => {
  if (!sel || e.pointerId !== sel.id) return;
  const p = cellAt(e); if (p.r !== sel.b.r || p.c !== sel.b.c) { sel.b = p; paintSel(); }
});
function endSel(e) {
  if (!sel || e.pointerId !== sel.id) return;
  const { R, s } = paintSel(); sel = null;
  document.querySelectorAll('.cell.sel').forEach(el => el.classList.remove('sel', 'eq'));
  const key = `${R.r1},${R.c1},${R.r2},${R.c2}`;
  if (s !== G.target) {
    setLive(null);
    if (R.r1 !== R.r2 || R.c1 !== R.c2 || s > G.target) { toast(`合計 ${s}，不是 ${G.target}`); board.classList.remove('shake'); void board.offsetWidth; board.classList.add('shake'); buzz(30); }
    return;
  }
  if (G.found.has(key)) { setLive(null); toast('這個找過了'); return; }
  G.found.set(key, 'me');
  addFrame(R, COLORS[(G.found.size - 1) % COLORS.length]);
  buzz([15, 40, 15]); renderProgress(); setLive(null);
  if (G.found.size === G.answers.length) finish(false);
  else toast(['剛好！', '漂亮！', '框到了！', '眼力不錯！'][Math.floor(Math.random() * 4)]);
}
board.addEventListener('pointerup', endSel);
board.addEventListener('pointercancel', endSel);

$('#hint-btn').onclick = () => {
  if (!G || G.done) return;
  const left = G.answers.filter(a => !G.found.has(a.key));
  if (!left.length) return;
  // 先給大的（比較難找）
  left.sort((a, b) => (b.r2 - b.r1 + 1) * (b.c2 - b.c1 + 1) - (a.r2 - a.r1 + 1) * (a.c2 - a.c1 + 1));
  const a = left[0];
  G.found.set(a.key, 'hint'); G.hints++; G.penalty += 15;
  addFrame(a, '#8a7d70', 'hint'); renderProgress(); setLive(null); toast('提示：+15 秒');
  if (G.found.size === G.answers.length) finish(false);
};
$('#give-btn').onclick = () => {
  if (!G || G.done) return;
  G.answers.filter(a => !G.found.has(a.key)).forEach(a => { addFrame(a, '#e5484d', 'miss'); });
  finish(true);
};

function finish(gaveUp) {
  G.done = true; stopTimer();
  const sec = Math.round(elapsed());
  $('#timer').textContent = fmt(sec);
  $('#hint-btn').disabled = true; $('#give-btn').disabled = true;
  const mine = [...G.found.values()].filter(v => v === 'me').length;
  const n = G.answers.length;
  let stars = 0, title;
  if (gaveUp) { title = mine ? `找到 ${mine} / ${n}` : '下次再戰'; }
  else {
    const par = { easy: 60, normal: 120, hard: 240, daily: 150 }[G.mode];
    stars = G.hints ? 1 : sec <= par ? 3 : 2;
    title = ['', '過關！', '很不錯！', '剛剛好！'][stars];
    const best = store.get('best', {});
    let record = false;
    if (!G.hints && (best[G.mode] == null || sec < best[G.mode])) { best[G.mode] = sec; store.set('best', best); record = true; }
    G.record = record;
  }
  if (G.mode === 'daily') {
    const d = store.get('daily', {});
    if (d.date !== today() && !gaveUp) store.set('daily', { date: today(), sec, hints: G.hints, stars });
  }
  track('box_clear', { mode: G.mode, sec, hints: G.hints, gaveUp: gaveUp ? 1 : 0, found: mine, total: n });

  const emo = G.answers.map(a => { const v = G.found.get(a.key); return v === 'me' ? '🟧' : v === 'hint' ? '⬜' : '⬛'; }).join('');
  const label = G.mode === 'daily' ? `每日 ${today().slice(5).replace('-', '/')}` : MODES[G.mode].name;
  const shareText = `剛好框｜${label} 目標 ${G.target}\n${gaveUp ? `找到 ${mine}/${n}` : `⏱ ${fmt(sec)}${G.hints ? ` 💡${G.hints}` : ''} ${'⭐'.repeat(stars)}`}\n${emo}\n${SITE}`;

  setTimeout(() => {
    $('#result-card').innerHTML = `
      <h2>${title}</h2>
      ${gaveUp ? '' : `<div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>`}
      <div class="big">${gaveUp ? `${mine} / ${n}` : fmt(sec)}</div>
      <p>${label}・目標 ${G.target}・共 ${n} 個框${G.hints ? `・用了 ${G.hints} 次提示` : ''}</p>
      ${G.record ? '<p style="color:var(--accent);font-weight:700">🎉 新紀錄！</p>' : ''}
      ${gaveUp ? '<p>紅色虛線是沒找到的答案。</p>' : ''}
      <p style="font-size:20px;letter-spacing:2px;word-break:break-all">${emo}</p>
      <div class="actions">
        <button class="btn main" id="share-btn">分享成績</button>
        ${G.mode === 'daily' ? '' : '<button class="btn" id="again-btn">再來一題</button>'}
        <button class="btn" id="look-btn">看盤面</button>
        <button class="btn" id="menu-btn">換題型</button>
      </div>`;
    $('#result').classList.remove('hidden');
    $('#share-btn').onclick = async () => {
      track('box_share', { mode: G.mode });
      try { if (navigator.share) { await navigator.share({ text: shareText }); return; } } catch (e) { if (e.name === 'AbortError') return; }
      try { await navigator.clipboard.writeText(shareText); toast('已複製，貼給朋友吧'); } catch (e) { prompt('複製這段分享：', shareText); }
    };
    const again = $('#again-btn'); if (again) again.onclick = () => { $('#result').classList.add('hidden'); start(G.mode); };
    $('#look-btn').onclick = () => $('#result').classList.add('hidden');
    $('#menu-btn').onclick = showHome;
  }, gaveUp ? 900 : 500);
}

renderHome();
// 網址 ?m=daily 直接開題
const qm = new URLSearchParams(location.search).get('m');
if (qm && MODES[qm]) start(qm);
</script>
</body>
</html>
