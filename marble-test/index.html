<style>
/* ===== 彈珠傳說：用戶端樣式（①b）。Q 版像素風：粗外框（box-shadow 階梯缺角）、鮮豔主題色、粗體描邊字 ===== */
:root{
  --ink:#2a1840;--ink2:#46306a;--cream:#fff7e6;--cream2:#f3dcae;--edge:36px;
  --hud:52px;--fire:96px;--bar:52px;
  --theme:#5fd068;--theme2:#2d7a3a;--theme3:#173f20;
  --font:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",sans-serif;
  --o3:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink);
  --o4:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink);
  --tw:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 4px 0 var(--ink);
  --tw1:1px 0 0 var(--ink),-1px 0 0 var(--ink),0 1px 0 var(--ink),0 -1px 0 var(--ink),1px 1px 0 var(--ink),-1px 1px 0 var(--ink),1px -1px 0 var(--ink),-1px -1px 0 var(--ink),0 2px 0 var(--ink)
}
@media (max-height:780px){:root{--fire:88px;--bar:48px}}
@media (max-height:700px){:root{--fire:72px;--bar:42px;--hud:46px}}
@media (hover:hover) and (pointer:fine){:root{--fire:74px;--bar:42px;--hud:48px}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a1030;color:#fff;font-family:var(--font);font-weight:700;line-height:1.35;
  touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{position:fixed;inset:0;background-color:#1a1030;background-image:radial-gradient(#ffffff12 1.5px,transparent 1.6px),radial-gradient(circle at 50% 35%,#3a2464 0,#1a1030 72%);background-size:18px 18px,100% 100%}
button{font:inherit;color:inherit;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
img{-webkit-user-drag:none;user-select:none}

/* ---------- 主欄位（手機全螢幕；桌機置中直式欄位） ---------- */
#app{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:480px;display:flex;flex-direction:column;overflow:hidden;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);background:var(--theme3)}
@media (min-width:481px){#app{box-shadow:0 0 0 4px var(--ink),0 0 0 8px #ffffff14,0 0 60px #000c}}

/* ---------- HUD ---------- */
#hud{flex:none;height:var(--hud);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:0 var(--edge);position:relative;z-index:3;
  background:linear-gradient(var(--theme2),var(--theme3));box-shadow:0 3px 0 0 var(--ink),inset 0 -3px 0 0 #0003,inset 0 2px 0 0 #ffffff26}
#hudL{justify-self:start;display:flex;flex-direction:column;line-height:1;gap:3px;min-width:0}
#hudLevel{font-size:22px;font-weight:900;color:#fff;text-shadow:var(--tw);letter-spacing:.02em;white-space:nowrap}
#hudTheme{font-size:11px;color:#fff;text-shadow:var(--tw1);white-space:nowrap;opacity:.95}
#hudM{display:flex;flex-direction:column;align-items:center;line-height:1;gap:4px}
#hudMarbleRow{display:flex;align-items:center;gap:5px;padding:3px 10px 4px 6px;background:#0006;box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink)}
#hudMarbleRow.bump0{animation:bumpA .26s ease-out}
#hudMarbleRow.bump1{animation:bumpB .26s ease-out}
#hudMarbles{font-size:19px;font-weight:900;color:#fff;text-shadow:var(--tw);font-variant-numeric:tabular-nums;white-space:nowrap}
#hudMarbles.low{color:#ff5b5b;animation:lowBlink .6s steps(2) infinite}
#hudRefill{font-size:11px;color:#fff;text-shadow:var(--tw1);white-space:nowrap;font-variant-numeric:tabular-nums}
#hudRefill.full{opacity:.7}
#hudR{justify-self:end;display:flex}
.mi{display:inline-block;flex:none;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,#cfe3ff 30%,#7aa7e8 75%,#4a6fb5 100%);box-shadow:0 0 0 2px var(--ink)}
.ico{display:inline-block;flex:none;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated;background-size:100% 100%;background-repeat:no-repeat}
.ico.none{display:none}
#hudMarbleRow .ico{width:24px;height:24px}
#hudMarbleRow .ico:not(.none)+.mi{display:none}

/* ---------- 舞台（canvas） ---------- */
#stage{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;background:var(--theme)}
#game{position:absolute;left:0;top:0;display:block;image-rendering:auto;touch-action:none;-webkit-touch-callout:none}
#game.crisp{image-rendering:crisp-edges;image-rendering:pixelated}

/* 關卡橫幅與小提示 */
#banner{position:absolute;left:0;right:0;top:27%;z-index:5;pointer-events:none;text-align:center;transform:translateY(-50%);opacity:0}
#banner .bt{display:block;font-size:34px;font-weight:900;color:#fff;text-shadow:var(--tw);letter-spacing:.05em;white-space:nowrap;line-height:1.25;padding:0 8px}
#banner .bs{display:block;font-size:15px;color:#fff;text-shadow:var(--tw1);margin-top:4px;white-space:nowrap}
#banner .stripe{display:none;height:14px;margin:8px 0;background:repeating-linear-gradient(-45deg,#ffd23f 0 10px,#2a1840 10px 20px);background-size:28.28px 28.28px;box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink);animation:stripes .6s linear infinite}
#banner.show{animation:bannerIn 1.9s ease both}
#banner.long.show{animation:bannerIn 2.6s ease both}
#banner.elite .bt{color:#ffd23f;font-size:32px}
#banner.boss .bt{color:#ff6b5b;font-size:28px;animation:shakeX .42s 4}
#banner.boss .stripe,#banner.elite .stripe{display:block}
#banner.elite .stripe{background:repeating-linear-gradient(-45deg,#ff9a2a 0 10px,#2a1840 10px 20px);background-size:28.28px 28.28px}
#banner.boss .stripe{background:repeating-linear-gradient(-45deg,#ff4b4b 0 10px,#2a1840 10px 20px);background-size:28.28px 28.28px}
#banner.boss{background:linear-gradient(#ff2a2a00,#ff2a2a40 30%,#ff2a2a40 70%,#ff2a2a00)}
#banner.clear .bt{color:#fff27a;font-size:46px;letter-spacing:.12em}
#toast{position:absolute;left:0;right:0;top:12%;z-index:6;pointer-events:none;text-align:center;font-size:24px;font-weight:900;color:#8dffb8;text-shadow:var(--tw);white-space:nowrap;opacity:0}
#toast.show{animation:toastIn 1.4s ease both}
#coreMsg{position:absolute;left:var(--edge);right:var(--edge);bottom:16px;z-index:7;text-align:center;font-size:14px;padding:8px 10px;background:#2a1840e6;box-shadow:var(--o3);pointer-events:none}

/* ---------- 下方操作區 ---------- */
#controls{flex:none;position:relative;z-index:3;padding:8px var(--edge) 10px;display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(var(--theme3),#150b28);box-shadow:0 -3px 0 0 var(--ink),inset 0 3px 0 0 #ffffff1c}
#aimBar{position:relative;height:var(--bar);touch-action:none;cursor:pointer;-webkit-touch-callout:none}
#aimTrack{position:absolute;left:0;right:0;top:50%;height:20px;margin-top:-10px;overflow:hidden;
  background:repeating-linear-gradient(90deg,#ffffff00 0 10%,#ffffff2e 10% calc(10% + 3px)),linear-gradient(#0c0619,#2b1d4a);box-shadow:var(--o3),inset 0 4px 0 0 #0009,inset 0 -3px 0 0 #ffffff26}
#aimFill{display:none}
#aimHint{position:absolute;left:-30px;right:-30px;top:50%;margin-top:-10px;height:20px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;font-size:15px;line-height:20px;color:#fff6a0;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink);animation:hintNudge .8s ease-in-out infinite}
#aimHint i{font-style:normal}
@keyframes hintNudge{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.18)}}
#aimKnob{position:absolute;left:0;top:50%;width:44px;height:44px;margin-top:-22px;pointer-events:none;will-change:transform;
  background:#ffcf3f;box-shadow:inset 0 -6px 0 0 #d6890e,inset 0 4px 0 0 #fff9,var(--o3),0 5px 0 0 #0006}
#aimKnob::before{content:"";position:absolute;left:50%;top:9px;width:18px;height:12px;margin-left:-9px;background:var(--ink);clip-path:polygon(0 0,100% 0,50% 100%)}
#aimKnob::after{content:"";position:absolute;left:50%;bottom:10px;width:14px;height:6px;margin-left:-7px;background:#0003}
#aimBar.on #aimKnob{background:#fff06a;box-shadow:inset 0 -6px 0 0 #e6a51c,inset 0 4px 0 0 #fff,var(--o3),0 0 0 7px #fff3,0 0 18px 4px #ffe06699}
#fireRow{position:relative;display:flex;justify-content:center;align-items:center;height:calc(var(--fire) + 10px)}
#btnFire{position:relative;width:var(--fire);height:var(--fire);border-radius:50%;border:0;padding:0;margin:0 0 6px;cursor:pointer;touch-action:none;-webkit-touch-callout:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:radial-gradient(circle at 36% 30%,#fffbd2 0 8%,#ffe066 24%,#ffb01f 62%,#ff8614 100%);
  box-shadow:0 0 0 4px var(--ink),inset 0 -8px 0 0 #c8520a66,inset 0 6px 0 0 #fff8,0 8px 0 4px var(--ink),0 12px 14px 4px #0007;transition:transform .05s ease-out}
#btnFire .ft{font-size:calc(var(--fire) * .25);font-weight:900;color:#fff;text-shadow:var(--tw);letter-spacing:.06em;line-height:1.1;pointer-events:none;white-space:nowrap}
#btnFire .kbd{display:none;font-size:10px;color:#fff;text-shadow:var(--tw1);pointer-events:none;letter-spacing:.1em}
#btnFire .ring{position:absolute;left:-4px;top:-4px;right:-4px;bottom:-4px;border-radius:50%;pointer-events:none;box-shadow:0 0 0 5px #fff4a0,0 0 16px 4px #ffe066;opacity:0}
#btnFire.on{transform:translateY(6px) scale(.94);box-shadow:0 0 0 4px var(--ink),inset 0 -5px 0 0 #c8520a66,inset 0 6px 0 0 #fff8,0 2px 0 4px var(--ink),0 0 0 12px #ffe0663d,0 0 34px 12px #ffc83c9e}
#btnFire.p0 .ring{animation:pulseA .3s ease-out}
#btnFire.p1 .ring{animation:pulseB .3s ease-out}
#btnFire.hint:not(.on){animation:fireHint 1.1s ease-in-out infinite}
#btnFire.empty{background:radial-gradient(circle at 36% 30%,#ffffff 0 8%,#d9d3e3 26%,#a39bb6 70%,#857c9b 100%)}
#btnFire.empty .ft{font-size:calc(var(--fire) * .19);color:#f4f0fa}
#btnFire.empty.on{box-shadow:0 0 0 4px var(--ink),inset 0 -5px 0 0 #0002,inset 0 6px 0 0 #fff8,0 2px 0 4px var(--ink)}
#btnFire.shake{animation:shakeX .3s}
#fireSide{position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:11px;line-height:1.3;color:#ffffffb0;text-shadow:var(--tw1);pointer-events:none;max-width:calc(50% - var(--fire) / 2 - 10px)}
#fireQueue{position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:12px;color:#ffe27a;text-shadow:var(--tw1);pointer-events:none;text-align:right;max-width:calc(50% - var(--fire) / 2 - 10px)}

/* ---------- 共用：像素按鈕、面板、緞帶 ---------- */
.pbtn{--bc:#ffcf3f;--bd:#d6890e;position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;min-width:48px;padding:8px 16px 12px;margin:3px;border:0;border-radius:0;cursor:pointer;
  font-size:18px;font-weight:900;color:#fff;letter-spacing:.06em;line-height:1.2;text-shadow:var(--tw);background:var(--bc);
  box-shadow:inset 0 -6px 0 0 var(--bd),inset 0 3px 0 0 #ffffff8c,var(--o3),0 7px 0 0 #0000004d;transition:transform .05s}
.pbtn:active,.pbtn.on{transform:translateY(3px);box-shadow:inset 0 -3px 0 0 var(--bd),inset 0 3px 0 0 #ffffff8c,var(--o3),0 3px 0 0 #0000004d}
.pbtn:focus{outline:none}
.pbtn:focus-visible{filter:brightness(1.12);box-shadow:inset 0 -6px 0 0 var(--bd),inset 0 3px 0 0 #ffffff8c,var(--o3),0 0 0 7px #fff8}


.pbtn.yel{--bc:#ffcf3f;--bd:#d6890e}
.pbtn.blue{--bc:#55bdff;--bd:#2b7fc4}
.pbtn.pink{--bc:#ff7eb6;--bd:#cf4b86}
.pbtn.green{--bc:#66d36a;--bd:#2f9640}
.pbtn.gray{--bc:#a99fc0;--bd:#776d90}
/* 停用：灰、扁平（沒有厚度與落地陰影）、文字淡，按了不會下沉 */
.pbtn:disabled,.pbtn:disabled:active,.pbtn:disabled:focus-visible{--bc:#cfc9d8;--bd:#cfc9d8;background:#cfc9d8;color:#8a829c;text-shadow:none;cursor:default;transform:none;filter:none;
  box-shadow:0 -3px 0 0 #8a829c,0 3px 0 0 #8a829c,-3px 0 0 0 #8a829c,3px 0 0 0 #8a829c}
.pbtn:disabled .ico{opacity:.45;filter:grayscale(1)}
.pbtn.big{font-size:22px;min-height:60px;padding:10px 18px 14px}
.pbtn.sm{font-size:15px;min-height:44px;padding:6px 12px 10px}
.pbtn.sq{padding:0;width:44px;height:44px;min-height:44px;min-width:44px;margin:0}
.pbtn .ico{width:24px;height:24px}
.pbtn.big .ico{width:30px;height:30px}
.pz{display:block;width:16px;height:18px;background:linear-gradient(90deg,#fff 0 6px,transparent 6px 10px,#fff 10px 16px);filter:drop-shadow(0 2px 0 var(--ink))}
.pbtn .ico:not(.none)+.pz{display:none}
.overlay{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  padding:calc(14px + env(safe-area-inset-top,0px)) calc(var(--edge) + env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) calc(var(--edge) + env(safe-area-inset-left,0px))}
.dim{background:#170a2cb3}
.overlay.fadein{animation:fadeIn .22s ease-out both}
.panel{position:relative;width:100%;max-width:384px;max-height:100%;display:flex;flex-direction:column;gap:10px;padding:16px 14px 18px;background:var(--cream);color:var(--ink);
  box-shadow:inset 0 -7px 0 0 var(--cream2),inset 0 4px 0 0 #fff,var(--o4),0 12px 0 0 #0006}
.panel.pop{animation:panelPop .3s cubic-bezier(.2,1.5,.45,1) both}
.ribbon{position:relative;align-self:center;margin:-34px 0 2px;padding:7px 22px 10px;font-size:21px;font-weight:900;color:#fff;text-shadow:var(--tw);letter-spacing:.08em;white-space:nowrap;text-align:center;
  --rb:#55bdff;--rd:#2b7fc4;background:var(--rb);box-shadow:inset 0 -5px 0 0 var(--rd),inset 0 3px 0 0 #ffffff80,var(--o3),0 6px 0 0 #0004}
.ribbon.yel{--rb:#ffcf3f;--rd:#d6890e}.ribbon.pink{--rb:#ff7eb6;--rd:#cf4b86}.ribbon.red{--rb:#ff6b5b;--rd:#c23a33}.ribbon.green{--rb:#66d36a;--rd:#2f9640}
.row2{display:flex;gap:10px}
.row2>.pbtn{flex:1 1 0;min-width:0;padding-left:8px;padding-right:8px}
.scroll{overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

/* ---------- 標題 ---------- */
#titleScreen{justify-content:space-between;gap:10px;background:none}
.tTop{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:3vh}
.tLower{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
#logo{position:relative;margin:0;line-height:1;display:flex;justify-content:center;animation:logoBob 2.4s ease-in-out infinite}
#logoCv{display:none;image-rendering:crisp-edges;image-rendering:pixelated}
#logo.cv #logoCv{display:block}
.logoTxt{display:block;font-size:56px;font-weight:900;letter-spacing:.06em;color:#ffd23f;-webkit-text-stroke:3px var(--ink);text-shadow:0 6px 0 var(--ink)}
#logo.cv .logoTxt{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;color:transparent;-webkit-text-stroke:0;text-shadow:none;font-size:20px}
.tSub{margin:0;padding:6px 14px 8px;font-size:15px;color:#fff;text-shadow:var(--tw1);background:#2a1840b3;box-shadow:0 -3px 0 0 #2a1840b3,0 3px 0 0 #2a1840b3;text-align:center}
.tMenu{display:flex;flex-direction:column;align-items:stretch;gap:12px;width:min(300px,100%)}
#bestRecord{align-self:center;display:flex;align-items:center;gap:6px;padding:4px 12px 6px;font-size:16px;color:#fff;text-shadow:var(--tw);background:#2a1840a6;box-shadow:0 -2px 0 0 #2a1840a6,0 2px 0 0 #2a1840a6}
#bestRecord .ico{width:24px;height:24px}
.tBottom{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.toggles{display:flex;gap:12px;justify-content:center}
.toggles .pbtn{min-width:112px}
.pbtn.off{--bc:#8e86a3;--bd:#625a78;color:#e6e0ef}
#keyHelp{display:none;margin:0;font-size:12px;color:#fff;text-shadow:var(--tw1);text-align:center;line-height:1.6}
#buildTag{position:absolute;right:8px;bottom:calc(4px + env(safe-area-inset-bottom,0px));margin:0;font-size:9px;color:#ffffff99;text-shadow:var(--tw1);pointer-events:none}
@media (hover:hover) and (pointer:fine){#keyHelp{display:block}#btnFire .kbd{display:block}#talentCards .cKey{display:flex!important}}
@media (max-height:700px){.tTop{margin-top:1vh;gap:8px}.tMenu{gap:9px}.pbtn.big{min-height:54px}}

/* ---------- 章節選擇 ---------- */
#chapterPanel .panel{height:auto;max-height:100%}
#chapterList{display:flex;flex-direction:column;gap:12px;padding:6px 6px 8px;margin:0 -6px;min-height:0;flex:1 1 auto}
.chapter{--c:#66d36a;--cd:#2f9640;position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:8px 12px 11px 8px;margin:0;border:0;border-radius:0;cursor:pointer;text-align:left;color:#fff;
  background:var(--c);box-shadow:inset 0 -6px 0 0 var(--cd),inset 0 3px 0 0 #ffffff70,var(--o3),0 6px 0 0 #0004;flex:none}
.chapter:active{transform:translateY(3px)}
.chapter:focus{outline:none}
.chapter:focus-visible{filter:brightness(1.12);box-shadow:inset 0 -6px 0 0 var(--cd),inset 0 3px 0 0 #ffffff70,var(--o3),0 0 0 7px #2a184055}
.chThumb{flex:none;width:88px;height:56px;image-rendering:crisp-edges;image-rendering:pixelated;background:#0004;box-shadow:0 0 0 3px var(--ink)}
.chTxt{display:flex;flex-direction:column;gap:3px;min-width:0}
.chName{font-size:19px;font-weight:900;text-shadow:var(--tw);white-space:nowrap}
.chRange{font-size:13px;text-shadow:var(--tw1);opacity:.95;white-space:nowrap}
.chapter .chLock{display:none;margin-left:auto;align-items:center;justify-content:center;width:36px;height:36px;flex:none}
.chapter.locked{--c:#7d7692;--cd:#57506b;cursor:default;color:#dcd6e6}
.chapter.locked .chLock{display:flex}
.chapter.locked .chThumb{filter:grayscale(1) brightness(.55)}
.chapter.locked:active{transform:none}
.chLock .ico{width:30px;height:30px}
.chLock .lk{display:block;width:22px;height:26px;position:relative}
.chLock .lk::before{content:"";position:absolute;left:4px;top:0;width:14px;height:14px;box-sizing:border-box;border:4px solid #fff;border-bottom:0;border-radius:8px 8px 0 0}
.chLock .lk::after{content:"";position:absolute;left:0;bottom:0;width:22px;height:15px;background:#ffd23f;box-shadow:0 0 0 2px var(--ink)}
.chLock .ico:not(.none)+.lk{display:none}
.chTag{position:absolute;right:10px;top:-9px;font-size:11px;padding:1px 7px 3px;background:#ff7eb6;color:#fff;text-shadow:var(--tw1);box-shadow:0 0 0 2px var(--ink)}

/* ---------- 天賦三選一 ---------- */
#talentPanel{justify-content:center}
.tpWrap{width:100%;max-width:400px;padding:0 2px;display:flex;flex-direction:column;align-items:stretch;gap:12px}
#talentTitle{margin:0 0 2px;align-self:center;font-size:20px;white-space:normal;max-width:100%}
#talentSub{align-self:center;font-size:12px;color:#fff;text-shadow:var(--tw1);margin-top:-4px;min-height:1em}
#talentCards{display:flex;flex-direction:column;gap:14px}

  var SONGS = {}, SFX = {}, ERRORS = [];

  /* ====================================================================== *
   *  7. 合成器（全部吃 AudioContext 參數，即時與 OfflineAudioContext 共用）
   * ====================================================================== */
  var BGM_SCALE = 0.30;   // 內部預留空間：setVolume(1, 1) 時離限幅器還有餘裕
  var SFX_SCALE = 0.42;
  var LOOKAHEAD = 0.30;   // 往前排程幾秒
  var TICK_MS = 25;
  var MAX_VOICES = 16;    // 音效同時發聲上限（BGM 不算）

  function pulseWave(ac, duty) {
    var cache = ac.__mlWaves || (ac.__mlWaves = {});
    if (cache[duty]) return cache[duty];
    var N = 48, re = new Float32Array(N), im = new Float32Array(N);
    for (var n = 1; n < N; n++) {
      re[n] = 2 * Math.sin(2 * Math.PI * n * duty) / (Math.PI * n);
      im[n] = 2 * (1 - Math.cos(2 * Math.PI * n * duty)) / (Math.PI * n);
    }
    return (cache[duty] = ac.createPeriodicWave(re, im));
  }
  function setWave(ac, osc, w) {
    if (w === 'tri') osc.type = 'triangle';
    else if (w === 'p50') osc.type = 'square';
    else if (w === 'sine') osc.type = 'sine';
    else if (w === 'saw') osc.type = 'sawtooth';
    else osc.setPeriodicWave(pulseWave(ac, w === 'p25' ? 0.25 : 0.125));
  }
  function noiseBuffer(ac) {
    if (ac.__mlNoise) return ac.__mlNoise;
    var len = Math.floor(ac.sampleRate * 2), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0), seed = 31337;
    for (var i = 0; i < len; i++) { seed = (seed * 1103515245 + 12345) & 0x7fffffff; d[i] = seed / 0x3fffffff - 1; }
    return (ac.__mlNoise = buf);
  }
  var noiseCounter = 0;
  function noiseSource(ac) {
    var src = ac.createBufferSource();
    src.buffer = noiseBuffer(ac);
    src.loop = true;
    src.__offset = ((noiseCounter++ * 0.37717) % 1.7);
    return src;
  }
  var FTYPE = { lp: 'lowpass', hp: 'highpass', bp: 'bandpass' };

  // 起音 → 指數衰減到持續音量 → 線性釋放。回傳聲音完全結束的時間
  function applyEnv(p, t, dur, peak, inst) {
    var a = Math.max(0.001, inst.a || 0.003), d = Math.max(0.01, inst.d || 0.1);
    var s = inst.s == null ? 1 : inst.s, r = Math.max(0.005, inst.r || 0.03), end = t + dur, v;
    p.setValueAtTime(0, t);
    if (dur <= a) {
      v = peak * dur / a;
      p.linearRampToValueAtTime(v, end);
    } else {
      var tau = d / 3;
      p.linearRampToValueAtTime(peak, t + a);
      p.setTargetAtTime(peak * s, t + a, tau);
      v = peak * (s + (1 - s) * Math.exp(-(dur - a) / tau));
      p.setValueAtTime(v, end);
    }
    p.linearRampToValueAtTime(0, end + r);
    return end + r;
  }
  // 打擊樂包絡：極短起音、時間常數 d/3 的指數衰減，2d 時強制歸零
  function percEnv(p, t, a, d, vol) {
    p.setValueAtTime(0, t);
    p.linearRampToValueAtTime(vol, t + a);
    p.setTargetAtTime(0, t + a, d / 3);
    p.setValueAtTime(vol * Math.exp(-4.5), t + a + 1.5 * d);
    p.linearRampToValueAtTime(0, t + a + 2 * d);
    return t + a + 2 * d;
  }
  function autoClean(src, nodes) {
    src.onended = function () { for (var i = 0; i < nodes.length; i++) { try { nodes[i].disconnect(); } catch (e) {} } };
  }

  // srcs（選用）：收集發聲來源，音效被搶位時可以提早停掉
  function playNote(ac, dest, inst, midis, t, dur, vel, pitch, srcs) {
    var tr = (inst.transpose || 0) + (pitch || 0);
    var g = ac.createGain(), off;
    if (inst.wave === 'noise') {
      var src = noiseSource(ac), f = ac.createBiquadFilter(), fq = Math.min(18000, mtof(midis[0] + tr));
      f.type = FTYPE[inst.ftype] || 'bandpass';
      f.Q.value = inst.q || 0;
      f.frequency.setValueAtTime(fq, t);
      if (inst.slide) f.frequency.exponentialRampToValueAtTime(Math.max(20, Math.min(18000, fq * Math.pow(2, inst.slide / 12))), t + dur + (inst.r || 0.03));
      off = applyEnv(g.gain, t, dur, vel, inst);
      src.connect(f); f.connect(g); g.connect(dest);
      src.start(t, src.__offset); src.stop(off + 0.02);
      autoClean(src, [src, f, g]);
      if (srcs) srcs.push(src);
      return off;
    }
    var osc = ac.createOscillator(), nodes = [osc, g];
    setWave(ac, osc, inst.wave);
    off = applyEnv(g.gain, t, dur, vel, inst);
    var f0 = mtof(midis[0] + tr);
    osc.frequency.setValueAtTime(f0, t);
    if (midis.length > 1 || inst.arp) {
      var seq = midis.length > 1 ? midis : inst.arp.map(function (o) { return midis[0] + o; });
      var rate = inst.arpRate || 0.042, i = 1;
      for (var tt = t + rate; tt < off; tt += rate, i++) osc.frequency.setValueAtTime(mtof(seq[i % seq.length] + tr), tt);
    } else if (inst.slide) {
      osc.frequency.exponentialRampToValueAtTime(f0 * Math.pow(2, inst.slide / 12), t + (inst.slideTime || dur));
    }
    if (inst.vib && dur > inst.vib.delay + 0.05) {

      lfo.type = 'sine'; lfo.frequency.value = inst.vib.rate;
      lg.gain.setValueAtTime(0, vs);
      lg.gain.linearRampToValueAtTime(inst.vib.depth, vs + Math.min(0.12, dur * 0.3));
      lfo.connect(lg); lg.connect(osc.detune);
      lfo.start(vs); lfo.stop(off + 0.02);
      nodes.push(lfo, lg);
      if (srcs) srcs.push(lfo);
    }
    osc.connect(g); g.connect(dest);
    osc.start(t); osc.stop(off + 0.02);
    autoClean(osc, nodes);
    if (srcs) srcs.push(osc);
    return off;
  }

  function playDrum(ac, dest, d, t, vel, srcs) {
    var g, off;
    if (d.tone) {

      off = percEnv(g.gain, t, 0.002, d.tone.d, d.tone.vol * vel);

      o.start(t); o.stop(off + 0.01);

      off = percEnv(g.gain, t, d.noise.a || 0.001, d.noise.d, d.noise.vol * vel);
      src.connect(f); f.connect(g); g.connect(dest);
      src.start(t, src.__offset); src.stop(off + 0.01);
      autoClean(src, [src, f, g]);
      if (srcs) srcs.push(src);
    }
  }

  function playEvent(ac, dest, inst, ev, t, stepDur, pitch, srcs) {
    if (ev.drum) { playDrum(ac, dest, DRUMS[ev.drum], t, ev.v, srcs); return; }
    var gate = ev.g || inst.gate || 0.9;
    playNote(ac, dest, inst, ev.midi, t, ev.len * stepDur * gate, ev.v, pitch, srcs);

  function makePan(ac, v) {

    var p = ac.createStereoPanner();

  }
  // 一條軌道：gain →（pan）→ out，選用回授回音
  function makeStrip(ac, out, vol, pan, echo, echoTime, nodes) {

  /* ---------------- 音序器 ---------------- */
  function makePlayer(ac, song, dest, startTime) {

    song.tracks.forEach(function (tr) {
      var g = makeStrip(ac, bus, tr.vol * song.gain, tr.pan, tr.echo, tr.echo ? tr.echo.steps * song.stepDur : 0, p.nodes);
      var loopIdx = 0;

  }

        pt.idx++;

  }
  function killPlayer(p) {

  }

  /* ---------------- 總輸出：BGM／音效分開調音量，最後過軟限幅器 ---------------- */
  function softClipCurve() {
    // 輸入先 ×0.5，所以曲線涵蓋 ±2.0：0.8 以下完全線性，之上用 tanh 膝部，永遠到不了 1
    var n = 4097, c = new Float32Array(n);
    for (var i = 0; i < n; i++) {

  }
  function buildMaster(ac, bgmVol, sfxVol, isMuted) {

    m.duck = ac.createGain();       // 大事件時暫時壓低
    m.bgmVol = ac.createGain();
    m.sfxSmall = ac.createGain();   // 頻繁的小音效（pri 0～1）：擁擠時自動降量
    m.sfxIn = ac.createGain();
    m.sfxVol = ac.createGain();
    m.master = ac.createGain();     // 靜音
    m.pre = ac.createGain();
    m.shaper = ac.createWaveShaper();
    m.bgmVol.gain.value = bgmVol * BGM_SCALE;
    m.sfxVol.gain.value = sfxVol * SFX_SCALE;

    m.pre.gain.value = 0.5;

    m.sfxSmall.connect(m.sfxIn); m.sfxIn.connect(m.sfxVol); m.sfxVol.connect(m.master);

  }
  // 壓低 BGM：level＝壓到多少（0～1），hold 秒後慢慢回來；重疊時取比較低、比較久的那個
  function applyDuck(m, level, t, hold) {

      for (var i = 0; i < tr.events.length; i++) playEvent(ac, g, tr.inst, tr.events[i], t + tr.events[i].t * def.step, def.step, pitch, srcs);

  }

  /* ====================================================================== *
   *  8. 音效引擎：節流、同時發聲上限、優先權讓位、擁擠時自動降量
   *     每個 AudioContext 一份；即時播放與離線壓力測試走同一套邏輯
   * ====================================================================== */

    return { ac: ac, m: m, live: live, voices: [], last: {}, stats: { played: 0, throttled: 0, stolen: 0, dropped: 0, peakVoices: 0 } };
  }
  function releaseVoice(v) { for (var i = 0; i < v.nodes.length; i++) { try { v.nodes[i].disconnect(); } catch (e) {} } v.nodes.length = 0; }

  function engSteal(E, v, t) {          // 讓位：15ms 淡出，然後停掉來源

  function engCrowd(E, t) {             // 小音效同時超過 4 個時整體降量（1/√n），聽起來不會越疊越吵

  function engPlay(E, name, t, opts) {

      var victim = null;
      for (i = 0; i < vs.length; i++) {
        v = vs[i]; if (v.stolen) continue;

  /* ====================================================================== *
   *  9. 即時狀態＋公開 API
   * ====================================================================== */
  var ac = null, M = null, ENG = null, timer = null;

  var muted = false, volBgm = 0.7, volSfx = 0.9;

  /** 播放（或交叉淡入淡出切換到）BGM。opts：{ fade = true, fadeTime = 0.8, restart = false }；同一首正在播不會重來 */

  }

  }

  /** 播放音效。opts：{ volume = 1, pitch = 0（半音）, pan = 0（-1～1）}。被節流／沒解鎖／分頁在背景時回傳 false */

  /** 暫時壓低 BGM：amount＝壓低的比例（0＝不壓、1＝全靜音；BGM 會降到 1−amount），seconds 秒後慢慢回來 */

  /** 音量 0～1；傳 null／undefined 表示那一項不變 */

    if (ac && M) {
      var now = ac.currentTime;

  /** 測試用：照腳本 [{ name, t, opts }] 經過真的節流／發聲上限邏輯離線算圖，可同時墊一首 BGM。回傳 Promise<{ buffer, stats, scheduleMs }> */
  function renderScript(script, seconds, o) {

    var oac = new OAC(2, Math.ceil(secs * sr), sr);
    var m = buildMaster(oac, o.bgmVol == null ? 1 : o.bgmVol, o.sfxVol == null ? 1 : o.sfxVol, false);
    var E = makeSfxEngine(oac, m, false);

  });
  var SFX_LIST = SFX_ORDER.filter(function (n) { return SFX[n]; }).map(function (n) {
    var d = SFX[n];
    return { name: n, label: d.label, group: d.group, seconds: Math.round((d.seconds + d.tail) * 100) / 100, pri: d.pri, gap: d.gap, duck: d.duck };

    version: '1.0.0',

    getPosition: getPosition,

    hasSFX: function (n) { return !!SFX[n]; },

<script>/* src/config.js */
/* 彈珠傳說 — 數值常數（①a 核心）globalThis.ML_CONFIG
 * 世界座標固定 W=360、H=600（見 ARCHITECTURE.md 第 4 節）。sim.create({ cfg:{...} }) 可以覆寫任何鍵（淺層覆寫）。
 *
 * ★ 使用者確認過的規則（不要改）：
 *   彈珠上限＝總關數×100（＋彈藥箱）、每 60 秒 +50、補彈釘 +3、同時最多 50 顆（超過排隊）、
 *   暴擊釘 ×2 可疊上限 ×8、弱點回收一顆最多 4 次、清盤 +10、每局重抽 1 次、所有來源都不超過上限。
 *
 * ★ 平衡公式（autoplay 調整後定案，數字在下面「怪物血量」「掉落」區塊）：

    opts = opts || {};
    var base = root.ML_CONFIG, D = root.ML_DATA;
    if (!base || !base.W || !D || !D.talents) throw new Error('MarbleSim：請先載入 config.js 與 data.js');
    var C = {}, k;
    for (k in base) if (hasOwn.call(base, k)) C[k] = base[k];
    if (opts.cfg) for (k in opts.cfg) if (hasOwn.call(opts.cfg, k)) C[k] = opts.cfg[k];

    var W = C.W, H = C.H, FLOOR_Y = C.FLOOR_Y, DT = C.DT;
    var VMAX2 = C.VMAX * C.VMAX;
    var seed = (opts.seed == null ? Math.floor(Math.random() * 4294967296) : Number(opts.seed)) >>> 0;
    var rng = mulberry32(mix(seed, 0x51ED27));
    var startChapter = Math.max(1, Math.floor(Number(opts.startChapter) || 1));

    var TAL = {};
    for (var ti = 0; ti < D.talents.length; ti++) TAL[D.talents[ti].id] = D.talents[ti];
    var SPEC = D.species;

    // ---------------- 公開狀態（欄位名稱照文件） ----------------
    var S = {
      W: W, H: H, FLOOR_Y: FLOOR_Y,
      time: 0,
      phase: 'play',
      level: null,
      marbles: 0, cap: 0,
      refillT: C.REFILL_INTERVAL,
      refillInterval: C.REFILL_INTERVAL,
      aimX: W / 2, firing: false,
      queue: 0,
      balls: [],
      pegs: [],
      monsters: [],
      combo: { n: 0, t: 0, best: 0 },
      talents: {},
      picks: [],
      rerollLeft: C.REROLLS,
      offer: null,
      // 文件欄位＋額外：pegs（觸發釘子數）、boards（清盤次數）、misses（落空數）
      stats: { fired: 0, hits: 0, weakHits: 0, damage: 0, kills: 0, maxCombo: 0, maxHit: 0, levelsCleared: 0, marblesGained: 0,
               pegs: 0, boards: 0, misses: 0 },
      over: null
    };
    var M = {};                       // 天賦加成（sim.mods）

    // ---------------- 內部狀態 ----------------
    var ev = [];
    var acc = 0;
    var uid = 1;
    var fireCd = 0, pendingShot = false, emptyCd = 0, queueCd = 0;
    var firedBalls = 0;
    var clearT = 0;
    var boardClearT = -1;
    var boardNo = 0, boardPattern = '', lastPattern = '';
    var boardBonusLeft = 0;           // 本關還能拿幾次清盤獎勵（含補彈釘）
    var zoneY1 = 470;
    var bombs = [];                   // 延遲觸發的釘子 { t, peg, ball, snap }
    var pinCd = 0, wallCd = 0;
    var GCELL = 32, GCOLS = Math.ceil(W / GCELL), GROWS = Math.ceil(H / GCELL);
    var grid = [];
    var refillNext = false;           // 魔王後：下一關開始時補滿
    var startIndex = 1;
    var comboMs = 0;
    var picksCount = {};
    var spawnList = [];
    var monsterTopY = FLOOR_Y;

    function emit(e) {
      ev.push(e);
      if (ev.length > 20000) ev.splice(0, 10000);   // 用戶端沒在 drain 時的保險
      return e;
    }

    // ---------------- 天賦 → 加成 ----------------
    function capOf(id, def) { return TAL[id] && TAL[id].cap != null ? TAL[id].cap : def; }
    function recomputeMods() {
      var T = S.talents;
      M.baseDmg = C.BASE_DMG + (T.power || 0);
      M.critChance = Math.min(capOf('deadly', 100), T.deadly || 0) / 100;
      M.ballR = C.BALL_R * (1 + Math.min(capOf('giant', 80), T.giant || 0) / 100);
      M.fireRate = Math.min(C.FIRE_RATE_MAX, C.FIRE_RATE * (1 + (T.quick || 0) / 100));
      M.fireInterval = 1 / M.fireRate;
      M.shots = T.double ? 2 : 1;
      M.splitN = T.splitter ? 5 : 3;
      M.wildfire = !!T.wildfire;
      M.burnMult = T.wildfire ? 1.5 : 1;
      M.chainN = T.chain ? (T.chain >= 2 ? 3 : 2) : 0;
      M.regrow = !!T.regrow;
      M.capBonus = T.ammo || 0;
      M.recycle = Math.min(capOf('recycle', 60), T.recycle || 0) / 100;
      M.weakScale = T.hunter ? 1.5 : 1;
      M.weakDmg = C.WEAK_MULT * (T.hunter ? 1.5 : 1);
      M.supply = T.supply || 0;
      M.freezeT = C.FREEZE_T + (T.frost || 0);
      M.freezeMax = C.FREEZE_MAX + (T.frost || 0);
      M.frostDmg = 0.3 * (T.frost || 0);
      M.blastR = 1 + 0.4 * (T.blast || 0);
      M.blastDmg = Math.pow(2, T.blast || 0);
      M.golden = !!T.golden;
      M.refillInterval = Math.max(C.REFILL_INTERVAL_MIN, C.REFILL_INTERVAL - (T.hourglass || 0));
      M.lootMult = 1 + (T.loot || 0) / 100;
      M.pegPlus = T.pegplus || 0;
      S.refillInterval = M.refillInterval;
      if (S.refillT > S.refillInterval) S.refillT = S.refillInterval;
    }

    // ---------------- 彈珠經濟（所有來源都經過這裡，不會超過上限） ----------------
    function addMarbles(n, src) {
      n = Math.max(0, Math.floor(n));
      if (n <= 0) return 0;
      var room = Math.max(0, S.cap - S.marbles);
      var got = Math.min(n, room), lost = n - got;
      if (got > 0) { S.marbles += got; S.stats.marblesGained += got; emit({ t: 'income', n: got, src: src }); }
      if (lost > 0) emit({ t: 'capped', src: src, lost: lost });
      return got;
    }
    function capFor(index) { return index * C.CAP_PER_LEVEL + (S.talents.ammo || 0); }

    // ---------------- 關卡 ----------------
    // 章節倍率：HP_CHAPTER 可以是數字（每章都乘這個）或陣列 [第1→2章, 第2→3章, …]，陣列最後一個值之後一直沿用
    function chapterMult(ch) {
      var st = C.HP_CHAPTER, m = 1;
      for (var c = 2; c <= ch; c++) m *= typeof st === 'number' ? st : st[Math.min(c - 2, st.length - 1)];
      return m;
    }
    function levelHp(L) {
      // 章內依關（stage）成長、跨章乘上章節倍率：每章開頭相對好打（章節補償開局才不會一開就死），章尾很硬
      return C.HP_BASE * Math.pow(C.HP_GROWTH, L.stage - 1) * chapterMult(L.chapter) * (1 + C.HP_LOOP * L.variant);
    }

    function makeMonsters(L) {
      var r = mulberry32(mix(mix(seed, 0xB0B5), L.index));
      var ch = D.chapters[L.theme - 1];
      var ids = [], i;
      if (L.kind === 'boss') ids.push(ch.boss);
      else if (L.kind === 'elite') {
        ids.push(ch.elite);
        if (r() < C.ELITE_ESCORT_CHANCE) ids.push(ch.normals[Math.floor(r() * ch.normals.length)]);
        if (ids.length === 2 && r() < 0.5) ids.reverse();
      } else {
        var opt = D.stageCounts[L.stage] || [2];
        var n = opt[Math.floor(r() * opt.length)];
        for (i = 0; i < n; i++) ids.push(ch.normals[Math.floor(r() * ch.normals.length)]);
      }
      var B = levelHp(L), nNormal = ids.length, totalW = 0;
      for (i = 0; i < ids.length; i++) totalW += SPEC[ids[i]].w;
      var spdK = 1 + Math.min(0.4, C.SPEED_GROWTH * (L.chapter - 1));
      var list = [], x0 = 0;
      for (i = 0; i < ids.length; i++) {
        var sp = SPEC[ids[i]];
        var laneW = W * sp.w / totalW;
        var lo = x0 + sp.w / 2 + C.LANE_MARGIN, hi = x0 + laneW - sp.w / 2 - C.LANE_MARGIN;
        if (lo > hi) lo = hi = x0 + laneW / 2;
        var share = sp.kind === 'boss' ? C.BOSS_HP : sp.kind === 'elite' ? C.ELITE_HP
          : (L.kind === 'elite' ? C.ESCORT_HP : C.HP_SHARE[Math.min(C.HP_SHARE.length, nNormal) - 1]);
        var hp = Math.max(1, Math.round(B * share * sp.hpMul));
        var m = {
          id: uid++, species: sp.id, kind: sp.kind, name: sp.name,
          x: lo + (hi - lo) * r(), y: FLOOR_Y - sp.h / 2, w: sp.w, h: sp.h,
          rx: sp.w * C.MONSTER_RX, ry: sp.h * C.MONSTER_RY,
          hp: hp, maxHp: hp, alive: true, deadT: 0,
          weak: { x: 0, y: 0, r: 0 },
          frozenT: 0, burnT: 0, burnDps: 0, flashT: 0, dir: r() < 0.5 ? -1 : 1,
          _lo: lo, _hi: hi, _spd: sp.speed * spdK, _ph: r() * TAU, _bt: 0, _ba: 0
        };
        updateWeak(m);
        list.push(m);
        x0 += laneW;
      }
      return list;
    }

    function updateWeak(m) {
      var wk = SPEC[m.species].weak;
      m.weak.r = wk.r * M.weakScale;
      if (wk.arc) {
        var th = Math.PI / 2 + wk.arc * Math.sin(m._ph);
        m.weak.x = m.x + Math.cos(th) * m.rx * wk.k;
        m.weak.y = m.y - Math.sin(th) * m.ry * wk.k;
      } else {
        m.weak.x = m.x + (wk.dx || 0);
        m.weak.y = m.y - m.h / 2 + wk.dy;
      }
    }

    function startLevel(index) {
      var L = levelInfoFor(index, D);
      S.level = L;
      S.cap = capFor(index);
      if (S.marbles > S.cap) S.marbles = S.cap;
      S.balls = []; S.queue = 0; bombs = []; spawnList = [];
      S.offer = null;
      S.combo.n = 0; S.combo.t = 0; comboMs = 0;
      boardClearT = -1; boardNo = 0; boardBonusLeft = C.BOARD_BONUS_PER_LEVEL;
      pendingShot = false; fireCd = 0;
      S.monsters = makeMonsters(L);
      var top = FLOOR_Y;
      for (var i = 0; i < S.monsters.length; i++) top = Math.min(top, FLOOR_Y - S.monsters[i].h);
      zoneY1 = top - C.PEG_GAP_ABOVE_MONSTER;
      monsterTopY = top;
      genBoard();
      S.phase = 'play';
      if (refillNext) {               // 魔王後補滿到新上限
        refillNext = false;
        if (S.cap > S.marbles) addMarbles(S.cap - S.marbles, 'boss');
      }
      var ms = [];
      for (i = 0; i < S.monsters.length; i++) {
        var m = S.monsters[i];
        ms.push({ id: m.id, species: m.species, name: m.name, kind: m.kind });
      }
      emit({ t: 'levelStart', level: copyObj(L), monsters: ms });
    }

    function allDead() {
      for (var i = 0; i < S.monsters.length; i++) if (S.monsters[i].alive) return false;
      return true;
    }

    function levelClear() {
      var n = S.balls.length + S.queue;
      S.balls = []; S.queue = 0; bombs = []; spawnList = [];
      pendingShot = false;
      boardClearT = -1;
      var e = emit({ t: 'levelClear', level: copyObj(S.level), refund: 0 });
      e.refund = addMarbles(n, 'refund');
      S.stats.levelsCleared++;
      if (S.level.kind === 'boss') refillNext = true;
      S.phase = 'clear';
      clearT = C.CLEAR_TIME;
    }

    function gameOver() {
      S.phase = 'over';
      pendingShot = false;
      S.over = { level: copyObj(S.level), stats: copyObj(S.stats), time: S.time };
      emit({ t: 'gameOver', level: S.over.level, stats: S.over.stats, time: S.time });
    }

    // ---------------- 盤面產生 ----------------
    function lineOut(out, x1, y1, x2, y2, sp, skipFirst) {
      var dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy);
      var n = Math.max(1, Math.round(len / sp));
      for (var j = skipFirst ? 1 : 0; j <= n; j++) out.push({ x: x1 + dx * j / n, y: y1 + dy * j / n });
    }
    function ringOut(out, cx, cy, R, sp, a0) {
      var n = Math.max(4, Math.round(TAU * R / sp));
      for (var j = 0; j < n; j++) { var a = a0 + j * TAU / n; out.push({ x: cx + R * Math.cos(a), y: cy + R * Math.sin(a) }); }
    }
    function diamondOut(out, cx, cy, hx, hy, sp) {
      lineOut(out, cx, cy - hy, cx + hx, cy, sp, false);
      lineOut(out, cx + hx, cy, cx, cy + hy, sp, true);
      lineOut(out, cx, cy + hy, cx - hx, cy, sp, true);
      lineOut(out, cx - hx, cy, cx, cy - hy, sp, true);
    }
    function farFrom(list, p, d) {
      var d2 = d * d;
      for (var i = 0; i < list.length; i++) {
        var dx = list[i].x - p.x, dy = list[i].y - p.y;
        if (dx * dx + dy * dy < d2) return false;
      }
      return true;
    }
    // 隨機丟點補到 count（與 list、others 都保持距離）
    function poissonFill(r, Z, list, count, minD, others) {
      var tries = 0;
      while (list.length < count && tries++ < count * 80) {
        var p = { x: Z.x0 + r() * (Z.x1 - Z.x0), y: Z.y0 + r() * (Z.y1 - Z.y0) };
        if (farFrom(list, p, minD) && (!others || farFrom(others, p, minD))) list.push(p);
      }
      return list;
    }

    // 各種排列樣式：回傳 { pts: 技能釘候選點, pins: 固定釘建議點 }
    var PATTERNS = {
      // 交錯格
      stagger: function (r, Z, n) {
        var dx = clamp(Math.sqrt(Z.w * Z.h / (n * 1.02) / 0.87), 40, 90), dy = dx * 0.87;
        var cols = Math.floor(Z.w / dx) + 1, rows = Math.floor(Z.h / dy) + 1;
        var ox = Z.x0 + (Z.w - (cols - 1) * dx) / 2, oy = Z.y0 + (Z.h - (rows - 1) * dy) / 2;
        var pts = [], pins = [];
        for (var j = 0; j < rows; j++) for (var i = 0; i < cols; i++) {
          var x = ox + i * dx + (j % 2 ? dx / 2 : 0);
          if (x > Z.x1 + 0.5) continue;
          pts.push({ x: x, y: oy + j * dy });
          if (j % 2 === 0 && j + 1 < rows && i % 2 === 1) pins.push({ x: ox + i * dx + dx / 2, y: oy + (j + 0.5) * dy });
        }
        return { pts: pts, pins: pins };
      },
      // 圓環
      rings: function (r, Z, n) {
        var pts = [], pins = [];
        var R = Math.min(Z.w, Z.h) * (0.3 + 0.06 * r());
        var cx = Z.cx + (r() - 0.5) * 30, cy = Z.y0 + Z.h * (0.4 + 0.2 * r());
        ringOut(pts, cx, cy, R, 38, r() * TAU);
        if (R > 84) ringOut(pts, cx, cy, R * 0.46, 36, r() * TAU);
        pins.push({ x: cx, y: cy });
        var corners = shuffle([[Z.x0 + 44, Z.y0 + 40], [Z.x1 - 44, Z.y0 + 40], [Z.x0 + 44, Z.y1 - 40], [Z.x1 - 44, Z.y1 - 40]], r);
        for (var i = 0; i < corners.length && pts.length < n * 1.05; i++) {
          ringOut(pts, corners[i][0], corners[i][1], 36, 36, r() * TAU);
          pins.push({ x: corners[i][0], y: corners[i][1] });
        }
        return { pts: pts, pins: pins };
      },
      // V 字（或倒 V）疊幾層
      vee: function (r, Z, n) {
        var pts = [], pins = [];
        var rows = Z.h > 360 ? 4 : 3, inv = r() < 0.5, gy = Z.h / rows;
        var depth = gy * (0.55 + 0.25 * r());
        for (var k = 0; k < rows; k++) {
          var yTop = Z.y0 + k * gy + (gy - depth) * 0.5;
          var yA = inv ? yTop + depth : yTop, yB = inv ? yTop : yTop + depth;
          lineOut(pts, Z.x0, yA, Z.cx, yB, 40, false);
          lineOut(pts, Z.cx, yB, Z.x1, yA, 40, true);
          pins.push({ x: Z.cx, y: yB + (inv ? 30 : -30) });
        }
        return { pts: pts, pins: pins };
      },
      // 菱形（同心菱形＋角落小菱形）
      diamond: function (r, Z, n) {
        var pts = [], pins = [];
        var hx = Z.w * 0.48, hy = Z.h * (0.42 + 0.05 * r());
        diamondOut(pts, Z.cx, Z.cy, hx, hy, 40);
        diamondOut(pts, Z.cx, Z.cy, hx * 0.5, hy * 0.5, 38);
        pins.push({ x: Z.cx, y: Z.cy });
        var s = Math.min(Z.w, Z.h) * 0.12;
        var cs = shuffle([[Z.x0 + s, Z.y0 + s], [Z.x1 - s, Z.y0 + s], [Z.x0 + s, Z.y1 - s], [Z.x1 - s, Z.y1 - s]], r);
        for (var i = 0; i < cs.length && pts.length < n; i++) diamondOut(pts, cs[i][0], cs[i][1], s, s, 36);
        return { pts: pts, pins: pins };
      },
      // 弧線（笑臉／哭臉交替）
      arcs: function (r, Z, n) {
        var pts = [], pins = [];
        var rows = Z.h > 360 ? 4 : 3, gy = Z.h / rows, sag = gy * (0.35 + 0.25 * r()), flip = r() < 0.5;
        for (var k = 0; k < rows; k++) {
          var up = (k % 2 === 0) !== flip, yBase = Z.y0 + (k + 0.5) * gy;
          var px = 0, py = 0, len = 0, first = true;
          for (var x = Z.x0; x <= Z.x1 + 0.01; x += 2) {
            var u = (x - Z.cx) / (Z.w / 2);
            var y = yBase + (up ? 1 : -1) * sag * (u * u - 0.5);
            if (first) { pts.push({ x: x, y: y }); first = false; }
            else { len += Math.sqrt((x - px) * (x - px) + (y - py) * (y - py)); if (len >= 40) { pts.push({ x: x, y: y }); len = 0; } }
            px = x; py = y;
          }
          if (k + 1 < rows) pins.push({ x: Z.x0 + Z.w * (0.2 + 0.6 * r()), y: yBase + gy * 0.5 });
        }
        return { pts: pts, pins: pins };
      },
      // 群聚（幾團小蜂巢）
      clusters: function (r, Z, n) {
        var pts = [], pins = [];
        var k = clamp(Math.round(n / 6.5), 3, 7);
        var centers = poissonFill(r, { x0: Z.x0 + 38, x1: Z.x1 - 38, y0: Z.y0 + 36, y1: Z.y1 - 36 }, [], k, 112, null);
        for (var i = 0; i < centers.length; i++) {
          var c = centers[i], a0 = r() * TAU;
          pts.push(c);
          for (var j = 0; j < 6; j++) {
            if (r() < 0.12) continue;
            var a = a0 + j * Math.PI / 3;
            pts.push({ x: c.x + 36 * Math.cos(a), y: c.y + 36 * Math.sin(a) });
          }
          for (var q = i + 1; q < centers.length; q++) {
            var dx = centers[q].x - c.x, dy = centers[q].y - c.y;
            if (dx * dx + dy * dy < 175 * 175) pins.push({ x: (c.x + centers[q].x) / 2, y: (c.y + centers[q].y) / 2 });
          }
        }
        return { pts: pts, pins: pins };
      },
      // 波浪直排
      columns: function (r, Z, n) {
        var pts = [], pins = [];
        var cols = clamp(Math.round(Z.w / 70), 4, 5), dx = Z.w / cols;
        var rowsN = Math.max(3, Math.round(n / cols)), dy = Z.h / rowsN;
        var wav = 8 + 10 * r(), ph = r() * TAU;
        for (var c = 0; c < cols; c++) {
          var x0 = Z.x0 + (c + 0.5) * dx;
          for (var j = 0; j < rowsN; j++) {
            var y = Z.y0 + (j + (c % 2 ? 0.75 : 0.25)) * dy;
            pts.push({ x: x0 + wav * Math.sin(ph + j * 1.1 + c), y: y });
          }
          if (c > 0) for (var m = 0; m < rowsN; m += 2) pins.push({ x: Z.x0 + c * dx, y: Z.y0 + (m + (c % 2 ? 1 : 0.5)) * dy });
        }
        return { pts: pts, pins: pins };
      },
      // 螺旋
      spiral: function (r, Z, n) {
        var pts = [], pins = [];
        var maxR = Math.min(Z.w, Z.h) * 0.5 - 4, turns = 2.1 + 0.6 * r();
        var b = (maxR - 30) / (turns * TAU), dir = r() < 0.5 ? 1 : -1, a0 = r() * TAU, th = 0;
        for (var guard = 0; guard < 400; guard++) {
          var rr = 30 + b * th;
          if (rr > maxR) break;
          pts.push({ x: Z.cx + rr * Math.cos(a0 + dir * th), y: Z.cy + rr * Math.sin(a0 + dir * th) });
          th += 38 / Math.max(rr, 20);
        }
        pins.push({ x: Z.cx, y: Z.cy });
        return { pts: pts, pins: pins };
      },
      // 散落
      scatter: function (r, Z, n) {
        return { pts: poissonFill(r, Z, [], n, 40, null), pins: [] };
      }
    };
    var PATTERN_NAMES = ['stagger', 'rings', 'vee', 'diamond', 'arcs', 'clusters', 'columns', 'spiral', 'scatter'];

    function weightedKind(r) {
      var ks = C.PEG_KINDS, wsum = 0, i;
      for (i = 0; i < ks.length; i++) wsum += C.PEG_WEIGHTS[ks[i]] || 0;
      var u = r() * wsum;
      for (i = 0; i < ks.length; i++) { u -= C.PEG_WEIGHTS[ks[i]] || 0; if (u < 0) return ks[i]; }
      return ks[0];
    }

    function genBoard(forced) {
      var L = S.level;
      var r = mulberry32(mix(mix(seed ^ 0xA5A5A5, L.index), boardNo));
      boardNo++;
      var Z = { x0: C.PEG_X_MIN, x1: C.PEG_X_MAX, y0: C.PEG_Y_MIN, y1: zoneY1 };
      Z.w = Z.x1 - Z.x0; Z.h = Z.y1 - Z.y0; Z.cx = (Z.x0 + Z.x1) / 2; Z.cy = (Z.y0 + Z.y1) / 2;
      var hs = Z.h / C.PEG_REF_H;
      var n = Math.max(6, Math.round(C.PEG_COUNT * hs)) + M.pegPlus;
      var names = [];
      for (var i = 0; i < PATTERN_NAMES.length; i++) if (PATTERN_NAMES[i] !== lastPattern) names.push(PATTERN_NAMES[i]);
      var name = forced && PATTERNS[forced] ? forced : names[Math.floor(r() * names.length)];
      var res = PATTERNS[name](r, Z, n);
      // 篩選：在區域內、彼此距離 ≥ PEG_MIN_DIST
      var pts = [];
      for (i = 0; i < res.pts.length; i++) {
        var p = res.pts[i];
        if (p.x < Z.x0 - 0.5 || p.x > Z.x1 + 0.5 || p.y < Z.y0 - 0.5 || p.y > Z.y1 + 0.5) continue;
        if (farFrom(pts, p, C.PEG_MIN_DIST)) pts.push({ x: clamp(p.x, Z.x0, Z.x1), y: clamp(p.y, Z.y0, Z.y1) });
      }
      var hi = Math.round(n * 1.2), lo = Math.round(n * 0.85);
      while (pts.length > hi) pts.splice(Math.floor(r() * pts.length), 1);
      if (pts.length < lo) poissonFill(r, Z, pts, lo, C.PEG_MIN_DIST + 4, null);
      // 種類：保底＋權重隨機
      // 本關清盤獎勵用完後重排的盤面不再放補彈釘（長時間的魔王戰不會靠清盤無限補彈）
      var kinds = [], g = C.PEG_GUARANTEE, noRefill = boardNo > 1 && boardBonusLeft <= 0;
      for (i = 0; i < C.PEG_KINDS.length; i++) {
        var kk = C.PEG_KINDS[i];
        if (noRefill && kk === 'refill') continue;
        for (var q = 0; q < (g[kk] || 0) && kinds.length < pts.length; q++) kinds.push(kk);
      }
      while (kinds.length < pts.length) { var wk = weightedKind(r); kinds.push(noRefill && wk === 'refill' ? 'attack' : wk); }
      shuffle(kinds, r);
      // 固定釘
      var pins = [], PZ = { x0: C.PIN_X_MIN, x1: C.PIN_X_MAX, y0: Z.y0 + 8, y1: Z.y1 + 6 };
      var pinN = Math.max(4, Math.round(C.PIN_COUNT * hs));
      var okPin = function (p) {
        return p.x >= PZ.x0 && p.x <= PZ.x1 && p.y >= PZ.y0 && p.y <= PZ.y1 &&
          farFrom(pins, p, C.PIN_MIN_DIST) && farFrom(pts, p, C.PIN_SKILL_MIN);
      };
      var hints = res.pins || [];
      for (i = 0; i < hints.length && pins.length < pinN; i++) if (okPin(hints[i])) pins.push(hints[i]);
      for (var tries = 0; pins.length < pinN && tries < 2000; tries++) {
        var pp = { x: PZ.x0 + r() * (PZ.x1 - PZ.x0), y: PZ.y0 + r() * (PZ.y1 - PZ.y0) };
        if (okPin(pp)) pins.push(pp);
      }
      var pegs = [];
      for (i = 0; i < pts.length; i++) pegs.push({ id: uid++, kind: kinds[i], x: round1(pts[i].x), y: round1(pts[i].y), r: C.PEG_R, alive: true, regrowT: 0 });
      for (i = 0; i < pins.length; i++) pegs.push({ id: uid++, kind: 'pin', x: round1(pins[i].x), y: round1(pins[i].y), r: C.PIN_R, alive: true, regrowT: 0 });
      S.pegs = pegs;
      boardPattern = name; lastPattern = name;
      buildGrid();
    }

    // 格子分區：每根釘子放進「它能碰到的彈珠中心」會落在的所有格子；查詢時只看彈珠中心所在的格子
    function buildGrid() {
      grid = new Array(GCOLS * GROWS);
      for (var i = 0; i < grid.length; i++) grid[i] = [];
      var reachBall = Math.max(C.BALL_R * 2, M.ballR) + 1;
      for (i = 0; i < S.pegs.length; i++) {
        var p = S.pegs[i], reach = p.r + reachBall;
        var c0 = clamp(Math.floor((p.x - reach) / GCELL), 0, GCOLS - 1), c1 = clamp(Math.floor((p.x + reach) / GCELL), 0, GCOLS - 1);
        var r0 = clamp(Math.floor((p.y - reach) / GCELL), 0, GROWS - 1), r1 = clamp(Math.floor((p.y + reach) / GCELL), 0, GROWS - 1);
        for (var ry = r0; ry <= r1; ry++) for (var cx = c0; cx <= c1; cx++) grid[ry * GCOLS + cx].push(p);
      }
    }

    // ---------------- 彈珠 ----------------
    function newBall(x, y, vx, vy, a) {
      return {
        id: uid++, x: x, y: y, vx: vx, vy: vy, r: M.ballR,
        dmg: a ? a.dmg : M.baseDmg, mult: a ? a.mult : 1,
        fire: a ? !!a.fire : false, ice: a ? !!a.ice : false, gold: a ? !!a.gold : false,
        redrops: a ? (a.redrops || 0) : 0, age: 0,
        _life: 0, _cpT: 0, _cpY: y, _stuck: 0, _dead: false, _paid: false, _canSplit: !a
      };
    }
    function snapshot(b) {
      return b ? { id: b.id, dmg: b.dmg, mult: b.mult, fire: b.fire, ice: b.ice, gold: b.gold, redrops: b.redrops } : null;
    }

    function doFire() {
      var n = M.shots;
      S.marbles -= 1;
      for (var i = 0; i < n; i++) {
        firedBalls++;
        var off = n === 2 ? (i === 0 ? -5 : 5) : 0;
        var x = clamp(S.aimX + off + (rng() * 2 - 1) * C.SPAWN_JITTER, C.AIM_MIN, C.AIM_MAX);
        var b = newBall(x, C.SPAWN_Y, (rng() * 2 - 1) * C.SPAWN_VX + off * 3, C.SPAWN_VY, null);
        b.gold = M.golden && firedBalls % C.GOLDEN_EVERY === 0;
        b._paid = i === 0;            // 只有真正扣了彈珠的那顆能被「回收」退回（分身、雙重射擊第 2 顆不算）
        S.balls.push(b);
      }
      S.stats.fired += n;
      emit({ t: 'fire', x: S.aimX, y: C.SPAWN_Y, n: n, cost: 1 });
    }

    function missBall(b) {
      b._dead = true;
      S.stats.misses++;
      if (b._paid && M.recycle > 0 && rng() < M.recycle) {
        emit({ t: 'recycle', x: b.x, y: FLOOR_Y });
        addMarbles(1, 'recycle');
      } else emit({ t: 'miss', x: b.x, y: FLOOR_Y });
    }

    function wallEvent(b, speed) {
      if (speed > C.WALL_EVENT_SPEED && wallCd <= 0) { wallCd = C.WALL_EVENT_GAP; emit({ t: 'wall', x: b.x < W / 2 ? 0 : W, y: b.y, speed: Math.round(speed) }); }
    }

    function collideWalls(b) {
      if (b.x < b.r) { b.x = b.r; if (b.vx < 0) { wallEvent(b, -b.vx); b.vx = -b.vx * C.REST_WALL; } }
      else if (b.x > W - b.r) { b.x = W - b.r; if (b.vx > 0) { wallEvent(b, b.vx); b.vx = -b.vx * C.REST_WALL; } }
      if (b.y < b.r) { b.y = b.r; if (b.vy < 0) b.vy = -b.vy * C.REST_WALL; }
    }

    function collidePegs(b) {
      var cx = clamp(Math.floor(b.x / GCELL), 0, GCOLS - 1), cy = clamp(Math.floor(b.y / GCELL), 0, GROWS - 1);
      var cell = grid[cy * GCOLS + cx];
      for (var i = 0; i < cell.length; i++) {
        var p = cell[i];
        if (!p.alive) continue;
        var dx = b.x - p.x, dy = b.y - p.y, R = b.r + p.r, d2 = dx * dx + dy * dy;
        if (d2 >= R * R) continue;
        var d = Math.sqrt(d2), nx, ny;
        if (d < 1e-6) { nx = rng() < 0.5 ? -0.6 : 0.6; ny = -0.8; } else { nx = dx / d; ny = dy / d; }
        b.x = p.x + nx * R; b.y = p.y + ny * R;
        var vn = b.vx * nx + b.vy * ny;
        if (vn < 0) {
          var e = p.kind === 'pin' ? C.REST_PIN : C.REST_PEG;
          b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
          var j = (rng() * 2 - 1) * C.JITTER;
          b.vx += -ny * j; b.vy += nx * j;
        }
        if (p.kind === 'pin') {
          if (-vn > C.PIN_EVENT_SPEED && pinCd <= 0) { pinCd = C.PIN_EVENT_GAP; emit({ t: 'pin', x: p.x, y: p.y, speed: Math.round(-vn) }); }
        } else trigger(p, b, 'ball', null);
        if (b._dead) return;
      }
    }

    function collideMonsters(b) {
      if (b.y + b.r < monsterTopY - 24) return false;
      for (var i = 0; i < S.monsters.length; i++) {
        var m = S.monsters[i];
        if (!m.alive) continue;
        var w = m.weak, dx = b.x - w.x, dy = b.y - w.y, R = w.r + b.r;
        if (dx * dx + dy * dy < R * R) { hitMonster(b, m, true); return true; }
        var ex = (b.x - m.x) / (m.rx + b.r), ey = (b.y - m.y) / (m.ry + b.r);
        if (ex * ex + ey * ey < 1) { hitMonster(b, m, false); return true; }
      }
      return false;
    }

    function stuckCheck(b, dt) {
      b._cpT += dt;
      if (b._cpT >= C.STUCK_CHECK) {
        b._cpT = 0;
        if (b.y - b._cpY < C.STUCK_MIN_DY) {
          b._stuck++;
          if (b._stuck >= 2) { b.vx += (rng() < 0.5 ? -1 : 1) * (60 + rng() * 80); b.vy -= 40; }
        } else b._stuck = 0;
        b._cpY = b.y;
      }
      if (b._life > C.BALL_MAX_LIFE || b._stuck >= C.STUCK_KILL) missBall(b);
    }

    function stepBalls(dt) {
      var balls = S.balls, i;
      for (i = 0; i < balls.length; i++) {
        var b = balls[i];
        if (b._dead) continue;
        b.age += dt; b._life += dt;
        b.vy += C.GRAVITY * dt;
        var v2 = b.vx * b.vx + b.vy * b.vy;
        if (v2 > VMAX2) { var kk = C.VMAX / Math.sqrt(v2); b.vx *= kk; b.vy *= kk; v2 = VMAX2; }
        var move = Math.sqrt(v2) * dt;
        var sub = move > C.MAX_MOVE ? Math.ceil(move / C.MAX_MOVE) : 1, h = dt / sub;
        for (var s = 0; s < sub; s++) {
          b.x += b.vx * h; b.y += b.vy * h;
          collideWalls(b);
          collidePegs(b);
          if (b._dead) break;
          if (collideMonsters(b)) break;
          if (b.y >= FLOOR_Y - b.r) { missBall(b); break; }
        }
        if (!b._dead) stuckCheck(b, dt);
      }
      var j = 0;
      for (i = 0; i < balls.length; i++) if (!balls[i]._dead) balls[j++] = balls[i];
      balls.length = j;
      for (i = 0; i < spawnList.length; i++) {
        if (balls.length < C.FIELD_MAX) balls.push(spawnList[i]); else if (S.queue < C.QUEUE_MAX) S.queue++;
      }
      spawnList.length = 0;
    }

    // ---------------- 釘子效果 ----------------
    function trigger(p, b, via, snap) {
      if (!p.alive || p.kind === 'pin') return;
      p.alive = false;
      p.regrowT = M.regrow && p.kind !== 'refill' ? C.REGROW_T : 0;   // 補彈釘不重生（否則彈珠無限）
      S.stats.pegs++;
      var live = b && !b._dead ? b : null;
      emit({ t: 'peg', kind: p.kind, x: p.x, y: p.y, ballId: live ? live.id : (snap ? snap.id : 0), via: via });
      switch (p.kind) {
        case 'attack': if (live) live.dmg += C.ATTACK_BONUS; break;
        case 'crit': if (live) live.mult = Math.min(C.CRIT_MAX, live.mult * 2); break;
        case 'fire': if (live) live.fire = true; break;
        case 'ice': if (live) live.ice = true; break;
        case 'split': doSplit(p, live, via, snap); break;
        case 'bomb': explode(p, live, snap); break;
        case 'refill': addMarbles(C.REFILL_PEG + M.supply, 'peg'); break;
      }
      if (via === 'ball' && M.chainN > 0) chainFrom(p, live);
      if (boardClearT < 0 && !M.regrow) checkBoardClear();
    }

    function checkBoardClear() {
      var any = false;
      for (var i = 0; i < S.pegs.length; i++) {
        var p = S.pegs[i];
        if (p.kind === 'pin') continue;
        any = true;
        if (p.alive || p.regrowT > 0) return;
      }
      if (any) boardClearT = C.BOARD_CLEAR_DELAY;
    }

    function chainFrom(p, b) {
      var cand = [], R2 = C.CHAIN_R * C.CHAIN_R;
      for (var i = 0; i < S.pegs.length; i++) {
        var q = S.pegs[i];
        if (q === p || !q.alive || q.kind === 'pin') continue;
        var dx = q.x - p.x, dy = q.y - p.y, d2 = dx * dx + dy * dy;
        if (d2 <= R2) cand.push({ q: q, d2: d2 });
      }
      cand.sort(function (a, c) { return a.d2 - c.d2 || a.q.id - c.q.id; });
      for (i = 0; i < cand.length && i < M.chainN; i++) {
        var t = cand[i].q;
        if (!t.alive) continue;
        emit({ t: 'chain', x1: p.x, y1: p.y, x2: t.x, y2: t.y });
        trigger(t, b, 'chain', null);
      }
    }

    // 每顆彈珠一生只分裂一次；分身（含排隊補出的）不會再分裂，避免免費彈珠無限增生
    function doSplit(p, b, via, snap) {
      if (!b || !b._canSplit) return;
      b._canSplit = false;
      var n = M.splitN, a = b, ox, oy, dirx = 0, diry = 1, spd = C.SPLIT_SPEED;
      if (via === 'ball' && b) {
        ox = b.x; oy = b.y;
        var v = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
        if (v > 1) { dirx = b.vx / v; diry = b.vy / v; }
        spd = Math.max(C.SPLIT_SPEED, v);
      } else { ox = p.x; oy = p.y; }
      emit({ t: 'split', x: ox, y: oy, n: n });
      var angs = n >= 5 ? C.SPLIT_ANG5 : C.SPLIT_ANG3;
      for (var i = 0; i < n - 1; i++) {
        var ang = (angs[i % angs.length] + (rng() * 2 - 1) * 6) * Math.PI / 180, ca = Math.cos(ang), sa = Math.sin(ang);
        spawnList.push(newBall(ox, oy, (dirx * ca - diry * sa) * spd, (dirx * sa + diry * ca) * spd, a));
      }
    }

    function explode(p, b, snap) {
      var R = C.BOMB_R * M.blastR, i;
      emit({ t: 'explode', x: p.x, y: p.y, r: R });
      var a = b || snap;
      var basePow = a ? a.dmg * a.mult * (a.gold ? C.GOLD_MULT : 1) : M.baseDmg;
      for (i = 0; i < S.monsters.length; i++) {
        var m = S.monsters[i];
        if (!m.alive) continue;
        var ex = (m.x - p.x) / (m.rx + R), ey = (m.y - p.y) / (m.ry + R);
        if (ex * ex + ey * ey >= 1) continue;
        var frozen = m.frozenT > 0;
        var d = Math.max(1, Math.round(basePow * C.BOMB_DMG * M.blastDmg * (frozen ? 1 + M.frostDmg : 1)));
        var hx = clamp(p.x, m.x - m.rx * 0.8, m.x + m.rx * 0.8), hy = m.y - m.ry * 0.7;
        damageMonster(m, d);
        emit({ t: 'hit', monsterId: m.id, x: hx, y: hy, dmg: d, crit: false, weak: false, gold: !!(a && a.gold), frozen: frozen,
               combo: S.combo.n, kind: m.kind, bomb: true });
        if (m.hp <= 0) kill(m);
      }
      var R2 = R * R;
      for (i = 0; i < S.balls.length; i++) {
        var o = S.balls[i];
        if (o._dead) continue;
        var dx = o.x - p.x, dy = o.y - p.y, d2 = dx * dx + dy * dy;
        if (d2 < R2 && d2 > 1e-6) {
          var dd = Math.sqrt(d2), f = C.BOMB_PUSH * (1 - dd / R);
          o.vx += dx / dd * f; o.vy += dy / dd * f;
        }
      }
      var sn = snapshot(a);
      for (i = 0; i < S.pegs.length; i++) {
        var q = S.pegs[i];
        if (q === p || !q.alive || q.kind === 'pin') continue;
        var qx = q.x - p.x, qy = q.y - p.y;
        if (qx * qx + qy * qy < R2) bombs.push({ t: C.BOMB_DELAY, peg: q, ball: b, snap: sn });
      }
    }

    function updateBombs(dt) {
      if (!bombs.length) return;
      var cur = bombs, due = [];
      bombs = [];
      for (var i = 0; i < cur.length; i++) {
        cur[i].t -= dt;
        if (cur[i].t <= 0) due.push(cur[i]); else bombs.push(cur[i]);
      }
      for (i = 0; i < due.length; i++) {
        if (S.phase !== 'play') return;
        var d = due[i], bb = d.ball && !d.ball._dead ? d.ball : null;
        trigger(d.peg, bb, 'bomb', d.snap);
      }
    }

    // ---------------- 怪物 ----------------
    function damageMonster(m, d) {
      m.hp -= d;
      m.flashT = C.FLASH_T;
      S.stats.damage += d;
      if (d > S.stats.maxHit) S.stats.maxHit = d;
    }

    function nextMilestone(i) {
      var ms = C.COMBO_MILESTONES;
      return i < ms.length ? ms[i] : ms[ms.length - 1] + (i - ms.length + 1) * 100;
    }

    function hitMonster(b, m, weak) {
      var crit = M.critChance > 0 && rng() < M.critChance;
      var frozen = m.frozenT > 0;
      var d = b.dmg * b.mult * (crit ? 2 : 1);
      if (weak) d *= M.weakDmg;
      if (frozen) d *= 1 + M.frostDmg;
      if (b.gold) d *= C.GOLD_MULT;
      d = Math.max(1, Math.round(d));
      S.combo.n++; S.combo.t = C.COMBO_WINDOW;
      if (S.combo.n > S.combo.best) S.combo.best = S.combo.n;
      if (S.combo.n > S.stats.maxCombo) S.stats.maxCombo = S.combo.n;
      S.stats.hits++;
      if (weak) S.stats.weakHits++;
      damageMonster(m, d);
      emit({ t: 'hit', monsterId: m.id, x: b.x, y: b.y, dmg: d, crit: crit || b.mult > 1, weak: weak, gold: b.gold, frozen: frozen,
             combo: S.combo.n, kind: m.kind });
      var ms = nextMilestone(comboMs);
      if (S.combo.n >= ms) { comboMs++; emit({ t: 'combo', n: ms }); }
      if (m.hp > 0) {
        if (b.fire) applyBurn(m, b.dmg * b.mult * C.BURN_FACTOR, true);
        if (b.ice) applyFreeze(m);
      }
      if (weak && b.redrops < C.WEAK_REDROP_MAX) weakBack(b);
      else b._dead = true;
      if (m.hp <= 0) kill(m);
    }

    function weakBack(b) {
      var x1 = b.x, y1 = b.y;
      b.redrops++;
      b.x = clamp(b.x, C.AIM_MIN, C.AIM_MAX); b.y = C.SPAWN_Y;
      b.vx = (rng() * 2 - 1) * C.SPAWN_VX; b.vy = C.SPAWN_VY;
      b.dmg = M.baseDmg; b.mult = 1; b.fire = false; b.ice = false;   // 只保留黃金
      b.age = 0; b._life = 0; b._stuck = 0; b._cpT = 0; b._cpY = b.y;
      emit({ t: 'weakBack', x: x1, y: y1, x2: b.x, y2: b.y, ballId: b.id });
    }

    function applyBurn(m, dps, spread) {
      m.burnDps += dps; m.burnT = C.BURN_T;
      if (!spread || !M.wildfire) return;
      var left = null, right = null;
      for (var i = 0; i < S.monsters.length; i++) {
        var o = S.monsters[i];
        if (o === m || !o.alive) continue;
        if (o.x <= m.x && (!left || o.x > left.x)) left = o;
        if (o.x > m.x && (!right || o.x < right.x)) right = o;
      }
      if (left) applyBurn(left, dps, false);
      if (right) applyBurn(right, dps, false);
    }

    function applyFreeze(m) {
      m.frozenT = Math.min(M.freezeMax, m.frozenT + M.freezeT);
      // 文件寫「t」，但 t 已經是事件種類鍵，所以冰凍秒數放在 dur
      emit({ t: 'freeze', monsterId: m.id, x: m.x, y: m.y, dur: m.frozenT });
    }

    function dropFor(m) {
      var base = (C.DROP[m.kind] || 0) * (1 + C.DROP_GROWTH * (S.level.chapter - 1));
      return Math.max(1, Math.round(base * M.lootMult));
    }

    function kill(m) {
      if (!m.alive) return;
      m.alive = false; m.hp = 0; m.deadT = 0;
      m.frozenT = 0; m.burnT = 0; m.burnDps = 0;
      S.stats.kills++;
      var e = emit({ t: 'kill', monsterId: m.id, species: m.species, kind: m.kind, x: m.x, y: m.y, drop: 0 });
      e.drop = addMarbles(dropFor(m), 'kill');
    }

    function updateMonsters(dt) {
      for (var i = S.monsters.length - 1; i >= 0; i--) {
        var m = S.monsters[i];
        if (m.flashT > 0) m.flashT = Math.max(0, m.flashT - dt);
        if (!m.alive) {
          m.deadT += dt;
          if (m.deadT >= C.DEAD_T) S.monsters.splice(i, 1);
          continue;
        }
        if (m.frozenT > 0) m.frozenT = Math.max(0, m.frozenT - dt);
        else {
          m.x += m.dir * m._spd * dt;
          if (m.x < m._lo) { m.x = m._lo; m.dir = 1; } else if (m.x > m._hi) { m.x = m._hi; m.dir = -1; }
          var wk = SPEC[m.species].weak;
          if (wk.arc) m._ph += wk.spd * dt;
        }
        if (m.burnT > 0) {
          m.burnT -= dt; m._bt += dt;
          if (m._bt >= C.BURN_TICK) {
            m._bt -= C.BURN_TICK;
            var raw = m.burnDps * C.BURN_TICK * M.burnMult + m._ba;
            var dmg = Math.floor(raw);
            m._ba = raw - dmg;
            if (dmg >= 1) {
              m.hp -= dmg; S.stats.damage += dmg;
              emit({ t: 'burn', monsterId: m.id, x: m.x, y: m.y - m.h * 0.25, dmg: dmg });
              if (m.hp <= 0) { kill(m); continue; }

  // talentOffer / reroll / talentPick / gameOver：音效由用戶端負責，Juice 不出聲

  var inited = false;
  function autoInit() { if (!inited) { inited = true; ART = root.MarbleArt || null; AUD = root.MarbleAudio || null; } }
  function onEvent(ev) {
    if (!ev || typeof ev.t !== 'string') return;

  }

  /* ---------------- 每幀更新 ---------------- */
  function update(dt) {
    autoInit();
    dt = num(dt, 0);
    if (dt <= 0) return;
    if (dt > 0.1) dt = 0.1;
    clock += dt;
    frameTexts = 0; frameNums = 0;
    if (hsLeft > 0) { hsLeft -= dt; if (hsLeft <= 0) { hsLeft = 0; hsRec = HS_REC; } }
    else if (hsRec > 0) { hsRec -= dt; if (hsRec <= 0) { hsRec = 0; hsScale = 1; } }
    var wdt = dt * (0.3 + 0.7 * timeScale());       // 打擊停頓時特效也放慢（慢動作爆開），但不會完全停住
    var i, k, p, q;
    for (i = 0; i < MAX_P; i++) {
      p = PP[i];
      if (!p.on) continue;
      p.t += wdt;
      if (p.t >= p.life) { p.on = false; pFree.push(i); pCount--; continue; }
      if (p.drag) { k = 1 - p.drag * wdt; if (k < 0) k = 0; p.vx *= k; p.vy *= k; }
      p.vy += p.g * wdt;
      if (p.k === K_CONF) p.vx += Math.sin(p.t * 9 + p.ph) * 160 * wdt;
      p.x += p.vx * wdt; p.y += p.vy * wdt;
    }
    for (i = 0; i < MAX_N; i++) {
      q = NN[i];
      if (!q.on) continue;
      q.t += wdt;
      if (q.t >= q.life) { q.on = false; nCount--; continue; }
      k = 1 - 5.5 * wdt; if (k < 0) k = 0;
      q.vx *= k; q.vy *= k;
      q.x += q.vx * wdt; q.y += q.vy * wdt;
      if (q.bump > 0) q.bump = Math.max(0, q.bump - wdt * 6);
    }
    for (i = 0; i < MAX_L; i++) {
      var l = LL[i];
      if (!l.on) continue;
      l.t += wdt;
      if (l.t >= l.life) { l.on = false; continue; }
      l.y += l.vy * wdt; l.vy *= Math.max(0, 1 - 3 * wdt);
    }
    for (i = 0; i < MAX_R; i++) { var r = RR[i]; if (r.on) { r.t += wdt; if (r.t >= r.life) r.on = false; } }
    for (i = 0; i < MAX_B; i++) {
      var b = BB[i];
      if (!b.on) continue;
      b.t += wdt; b.jt += wdt;
      if (b.t >= b.life) { b.on = false; continue; }
      if (b.jt > 0.035) { b.jt = 0; jitterBolt(b); }
    }
    for (i = 0; i < MAX_T; i++) { var tr = TT[i]; if (tr.on) { tr.t += wdt; if (tr.t >= tr.life) tr.on = false; } }
    for (i = 0; i < MAX_F; i++) {
      var f = FF[i];
      if (!f.on) continue;
      f.t += wdt;
      if (f.t < f.delay) { f.px = f.x0; f.py = f.y0; continue; }
      var u = (f.t - f.delay) / f.dur;
      if (u >= 1) { f.on = false; if (hud.y > -2) P(K_SPARK, hud.x, hud.y, 0, 0, 0, 0, 0.18, 2, '#fff6b0'); continue; }
      var e = u * u * (3 - 2 * u), m = 1 - e;      // 先慢後快、最後收進 HUD
      f.px = m * m * f.x0 + 2 * m * e * f.cx + e * e * hud.x;
      f.py = m * m * f.y0 + 2 * m * e * f.cy + e * e * hud.y;
      f.tt += wdt;
      if (f.tt > 0.035) { f.tt = 0; P(K_SQ, f.px, f.py, 0, 0, 0, 0, 0.14, 2, f.green ? '#8cf07c' : '#c4f8ff'); }
    }
    for (i = 0; i < MAX_Q; i++) {                    // 延後的音效用真實時間
      var qq = QQ[i];
      if (!qq.on) continue;
      qq.t -= dt;
      if (qq.t <= 0) { qq.on = false; S.sfx(qq.name, { volume: qq.vol, pitch: qq.pitch }); }
    }
    // 震動（螢幕）：trauma² 決定幅度，40Hz 換一次位置，像素對齊
    trauma = Math.max(0, trauma - dt * 1.7);
    shakeT += dt;
    if (trauma <= 0) { shake.x = 0; shake.y = 0; }
    else if (shakeT >= 0.025) {
      shakeT = 0;
      var amp = trauma * trauma * 9;
      shake.x = Math.round(amp * (rnd() * 2 - 1)); shake.y = Math.round(amp * (rnd() * 2 - 1));
    }
    if (SCR.flash > 0) SCR.flash = Math.max(0, SCR.flash - dt * SCR.flashDecay);
    if (SCR.warn > 0) SCR.warn = Math.max(0, SCR.warn - dt);
    if (SCR.edge > 0) SCR.edge = Math.max(0, SCR.edge - dt * 2.8);
    if (SCR.board > 0) SCR.board = Math.max(0, SCR.board - dt * 3);
    CB.idle += dt;
    if (CB.bump > 0) CB.bump = Math.max(0, CB.bump - dt * 5);
    flushVib();
  }

  /* ---------------- 像素繪圖小工具 ---------------- */
  function pxRing(ctx, x, y, r, th) {
    var n = Math.max(10, Math.ceil(6.283 * r / Math.max(2, th * 0.9))), h = th / 2;

  function stepSim(dt) {
    var total = dt * Jz.timeScale() * debugTS, guard = 0;
    while (total > 1e-6 && guard++ < 20) {
      var s = total > 0.1 ? 0.1 : total;
      try { sim.step(s); } catch (e) { errOnce('sim.step', e); return; }
      total -= s;
    }
  }
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = lastFrame ? (now - lastFrame) / 1000 : 0;
    lastFrame = now;
    if (!(dt > 0)) dt = 0; else if (dt > 0.1) dt = 0.1;
    fpsTick(now);
    try { tick(dt); } catch (e) { errOnce('frame', e); }
  }
  function tick(dt) {
    var g = sim && sim.state && inGame();
    if (screen !== 'pause') animT += dt;
    if (g) {
      if (screen === 'play') {
        var dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
        if (dir) simCall('nudgeAim', dir * 260 * dt);
      }
      syncFiring();
      if (screen !== 'pause' && screen !== 'over') stepSim(dt);
      pumpEvents();
      syncPhase();
    } else if (screen === 'title' || screen === 'chapters') {
      updateTitleScene(dt);
    }
    if (screen !== 'pause') Jz.call('update', dt);
    if (sim && sim.state && inGame()) {
      var st = sim.state;
      renderGame(st);
      updateHud(st);
      updateFireBtn(st);
      syncKnob(st.aimX);
    } else renderTitle();
  }

  /* ================= 按鈕綁定 ================= */
  function tap(el, fn, snd) { el.addEventListener('click', function (e) { if (snd) Au.sfx(snd); fn(e); }); }
  tap(E.btnStart, function () { startRun(1); }, 'ui_tap');
  tap(E.btnChapters, function () { openChapters('title'); }, 'ui_tap');
  tap(E.btnChapterBack, closeChapters);
  tap(E.titleSound, toggleSound);
  tap(E.titleVibe, toggleVibe);
  tap(E.optSound, toggleSound);
  tap(E.optVibe, toggleVibe);
  tap(E.btnPause, function () { blurActive(); pauseGame(); });
  E.btnPause.addEventListener('pointerdown', function (e) { if (e.pointerType === 'mouse') e.preventDefault(); });
  tap(E.btnResume, resumeGame);
  tap(E.btnRestart, function () { startRun(runChapter); }, 'ui_tap');
  tap(E.btnHome, goTitle, 'ui_back');
  tap(E.btnReroll, doReroll);
  tap(E.btnRetry, function () { startRun(runChapter); }, 'ui_tap');
  tap(E.btnOverChapters, function () { openChapters('over'); }, 'ui_tap');
  tap(E.btnOverHome, goTitle, 'ui_back');

  /* ================= 測試掛鉤 ================= */
  function ensureSim() { if (!sim) startRun(1); return sim; }
  window.__ML__ = {
    screen: function () { return screen; },
    sim: function () { return sim; },
    state: function () { return sim ? sim.state : null; },
    debug: {
      setMarbles: function (n) { if (sim && sim.debug && sim.debug.setMarbles) { try { sim.debug.setMarbles(n); } catch (e) { errOnce('debug.setMarbles', e); } } },
      killAll: function () { if (sim && sim.debug && sim.debug.killAll) { try { sim.debug.killAll(); } catch (e) { errOnce('debug.killAll', e); } pumpEvents(); syncPhase(); } },
      gotoLevel: function (chapter, stage) {
        if (!ensureSim() || !sim.debug || !sim.debug.gotoLevel) return;
        if (screen === 'pause') setScreen('play');
        overShown = false;
        try { sim.debug.gotoLevel(chapter, stage); } catch (e) { errOnce('debug.gotoLevel', e); }
        pumpEvents(); syncPhase();
      },
      timeScale: function (k) { k = Number(k); debugTS = isFinite(k) ? clamp(k, 0, 8) : 1; return debugTS; },
      unlock: function (chapter) { save.unlocked = Math.max(1, chapter | 0); writeSave(); if (screen === 'chapters') renderChapterList(); },
      clearStorage: function () { store.del(SAVE_KEY); save = defaultSave(); applySettings(); refreshTitle(); if (screen === 'chapters') renderChapterList(); },
      seed: function (n) { nextSeed = (Number(n) >>> 0); return nextSeed; },
      fps: function () { return fpsValue(); },
      // 以下為用戶端自己加的檢查用掛鉤
      layout: function () { return { s: L.s, N: L.N, crisp: L.crisp, cssW: L.cssW, cssH: L.cssH, offX: L.offX, offY: L.offY }; },
      save: function () { return JSON.parse(JSON.stringify(save)); }
    }
  };

  /* ================= 啟動 ================= */
  REGROW_T = cfgNum(['REGROW_TIME', 'REGROW_T', 'regrowTime', 'PEG_REGROW'], 3);
  Jz.call('init', { art: window.MarbleArt || null, audio: window.MarbleAudio || null });
  applyIcons();
  applySettings();
  refreshTitle();
  setTheme(1, 0);
  buildLogo();
  syncPanels();
  layout(true);
  if (window.ResizeObserver) { try { new ResizeObserver(function () { layout(false); }).observe(E.stage); } catch (e) { } }
  window.addEventListener('resize', function () { layout(false); });
  window.addEventListener('orientationchange', function () { setTimeout(function () { layout(true); }, 120); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { layout(false); });
  curMusic = undefined; syncMusic();
  focusLater(E.btnStart, 100);
  requestAnimationFrame(frame);
})();

</script>
</body></html>
