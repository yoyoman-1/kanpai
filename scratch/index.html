<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>刮到一億</title>
<meta name="description" content="開局 1 萬，目標買 1 億的房子。刮刮樂、大樂透、BINGO，沒錢就去彩券行門口乞討。機率全部公開，沒有偷偷讓你中。虛擬金錢遊戲。">
<meta property="og:title" content="刮到一億">
<meta property="og:description" content="開局 1 萬，目標買 1 億的房子。你買得到嗎？">
<script defer src="https://cloud.umami.is/script.js" data-website-id="7116ffc5-6612-4917-9ff3-f57cf074b807"></script>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@500;900&family=Noto+Serif+TC:wght@900&family=Share+Tech+Mono&family=VT323&display=swap">
<style>
/* 版面概念：像素畫彩券行是舞台，所有介面都是店裡拿得到的東西：LED 看板、實體彩券、投注單、舊報紙、手寫帳本 */
:root{
  color-scheme:dark;
  --red:#c8102e;--red-d:#7c0a1e;--gold:#ffd21f;--gold-d:#b87c00;
  --night:#14251f;--night2:#1d352c;--tile-line:#264438;
  --ink:#23211b;--paper:#fbf1d8;--paper2:#efe0ba;--muted:#6f6650;--green:#0b7a50;--line:#d6c69c;--cream:#f4ead0;
  --sign:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC","PMingLiU",serif;
  --body:"LXGW WenKai TC","Noto Sans TC","Microsoft JhengHei",serif;
  --mono:"Share Tech Mono",Consolas,monospace;
  --led:"VT323","Share Tech Mono",Consolas,monospace;
  --foil:linear-gradient(135deg,#8f6420 0%,#f8e7a0 28%,#c99a35 50%,#fff0b5 72%,#98701f 100%);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--cream);font:16px/1.55 var(--body);background-color:var(--night);
  background-image:linear-gradient(var(--tile-line) 1px,transparent 1px),linear-gradient(90deg,var(--tile-line) 1px,transparent 1px);
  background-size:44px 44px;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));overscroll-behavior-y:contain}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#2b0a10}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--sign);font-weight:900;margin:0;text-wrap:balance}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.foil{background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

/* HUD：店門上的 LED 看板 */
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(#3c0f18,#250a10);border-bottom:3px solid #000;box-shadow:inset 0 -2px 0 #6b4a12,0 3px 10px #0008;
  padding:7px max(16px,env(safe-area-inset-right,0px)) 7px max(16px,env(safe-area-inset-left,0px))}
.hud-in{max-width:960px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:center}
#money{font:400 clamp(32px,8vw,46px)/1 var(--led);color:#ffb52e;letter-spacing:2px;background:#0d0705;border:2px solid #000;box-shadow:inset 0 0 0 1px #5a3a10;border-radius:3px;padding:1px 10px;justify-self:start;text-shadow:0 0 8px #ff8a00cc;min-width:0}
#money.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.06);color:#fff3b0}}
.hud-meta{font-size:13px;display:flex;flex-wrap:wrap;gap:0 12px;min-width:0;color:#f0dcc0}
.hud-meta b{color:var(--gold);font-weight:700}
.hud-btns{grid-column:2;grid-row:1/3;display:flex;gap:6px;align-items:center}
#sleep{background:var(--foil);color:#2a1a00;border:0;border-bottom:3px solid #6b4a12;border-radius:5px;padding:8px 12px;font-family:var(--sign);font-weight:900;font-size:15px;white-space:nowrap}
#sleep:active{transform:translateY(2px);border-bottom-width:1px}
#mute{background:none;border:1px solid #ffffff55;border-radius:5px;color:#f0dcc0;padding:7px 9px;font-size:13px}
.prog{grid-column:1/-1;height:10px;background:#120507;border:1px solid #000;box-shadow:inset 0 0 0 1px #5a3a10;border-radius:2px;overflow:hidden;margin-top:3px}
.prog i{display:block;height:100%;width:0;transition:width .4s;background:repeating-linear-gradient(90deg,#ffb52e 0 7px,#c97a00 7px 9px)}
.prog-l{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;gap:8px;color:#e8d3b5}

#view{max-width:960px;margin:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.panel{background:var(--paper);color:var(--ink);border:2px solid #000;border-radius:4px;padding:14px;min-width:0;box-shadow:0 3px 0 #0006}
.panel h2{font-size:20px;margin-bottom:6px}
.note{font-size:13.5px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--cream);color:var(--ink);border:2px solid #000;border-bottom-width:4px;border-radius:4px;padding:8px 13px;font-family:var(--sign);font-weight:500;font-size:15px;min-height:40px}
.btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.btn.pri{background:var(--red);color:#fff}
.btn.gold{background:var(--foil);color:#2a1a00}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{font-size:13.5px;padding:4px 9px;min-height:32px}

/* 場景：背景固定比例置中，超寬時兩側接鏡像延伸並往外壓暗，接縫連續、畫面保持銳利 */
.street{--sh:min(clamp(262px,50vh,500px),74vw);--sw:calc((var(--sh) - 6px)*1024/572);--art:var(--bgStreet);position:relative;height:var(--sh);border:3px solid #000;border-radius:4px;overflow:hidden;background:#080604}
.street.shop{--sh:min(clamp(232px,40vh,430px),74vw);--art:var(--bgShop)}
.street::before,.street::after{content:"";position:absolute;top:0;bottom:0;width:var(--sw);transform:scaleX(-1)}
.street::before{right:calc(50% + var(--sw)/2);background:linear-gradient(90deg,#08060455,#080604f2 30%),var(--art) center/100% 100%}
.street::after{left:calc(50% + var(--sw)/2);background:linear-gradient(270deg,#08060455,#080604f2 30%),var(--art) center/100% 100%}
.scene{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);aspect-ratio:1024/572;height:100%;background:var(--bgStreet) center/100% 100%;container-type:size;image-rendering:auto}
.shop .scene{background-image:var(--bgShop)}
.signtxt{position:absolute;left:30.6%;width:38.8%;top:23.3%;height:13.8%;display:grid;place-items:center;font:900 9cqh/1 var(--sign);letter-spacing:.14em;color:#ffe25a;text-shadow:0 0 1.6cqh #ffbf00,0 .4cqh 0 #5b0000;animation:neon 5s infinite}
@keyframes neon{0%,91%,95%,100%{opacity:1}93%{opacity:.55}}
.vban{position:absolute;top:44.5%;height:23.6%;width:4.2%;display:grid;place-items:center;writing-mode:vertical-rl;font:900 2.9cqh/1 var(--sign);letter-spacing:.1em;color:#ffe9a8}
.vban.l{left:24.9%}.vban.r{left:70.8%}
.glow{position:absolute;left:30%;width:40%;top:42%;height:58%;background:radial-gradient(ellipse at 50% 45%,#ffd77a55,transparent 70%);animation:breathe 4s ease-in-out infinite;pointer-events:none}
@keyframes breathe{50%{opacity:.55}}
.spr{position:absolute;display:block;image-rendering:auto;filter:drop-shadow(0 .6cqh 0 #0005)}
.actor{position:absolute;left:18.5%;bottom:2.5%;height:33%}
.actor .spr{position:relative;height:100%;width:auto}
.actor::before,#passer::before{content:"";position:absolute;left:6%;right:6%;bottom:-1.5%;height:10%;border-radius:50%;background:radial-gradient(closest-side,#000b,#0000)}
#me.idle{animation:bob 1.8s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-.5cqh)}}
.bowl{position:absolute;left:35.5%;bottom:4%;width:7.5%;height:5.5%;background:linear-gradient(#8a8f99 0 22%,#d7dbe2 22% 40%,#7c828c 40% 100%);border-radius:0 0 50% 50%/0 0 100% 100%;border:.3cqh solid #111}
.bowl i{position:absolute;left:18%;right:18%;top:-22%;height:40%;background:radial-gradient(#ffe27a 30%,#b87c00 75%);border-radius:50%;opacity:0;transition:opacity .2s}
.bowl.has i{opacity:1}
#passer{position:absolute;bottom:2.5%;height:34%;aspect-ratio:.6;left:105%;z-index:3}
#passer:empty::before{display:none}
#passer img{position:absolute;bottom:0;left:50%;height:100%;width:auto;transform:translateX(-50%) scaleX(-1);filter:drop-shadow(0 .6cqh 0 #0005)}
#passer img.f2{animation:f2 .46s steps(1) infinite}
#passer img.f1{animation:f1 .46s steps(1) infinite}
@keyframes f1{0%{visibility:visible}50%{visibility:hidden}}
@keyframes f2{0%{visibility:hidden}50%{visibility:visible}}
#passer.walk{animation:walk 7.5s linear forwards}
@keyframes walk{from{left:105%}to{left:-22%}}
#passer.stop,#passer.stop img{animation-play-state:paused}
.coinfly{position:absolute;left:35.5%;bottom:12%;font:400 7cqh var(--led);color:var(--gold);text-shadow:0 .3cqh 0 #000,0 0 1cqh #ff8a00;animation:coin .9s forwards;z-index:5}
@keyframes coin{to{transform:translateY(-14cqh);opacity:0}}

/* 店內 */
.bosswrap{position:absolute;left:44%;width:24%;top:21%;height:50.8%;overflow:hidden}
.bosswrap::before{content:"";position:absolute;left:8%;right:8%;top:6%;bottom:-24%;background:radial-gradient(closest-side,#06201a88,#0000)}
.bosswrap img{position:absolute;left:50%;top:0;height:118%;transform:translateX(-50%);animation:bob 2.2s steps(2) infinite}
.crt{position:absolute;left:81.8%;top:14.5%;width:12.8%;height:15%;border-radius:12%;overflow:hidden;background:repeating-linear-gradient(#ffffff10 0 1px,transparent 1px 3px),linear-gradient(120deg,#17324e,#0d1a2c);color:#ffe46b;display:grid;place-items:center;font:400 4cqh var(--led);transform:skew(-1deg,4deg);animation:crt 3s steps(3) infinite}
@keyframes crt{50%{filter:brightness(1.25)}}
.bubble{position:absolute;left:12px;top:10px;max-width:min(46%,330px);background:var(--paper);color:var(--ink);border:2px solid #000;border-radius:6px;padding:7px 11px;font-size:14.5px;line-height:1.4;z-index:4}
.bubble::after{content:"";position:absolute;right:-11px;top:16px;border:6px solid transparent;border-left:9px solid #000;border-right:0}
.bubble b{font-family:var(--sign);margin-right:3px}
.tv{position:absolute;left:0;right:0;bottom:0;background:#0b0b0b;color:#ffe46b;display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:14px;overflow:hidden;z-index:4;border-top:2px solid var(--red)}
.tv b{background:var(--red);color:#fff;padding:2px 9px;font-family:var(--sign);flex:none;position:relative;z-index:1}
.tv span{display:inline-block;padding-left:100%;animation:tick 26s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}

/* 乞討對話 */
.dialog{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center;min-height:74px}
.por{width:64px;height:64px;border:2px solid #000;border-radius:4px;background:#e3b98f;overflow:hidden;position:relative}
.por img{position:absolute;left:50%;top:3%;height:210%;transform:translateX(-50%)}
.speech b{font-family:var(--sign)}
/* 對話框貼著場景下緣，和畫面是同一個單位 */
.talk{margin-top:-15px;position:relative;background:#1b1510;color:var(--cream);border:3px solid #000;border-radius:0 0 4px 4px;box-shadow:inset 0 0 0 2px #b88a32,0 3px 0 #0006}
.talk .note{color:#d9cba9}
.talk .por{border-color:#b88a32}
.talk .speech b{color:var(--gold)}
#stage:empty{display:none}
.tactics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.tactics .btn{padding:10px 4px;background:var(--paper2)}
@media (max-width:520px){.tactics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bar-hp{display:inline-block;width:100px;height:10px;background:#cdb98c;border:1px solid #000;overflow:hidden;vertical-align:middle}
.bar-hp i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--green) 0 6px,#075c3c 6px 8px)}
.flyer{background:#ffe45c;transform:rotate(-.7deg);border:1px solid #a58a16;box-shadow:2px 3px 0 #0007;border-radius:0}
.flyer h2{color:var(--red-d)}
.flyer .note{color:#544a14}

/* 實體彩券 */
.stage{display:grid;justify-items:center;gap:10px;background:radial-gradient(ellipse at 50% 30%,#4a3722,#231a12);border-color:#000}
.stage .note{color:#e6d6b6}
.ticket{--c1:#8e1a22;--c2:#d9423a;position:relative;width:min(440px,100%);border-radius:3px;padding:12px;color:#fff;background-image:var(--guil),radial-gradient(circle at 50% 42%,var(--c2),var(--c1));background-size:210px 210px,100% 100%;box-shadow:0 9px 18px #000a,0 0 0 2px #000;overflow:hidden}
.ticket::before{content:"";position:absolute;inset:5px;border:2px solid #e8c365;outline:1px solid #e8c36588;outline-offset:2px;pointer-events:none;z-index:1}
.ticket::after{content:attr(data-w);position:absolute;right:-6px;top:-22px;font:900 150px/1 var(--serif);color:#ffffff14;pointer-events:none}
.ticket header{position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 8px 0}
.ticket small{font:500 11px var(--sign);letter-spacing:2px;color:#ffe9a8}
.ticket h3{font:900 clamp(25px,7vw,31px)/1.15 var(--serif);letter-spacing:2px;filter:drop-shadow(0 2px 0 #0007)}
.ticket .pr{font:400 clamp(25px,7vw,31px)/1 var(--mono);filter:drop-shadow(0 2px 0 #0007)}
.t-c100{--c1:#8e1a22;--c2:#d9423a}.t-c200{--c1:#a33a08;--c2:#ef9a2a}.t-c300{--c1:#075040;--c2:#1fa37c}.t-c500{--c1:#6e4700;--c2:#d2a11b}.t-c1000{--c1:#0d1b4d;--c2:#3560c4}.t-c2000{--c1:#1f0c33;--c2:#6f2ba0}.t-c5000{--c1:#060504;--c2:#3a3220}
.scr{position:relative;z-index:2;background:linear-gradient(#fdf6e3,#efe2c2);color:var(--ink);border:1px solid #6b4a12;border-radius:2px;padding:8px;margin:7px 6px 0;user-select:none;-webkit-user-select:none}
.scr canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:2px;touch-action:none;cursor:crosshair}
.cells{display:grid;gap:6px}
.m3{grid-template-columns:repeat(3,minmax(0,1fr))}
.m3 div,.gr div{display:grid;place-items:center;height:70px;border-radius:50%/44%;background:radial-gradient(circle,#fff9e6 40%,#ecd9a8);box-shadow:inset 0 0 0 1px #c7a355,inset 0 0 0 4px #fff7e0,inset 0 0 0 5px #d8bd80;font:900 20px var(--serif);color:#6b1212}
/* 揭曉後才標示結果，刮的過程不提前洩漏 */
.scr.done .cells>div{transition:opacity .25s,filter .25s}
.scr.done .cells>div:not(.hit){opacity:.42;filter:grayscale(.7)}
.scr.done .cells>div.hit{background:var(--foil);color:#3a1600;box-shadow:0 0 0 2px #b87c00,0 0 12px #ffbf00;animation:hitpop .45s}
@keyframes hitpop{40%{transform:scale(1.1)}}
.scr.lose::after{content:"銘謝惠顧";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-9deg);padding:4px 14px;border:4px double var(--red);border-radius:6px;background:#fdf6e3d9;color:var(--red);font:900 clamp(26px,8vw,36px)/1.15 var(--serif);letter-spacing:4px;white-space:nowrap;pointer-events:none;z-index:1}
.lucky{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:7px;font:500 13px var(--sign)}
.lucky b{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff6a6a,var(--red) 60%,var(--red-d));color:#fff;font:400 23px var(--mono);box-shadow:0 2px 0 #0005}
.nb{grid-template-columns:repeat(4,minmax(0,1fr))}
.nb div{border:1px solid #c7a355;background:#fffaf0;border-radius:3px;text-align:center;padding:4px 1px}
.nb b{display:block;font:400 22px/1.1 var(--mono)}
.nb small{font:900 12.5px var(--sign);letter-spacing:0;color:#8a1a1a}
.gr{grid-template-columns:repeat(3,minmax(0,1fr))}
.gr div{font:900 32px var(--serif);height:62px;border-radius:4px;background:radial-gradient(circle,#fff6d8,#e9cf90)}
.lucky b.w{width:auto;height:34px;padding:0 12px;border-radius:4px;font:900 20px var(--serif)}
.sy{grid-template-columns:repeat(3,minmax(0,1fr))}
.sy div{display:grid;justify-items:center;gap:1px;border:1px solid #c7a355;background:#fffaf0;border-radius:3px;padding:7px 2px}
.sy b{font:900 19px/1.15 var(--serif);color:#6b1212}
.sy small,.bt small,.bj small{font:900 13.5px var(--sign);color:#8a1a1a}
.bt{grid-template-columns:repeat(2,minmax(0,1fr))}
.bt div{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;justify-items:center;border:1px solid #c7a355;background:linear-gradient(#fff6d8,#f1dba4);border-radius:3px;padding:6px 3px}
.bt span{display:grid;justify-items:center}
.bt em,.bgtop em{font:500 12px var(--sign);font-style:normal;color:#6f5a2a}
.bt span b{font:400 28px/1 var(--mono);color:#6b1212}
.bt>div>i{font:900 12px var(--sign);font-style:normal;color:#a06a10}
.bt small{grid-column:1/-1}
.bj{grid-template-columns:repeat(2,minmax(0,1fr))}
.bj div{display:grid;justify-items:center;gap:2px;border:1px solid #c7a355;background:#0f6b45;color:#fff;border-radius:3px;padding:6px 2px}
.bj p{display:flex;gap:3px}
.bj p i{display:grid;place-items:center;width:27px;height:37px;background:#fff;color:#a01020;border:1px solid #333;border-radius:3px;font:400 17px var(--mono);font-style:normal}
.bj span{font:700 13.5px var(--sign)}
.bj small{color:var(--gold)}
.scr.done .bj>div.hit small,.scr.done .bj>div.hit span{color:#3a1600}
.bgtop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:6px}
.called p{display:flex;flex-wrap:wrap;gap:3px}
.called b{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff6a6a,var(--red) 60%,var(--red-d));color:#fff;font:400 15px var(--mono)}
.bgamt{display:grid;justify-items:center;border:1px solid #b87c00;background:#fff3c4;border-radius:3px;padding:3px 10px}
.bgamt b{font:900 22px/1.1 var(--serif);color:#8a1a1a}
.b4{grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}
.b4 div{display:grid;place-items:center;height:36px;border:1px solid #c7a355;background:#fffaf0;border-radius:3px;font:400 20px var(--mono);color:#333}
.b4 div.d{background:#ffd9d9;color:#a01020;box-shadow:inset 0 0 0 2px #c8102e}
.legend{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:0 9px;font-size:12.5px;margin:6px 8px 0;color:#ffe9a8}
.ticket footer{position:relative;z-index:2;font-size:12px;margin:6px 8px 2px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;color:#ffe9a8}
.serial{font:400 11px/1.1 var(--mono);text-align:right;flex:none}
.bars{display:block;width:92px;height:17px;margin-left:auto;margin-bottom:2px;background:repeating-linear-gradient(90deg,#fff 0 1px,transparent 1px 3px,#fff 3px 6px,transparent 6px 7px,#fff 7px 8px,transparent 8px 12px);opacity:.92}
.result{font:900 22px var(--sign);min-height:32px;text-align:center;color:#f4ead0}
.result.win{color:var(--gold);text-shadow:0 0 12px #ff9d00}
.pl{display:flex;flex-wrap:wrap;justify-content:center;gap:0 14px;font:400 15px/1.5 var(--mono);color:#e6d6b6;text-shadow:none}
.pl b{font-weight:400;color:#ff9c8f}
.pl b.up{color:#7fe8b0}
#cardbtns{scroll-margin-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.shelfwrap{background:linear-gradient(#5a3d24,#40291a);color:var(--cream)}
.shelfwrap .note{color:#e6d6b6}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.item{display:grid;gap:6px;min-width:0;align-content:start;position:relative}
.cardshelf{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}

function setupScratch() {

  for (let i = -H; i < W; i += 7) { c.beginPath(); c.moveTo(i, 0); c.lineTo(i + H, H); c.stroke(); }
  for (let i = 0; i < W * H / 14; i++) { c.fillStyle = Math.random() < .5 ? '#ffffff30' : '#00000024'; c.fillRect(Math.random() * W, Math.random() * H, 1.4, 1.4); }

    bs = Array.from({ length: 30 }, (_, i) => ({ x: C + Math.random() * 120 - 60, y: C + Math.random() * 120 - 60, vx: Math.random() * 12 - 6, vy: Math.random() * 12 - 6, c: cols[i % 6] }));
    const frame = () => {
      if (!alive) return;
      g.clearRect(0, 0, 460, 460);
      g.fillStyle = '#0c1a45'; g.beginPath(); g.arc(C, C, R0, 0, 6.3); g.fill();
      for (const b of bs) {
        b.vy += .22; b.vx += (b.y - C) * -.006; b.vy += (b.x - C) * .006; { const sp = Math.hypot(b.vx, b.vy); if (sp > 17) { b.vx *= 17 / sp; b.vy *= 17 / sp; } } b.x += b.vx; b.y += b.vy;
        const dx = b.x - C, dy = b.y - C, dist = Math.hypot(dx, dy);
        if (dist > R0 - 19) { const nx = dx / dist, ny = dy / dist, dot = b.vx * nx + b.vy * ny; b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny; b.vx += Math.random() * 8 - 4; b.vy -= Math.random() * 10; b.x = C + nx * (R0 - 19); b.y = C + ny * (R0 - 19); }
        const gr = g.createRadialGradient(b.x - 6, b.y - 6, 2, b.x, b.y, 19); gr.addColorStop(0, '#fff'); gr.addColorStop(.35, b.c); gr.addColorStop(1, '#0007');
        g.fillStyle = gr; g.beginPath(); g.arc(b.x, b.y, 19, 0, 6.3); g.fill();
      }
      g.strokeStyle = '#ffd21f'; g.lineWidth = 7; g.beginPath(); g.arc(C, C, R0, 0, 6.3); g.stroke();
      g.strokeStyle = '#ffffff66'; g.lineWidth = 12; g.beginPath(); g.arc(C, C, R0 - 22, 3.7, 4.5); g.stroke();
      requestAnimationFrame(frame);
    };
    frame();
    const wait = ms => new Promise(r => { const t0 = Date.now(); const tick = () => (fast || Date.now() - t0 >= ms) ? r() : setTimeout(tick, 30); tick(); });
    (async () => {
      const slots = [...q('#rail').children];
      for (let i = 0; i < balls.length; i++) {
        const isLast = last && i === balls.length - 1;
        q('#stres').textContent = isLast ? '最後揭曉：特別號' : `第 ${i + 1} 顆`;
        await wait(isLast ? 900 : 240);
        bs.pop(); await fly(slots[i], balls[i], isLast);
        const sel = `[data-n="${balls[i]}"]`, got = !!d.querySelector(sel);
        slots[i].className = 'rb landed' + (isLast ? ' sp lastslot' : '') + (got ? ' got' : ''); slots[i].textContent = balls[i]; sfx.ball();
        d.querySelectorAll(sel).forEach(e => { e.classList.add('lit'); });
        if (got) tone(1040, 0, .18, .14);
      }
      q('#stres').innerHTML = result; q('#stskip').hidden = true; q('#stok').hidden = false;
      if (win) sfx.coin(); else sfx.lose();
    })();
  });
}

async function runDraw(key) {
  const d = ENGINE.drawSet();
  const mine = S.tickets.filter(t => ENGINE.GAMES[t.g].draw === key);
  S.tickets = S.tickets.filter(t => ENGINE.GAMES[t.g].draw !== key);
  let anyNear = false, jackpotHit = false, total = 0, net = 0, best = 0, lines = [], winN = 0, spent = 0;
  for (const t of mine) {
    const G = ENGINE.GAMES[t.g], r = ENGINE.payout(t, d, S.jackpots.lotto);
    spent += G.price;
    if (r.near) { S.near++; anyNear = true; }
    if (r.prize) {
      total += r.prize; net += award(r.prize, G.name); winN++; best = Math.max(best, r.prize);
      if (r.top) jackpotHit = true;
      if (lines.length < 8) lines.push(`<div class="tk"><span>${G.name}・${r.label}</span><span class="num">${fmt(r.prize)}</span></div>`);
    }
  }
  // 其他人中頭獎的機率依全台銷量估算
  const npcHit = Math.random() < .22;
  if (jackpotHit || npcHit) {
    if (npcHit && !jackpotHit) addNews(`大樂透頭獎 ${cn(S.jackpots.lotto)} 開在隔壁街彩券行，阿財氣到關電視。`);
    S.jackpots.lotto = ENGINE.BASE_JACKPOT.lotto;
  } else S.jackpots.lotto += R(20, 40) * 1e6;
  if (!mine.length) return;
  const pop = a => a.map(n => [Math.random(), n]).sort((x, y) => x[0] - y[0]).map(x => x[1]); // 只打亂出球順序，號碼本身不變
  const balls = [...pop(d.nums), d.sp];
  const result = (winN ? lines.join('') + `<p><b>中獎 ${winN} 注，實拿 ${fmt(net)}</b>（投入 ${fmt(spent)}）</p>` : `<p>${mine.length} 注全部槓龜（投入 ${fmt(spent)}）。</p>`) + (anyNear ? '<p>提醒：差一個號碼不代表下一次比較容易中。</p>' : '');
  await studio({ title: '今晚開獎：大樂透', balls, last: true, mine, result, win: winN > 0 });
  if (best) await celebrate(best);
  if (best >= 1000000) addNews(`頭條：彩券行常客中 ${cn(best)}，鄰居開始關心他最近好不好。`);
}

  perk(el) { const p = PERKS.find(x => x.id === el.dataset.p), l = perk(p.id), c = perkCost(l); if (M.pts < c || l >= p.max) return; M.pts -= c; M.perks[p.id] = l + 1; render(); save(); },
  async giveup() {
    const v = await modal({ title: '確定放棄這輩子？', html: '目前的錢和進度都會結算，只留下成就和人生教訓。', btns: [{ t: '確定', v: 1, cls: 'pri' }, { t: '再撐一下', v: 0 }] });
    if (v) endLife('E');
  },
  async wipe() {
    const v = await modal({ title: '清除全部存檔？', html: '成就、結局圖鑑、人生教訓都會消失，無法復原。', btns: [{ t: '全部清除', v: 1, cls: 'pri' }, { t: '取消', v: 0 }] });
    if (!v) return;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    M = { lives: 1, pts: 0, perks: {}, ach: {}, endings: {}, bankrupts: 0, best: 10000, mute: false, seenIntro: true };
    S = newLife(); cardState = { revealed: false, last: null }; render(); save();
  },
};
function renderShelfBtns() { /* 買完後更新架上按鈕可按狀態 */
  document.querySelectorAll('[data-act=buy]').forEach(b => { if (b.closest('#cardbtns')) return; const c = ENGINE.CARD[b.dataset.c]; b.disabled = S.money < c.price * +b.dataset.n; });
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (!$('#modal').hidden) return;
  act[el.dataset.act](el);
});
document.addEventListener('change', e => {
  const k = e.target.dataset.change; if (!k) return;
  if (k === 'qty') lo.qty = +e.target.value;
  if (k === 'bmult') bg.mult = +e.target.value;
  if (k === 'bper') bg.periods = +e.target.value;
  renderView();
});

/* ---------- 開機 ---------- */
function guilloche() { // 防偽細線：程式產生的玫瑰線
  let d = '';
  for (let k = 0; k < 3; k++) {
    const R0 = 52 + k * 15, n = 7 + k * 2;
    for (let t = 0; t <= 6.29; t += .012) { const r = R0 * (1 + .2 * Math.sin(n * t)); d += `${t ? 'L' : 'M'}${(105 + r * Math.cos(t)).toFixed(1)} ${(105 + r * Math.sin(t)).toFixed(1)}`; }
  }
  return `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='210' height='210'><path d='${d}Z' fill='none' stroke='#ffe9a8' stroke-opacity='.32' stroke-width='.7'/></svg>`)}")`;
}
{ const st = document.documentElement.style; st.setProperty('--bgStreet', `url(${ART.bgStreet})`); st.setProperty('--bgShop', `url(${ART.bgShop})`); st.setProperty('--guil', guilloche()); }
if (!load()) S = newLife();
render();
if (!M.seenIntro) {
  M.seenIntro = true;
  modal({ title: '刮到一億', html: '<p>你手上有 $10,000，目標是買一棟約 1 億的房子。</p><p>有錢就進店玩刮刮樂、大樂透、BINGO BINGO。沒錢就坐回門口討飯，或到「打工」接點零工。</p><p>機率全部公開，沒有偷偷讓你中。阿財說：「多買多中。」本遊戲統計部說：「多買多虧。」</p><p class="note">純屬虛構的虛擬金錢遊戲，與台灣彩券公司無關。</p>', btns: [{ t: '坐到門口', v: 0, cls: 'pri' }], center: true }).then(save);
}
window.GAME = { get S() { return S; }, get M() { return M; }, render, after, act };
</script>
