<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a100b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="乾杯遊戲機">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>乾杯遊戲機</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Huninn&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
/* Layout: one-column pub table; games are beer coasters on a dark wood bar, each game opens full-screen under a sticky tap-handle header. */
:root {
  --bg: #1a100b;
  --surface: #2a1a11;
  --surface-2: #362216;
  --line: #4d3324;
  --amber: #f2a33a;
  --amber-deep: #b86a17;
  --foam: #fbf0dc;
  --muted: #c2a68a;
  --cherry: #e5484d;
  --mint: #5cc8a0;
  --ink: #23140b;
  --paper: #fffdf7;
  --display: "Huninn", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --num: "Bungee", "Huninn", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  background-image: radial-gradient(120% 60% at 50% -10%, rgba(242,163,58,.18), transparent 60%);
  background-attachment: fixed;
  color: var(--foam);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible, select:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.bar h1 { flex: 1; min-width: 0; margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.35rem; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: .95rem; white-space: nowrap; }
.icon-btn b { color: var(--amber); font-family: var(--num); font-weight: 400; margin-left: 4px; }

main {
  max-width: 560px; margin: 0 auto;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stack { display: flex; flex-direction: column; gap: 16px; align-items: stretch; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 auto; }

/* Home */
.hero h2 { font-family: var(--display); font-weight: 400; font-size: clamp(2.2rem, 10vw, 3.2rem); line-height: 1.1; margin: 4px 0 6px; text-wrap: balance; color: var(--amber); }
.hero p { margin: 0; color: var(--muted); }
.library-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 10px; color: var(--muted); font-size: .9rem; }
.library-head strong { color: var(--foam); font-weight: 700; letter-spacing: .04em; }
.shelf { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 14px; }
.cap-item { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cap {
  position: relative; display: block; width: 100%; aspect-ratio: 2 / 3; max-width: 100%;
  border: 0; padding: 0; border-radius: 6px; overflow: hidden; background: var(--surface);
  box-shadow: 0 8px 20px rgba(0,0,0,.45);
  transition: transform .18s ease, box-shadow .18s ease;
}
.cap:hover, .cap:focus-visible { transform: translateY(-4px) scale(1.02); box-shadow: 0 0 0 2px var(--c, var(--amber)), 0 14px 28px rgba(0,0,0,.55); }
.cap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cap-logo {
  position: absolute; top: 9%; left: 6px; right: 6px; text-align: center;
  font-family: var(--display); font-size: clamp(1.45rem, 7vw, 2rem); line-height: 1.05; color: #fff;
  text-shadow: 0 0 2px var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink), 0 4px 0 var(--ink), 0 6px 12px rgba(0,0,0,.5);
  text-wrap: balance;
}
.cap-logo em { display: block; font-style: normal; font-family: var(--num); font-size: .4em; letter-spacing: .1em; color: var(--c, var(--amber)); margin-top: 4px; }
.cap-chip {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  background: rgba(28,32,40,.88); color: #dfe3e8; font-size: .78rem; padding: 2px 10px; border-radius: 4px; white-space: nowrap;
}
.cap-ribbon {
  position: absolute; top: 14px; right: -34px; transform: rotate(45deg);
  background: var(--mint); color: var(--ink); font-size: .72rem; font-weight: 900; padding: 2px 36px; letter-spacing: .1em;
}
.cap-item small { color: var(--muted); font-size: .85rem; line-height: 1.4; }
.cap.soon { border: 2px dashed var(--line); background: transparent; box-shadow: none; cursor: default; display: grid; place-items: center; }
.cap.soon:hover { transform: none; }
.cap.soon span { font-family: var(--display); color: var(--line); font-size: 3rem; line-height: 1; text-align: center; }
.cap.soon span b { display: block; font-weight: 400; font-size: 1rem; color: var(--muted); margin-top: 8px; }

/* Common game UI */
.turn { text-align: center; color: var(--muted); font-size: 1.05rem; }
.turn b { color: var(--foam); font-family: var(--display); font-weight: 400; font-size: 1.6rem; margin: 0 4px; }
.btn {
  border: 0; border-radius: 14px; padding: 12px 18px; font-weight: 700;
  background: var(--amber); color: var(--ink); font-size: 1.05rem;
  box-shadow: 0 4px 0 var(--amber-deep);
  transition: transform .08s ease, box-shadow .08s ease;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--amber-deep); }
.btn.big { font-family: var(--display); font-weight: 400; font-size: 1.6rem; padding: 14px; }
.btn.ghost { background: var(--surface); color: var(--foam); box-shadow: 0 4px 0 var(--line); border: 1px solid var(--line); }
.btn.red { background: var(--cherry); color: var(--foam); box-shadow: 0 4px 0 #8e2226; }
.btn.mint { background: var(--mint); color: var(--ink); box-shadow: 0 4px 0 #2d7a5e; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.result {
  background: var(--foam); color: var(--ink); border-radius: 18px; padding: 18px 20px;
  text-align: center; font-family: var(--display); font-size: 1.5rem; line-height: 1.35; text-wrap: balance;
  animation: pop .35s cubic-bezier(.2,1.6,.4,1);
}
.result small { display: block; font-family: var(--body); font-size: .9rem; color: #7a5a40; margin-top: 6px; }
@keyframes pop { from { transform: scale(.85); opacity: .3; } to { transform: scale(1); opacity: 1; } }
.hint { color: var(--muted); font-size: .88rem; margin: 0; }
.seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 8px 6px; color: var(--muted); font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--amber); color: var(--ink); }
details.editor { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 4px 14px; }
details.editor[open] { padding-bottom: 14px; }
details.editor summary { cursor: pointer; padding: 10px 0; color: var(--muted); font-weight: 700; }
details.editor .stack { gap: 10px; }
textarea, input[type="text"], select {
  width: 100%; background: var(--bg); color: var(--foam); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; font: inherit; font-size: 16px;
}
textarea { resize: vertical; line-height: 1.5; }

/* Wheel */
.wheel-wrap { position: relative; width: min(100%, 340px); aspect-ratio: 1; max-width: 100%; margin: 0 auto; }
.wheel-wrap canvas { width: 100%; height: 100%; display: block; border-radius: 50%; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.pointer { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 30px solid var(--foam); z-index: 2; filter: drop-shadow(0 3px 3px rgba(0,0,0,.5)); }

/* Number bomb */
.range { display: flex; align-items: center; justify-content: center; gap: 14px; font-family: var(--num); font-size: clamp(2.6rem, 14vw, 4rem); line-height: 1; color: var(--amber); font-variant-numeric: tabular-nums; }
.range i { font-style: normal; color: var(--muted); font-family: var(--display); font-size: .6em; }
.entry { text-align: center; font-family: var(--num); font-size: 2.4rem; min-height: 1.4em; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 6px; letter-spacing: .1em; }
.pad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.pad button { font-family: var(--num); font-size: 1.6rem; padding: 12px 0; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); box-shadow: 0 4px 0 var(--line); }
.pad button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.pad .go { background: var(--cherry); border-color: var(--cherry); box-shadow: 0 4px 0 #8e2226; font-family: var(--display); }
.pad .clr { font-family: var(--display); font-size: 1.2rem; color: var(--muted); }
.msg { text-align: center; color: var(--muted); min-height: 1.6em; }
.boom { text-align: center; padding: 10px 0; }
.boom .kaboom { font-family: var(--display); font-size: clamp(5rem, 30vw, 8rem); line-height: 1; color: var(--cherry); display: inline-block; animation: shake .5s ease 2; }
@keyframes shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-8deg) scale(1.1); } 75% { transform: rotate(8deg) scale(1.1); } }

/* Truth or dare */
.td-card { background: var(--foam); color: var(--ink); border-radius: 20px; padding: 22px 20px; min-height: 180px; display: flex; flex-direction: column; justify-content: center; gap: 10px; text-align: center; }
.td-card .tag { align-self: center; font-size: .8rem; font-weight: 900; letter-spacing: .15em; padding: 3px 12px; border-radius: 999px; background: var(--ink); color: var(--foam); }
.td-card .tag.dare { background: var(--cherry); }
.td-card p { margin: 0; font-family: var(--display); font-size: 1.45rem; line-height: 1.4; text-wrap: balance; }
.td-card.empty p { color: #8b6c52; font-size: 1.1rem; }

/* Undercover */
.reveal { background: var(--surface); border: 2px dashed var(--line); border-radius: 20px; padding: 28px 18px; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.reveal .word { font-family: var(--display); font-size: clamp(2.6rem, 14vw, 3.6rem); color: var(--amber); line-height: 1.1; }
.reveal .who { font-family: var(--display); font-size: 1.8rem; }
.plist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.plist button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 12px 8px; font-family: var(--display); font-size: 1.2rem; overflow-wrap: anywhere; }
.plist button.out { opacity: .4; text-decoration: line-through; cursor: default; }
.plist button.armed { background: var(--cherry); border-color: var(--cherry); }
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
.stepper .ctl { display: flex; align-items: center; gap: 12px; }
.stepper .ctl button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); font-size: 1.3rem; }
.stepper .ctl b { font-family: var(--num); font-weight: 400; font-size: 1.4rem; min-width: 1.5em; text-align: center; color: var(--amber); }

/* Player sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(10,6,3,.7); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; background: var(--surface); border-radius: 22px 22px 0 0; border-top: 1px solid var(--line);
  padding-block: 20px calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-height: 85vh; overflow-y: auto;
}
.sheet h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.5rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 14px; }
.chip button { border: 0; background: var(--surface-2); border-radius: 50%; width: 26px; height: 26px; line-height: 1; color: var(--muted); }
.add-row { display: flex; gap: 8px; }
.add-row input { flex: 1; min-width: 0; }
.add-row .btn { flex: none; }

/* Most likely */
.chip.cat { padding: 6px 14px; color: var(--muted); font-weight: 700; }
.chip.cat[aria-pressed="true"] { background: var(--amber); color: var(--ink); border-color: var(--amber); }
.td-card p.count { font-family: var(--num); font-size: 4.2rem; line-height: 1; color: var(--cherry); }

/* Draw & guess */
.draw-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.timer { font-family: var(--num); font-size: 2.4rem; line-height: 1; color: var(--amber); font-variant-numeric: tabular-nums; min-width: 2.5ch; }
.timer.hurry { color: var(--cherry); animation: shake .5s ease infinite; }
.draw-canvas { width: 100%; aspect-ratio: 1; max-width: 100%; display: block; background: var(--paper); border-radius: 12px; touch-action: none; cursor: crosshair; }
.draw-shot { width: 100%; max-width: 100%; border-radius: 12px; display: block; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); padding: 0; }
.sw[aria-pressed="true"] { outline: 3px solid var(--amber); outline-offset: 2px; }
.tool { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: .9rem; }
.tool[aria-pressed="true"] { background: var(--amber); color: var(--ink); }

/* Liar's dice */
.cup-box {
  position: relative; display: grid; place-items: center; min-height: 200px; padding: 22px 14px;
  background: radial-gradient(circle at 50% 40%, #1f7a52, #0c3f29);
  border: 6px solid #5a3420; border-radius: 22px; box-shadow: inset 0 0 30px rgba(0,0,0,.5);
  touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer;
}
.cup-box.shaking { animation: shake .15s linear 4; }
.dice { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.die {
  width: clamp(44px, 14vw, 56px); aspect-ratio: 1; padding: 16%; border-radius: 22%;
  background: #fbf7ee; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr);
  box-shadow: inset -3px -4px 0 rgba(0,0,0,.12), 0 4px 8px rgba(0,0,0,.35);
}
.die i { width: 70%; aspect-ratio: 1; border-radius: 50%; background: #1b1b1b; place-self: center; visibility: hidden; }
.die i.on { visibility: visible; }
.die.red i { background: #d62c2c; }
.die.one i.on { width: 130%; }
.cup-cover { display: flex; flex-direction: column; align-items: center; gap: 8px; color: #d9f2e6; font-weight: 700; text-align: center; }
.cup-cover svg { width: 84px; height: 84px; }
.tally { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; text-align: center; }
.tally div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 2px; font-size: .8rem; color: var(--muted); }
.tally b { display: block; font-family: var(--num); font-weight: 400; font-size: 1.4rem; color: var(--foam); }
.rules { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; line-height: 1.55; }

/* Welcome */
.need { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
.need strong { font-size: .95rem; }
.need ul { list-style: none; margin: 6px 0 0; padding: 0; }
.need li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
.need li:last-child { border-bottom: 0; }
.need li b { font-weight: 700; white-space: nowrap; }
.need li.ok { color: var(--foam); }
.need li.ok b { color: var(--mint); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <button class="icon-btn" id="back" hidden aria-label="回到遊戲選單">← 選單</button>
    <h1 id="title">乾杯遊戲機</h1>
    <button class="icon-btn" id="players-btn">玩家<b id="pcount">0</b></button>
  </div>
</header>
<main id="view"></main>

<div class="sheet-bg" id="sheet" hidden>
  <div class="sheet stack" role="dialog" aria-labelledby="sheet-title">
    <h3 id="sheet-title">今晚的玩家</h3>
    <p class="hint">依座位順序輸入（順時針），「左邊、右邊」的懲罰會照這個順序算。</p>
    <div class="chips" id="chips"></div>
    <form class="add-row" id="add-form">
      <input type="text" id="p-input" placeholder="輸入名字" maxlength="10" autocomplete="off">
      <button class="btn" type="submit">加入</button>
    </form>
    <button class="btn ghost" id="sheet-close">好了，開喝</button>
  </div>
</div>

<script>
/* ---------- 共用工具 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem('kanpai:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('kanpai:' + k, JSON.stringify(v)); } catch (e) {} }
};
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// 玩家名單：每次打開都會先到歡迎頁確認
let players = store.get('players-v4', []);
let turn = 0;
const current = () => players[turn % players.length];
const nextTurn = () => { turn = (turn + 1) % players.length; };

// 把 {人} {左} {右} {某人} 換成真名
function fill(text, who) {
  const n = players.length, i = Math.max(0, players.indexOf(who));
  const others = players.filter(p => p !== who);
  return text
    .replaceAll('{人}', who)
    .replaceAll('{左}', players[(i - 1 + n) % n])
    .replaceAll('{右}', players[(i + 1) % n])
    .replaceAll('{某人}', others.length ? pick(others) : who);
}

let audio;
function beep(freq = 600, dur = 0.06, type = 'square', vol = 0.06) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
    o.connect(g).connect(audio.destination);
    o.start(); o.stop(audio.currentTime + dur);
  } catch (e) {}
}
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
let wakeLock;
async function keepAwake() { try { if (!wakeLock && navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }

/* ---------- 遊戲註冊表：要加新遊戲，照下面格式 registerGame({...}) 即可 ----------
   id: 唯一代號   name: 名稱   en: 封面英文副標   color: 副標與外框顏色   tag: 封面底部標籤
   desc: 一句話說明   minPlayers: 最少人數   art(ctx, w, h): 畫封面圖   mount(root): 把遊戲畫進 root，可回傳清理函式 */
const GAMES = [];
const registerGame = g => GAMES.push(g);

/* ---------- 封面插圖（canvas 繪製） ---------- */
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function seeded(s) { return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function rays(ctx, cx, cy, len, n, color) {
  ctx.save(); ctx.translate(cx, cy); ctx.fillStyle = color;
  const a = Math.PI * 2 / n;
  for (let i = 0; i < n; i += 2) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, len, i * a, (i + 1) * a); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function bubbles(ctx, w, h, seed, n, color) {
  const r = seeded(seed); ctx.fillStyle = color;
  for (let i = 0; i < n; i++) { ctx.beginPath(); ctx.arc(r() * w, r() * h, w * (0.008 + r() * 0.025), 0, Math.PI * 2); ctx.fill(); }
}

registerGame({
  id: 'wheel', name: '懲罰轉盤', en: 'PUNISH WHEEL', color: '#ffd36b', tag: '派對 · 運氣', desc: '轉到什麼就做什麼', minPlayers: 2,
  art(ctx, w, h) {
    const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#ffcf6b'); g.addColorStop(1, '#b8360b');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    const cx = w / 2, cy = h * 0.66, r = w * 0.47;
    rays(ctx, cx, cy, h, 28, 'rgba(255,255,255,.13)');
    bubbles(ctx, w, h * 0.45, 7, 14, 'rgba(255,250,235,.35)');
    const cols = ['#f2a33a', '#e5484d', '#5cc8a0', '#3a2416'], n = 10, seg = Math.PI * 2 / n, off = -Math.PI / 2 - seg / 2;
    ctx.beginPath(); ctx.arc(cx, cy + w * 0.03, r + w * 0.03, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fill();
    for (let i = 0; i < n; i++) { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, off + i * seg, off + (i + 1) * seg); ctx.closePath(); ctx.fillStyle = cols[i % 4]; ctx.fill(); }
    ctx.lineWidth = w * 0.035; ctx.strokeStyle = '#fbf0dc'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    for (let i = 0; i < 20; i++) { const a = i * Math.PI / 10; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, w * 0.012, 0, Math.PI * 2); ctx.fillStyle = i % 2 ? '#fff6c2' : '#ffb347'; ctx.fill(); }
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.18, 0, Math.PI * 2); ctx.fillStyle = '#fbf0dc'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.09, 0, Math.PI * 2); ctx.fillStyle = '#b86a17'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx - w * 0.07, cy - r - w * 0.06); ctx.lineTo(cx + w * 0.07, cy - r - w * 0.06); ctx.lineTo(cx, cy - r + w * 0.07); ctx.closePath();
    ctx.fillStyle = '#fbf0dc'; ctx.fill(); ctx.lineWidth = w * 0.012; ctx.strokeStyle = '#23140b'; ctx.stroke();
  },
  mount(root) {
    // 題庫可以很大，轉盤每次只從裡面隨機抽 SHOW 格放上去
    const SHOW = 12;
    let pool = store.get('wheel-v2', WHEEL_DEFAULT), spun = false;
    let items = shuffle(pool).slice(0, SHOW);
    root.innerHTML = `
      <div class="stack">
        <div class="turn">輪到 <b id="w-who"></b> 轉</div>
        <div class="wheel-wrap"><div class="pointer"></div><canvas id="w-canvas"></canvas></div>
        <button class="btn big" id="w-spin">轉！</button>
        <p class="hint" style="text-align:center" id="w-count"></p>
        <div id="w-result"></div>
        <details class="editor"><summary>編輯轉盤題庫</summary>
          <div class="stack">
            <p class="hint">一行一題，題數不限。每次轉都會從題庫隨機抽 ${SHOW} 題放上轉盤。可用 {人} 目前玩家、{左} {右} 左右鄰座、{某人} 隨機一人。</p>
            <textarea id="w-text" rows="14"></textarea>
            <div class="row"><button class="btn ghost" id="w-reset">恢復預設</button><button class="btn" id="w-save">儲存</button></div>
          </div>
        </details>
      </div>`;
    const cv = $('#w-canvas', root), ctx = cv.getContext('2d');
    const css = getComputedStyle(document.documentElement);
    const colors = ['--amber', '--cherry', '--mint', '--surface-2'].map(v => css.getPropertyValue(v).trim());
    const textOn = [css.getPropertyValue('--ink').trim(), css.getPropertyValue('--foam').trim(), css.getPropertyValue('--ink').trim(), css.getPropertyValue('--foam').trim()];
    let rot = 0, spinning = false, raf;
    const label = t => { const s = t.replaceAll('{人}', '').replaceAll('{左}', '左邊').replaceAll('{右}', '右邊').replaceAll('{某人}', '某人').trim(); return s.length > 7 ? s.slice(0, 7) + '…' : s; };
    const colorIdx = i => (items.length % 4 === 1 && i === items.length - 1) ? 1 : i % 4;

    function size() {
      const px = cv.getBoundingClientRect().width || 320, dpr = window.devicePixelRatio || 1;
      cv.width = cv.height = Math.round(px * dpr);
      draw();
    }
    function draw() {
      const w = cv.width, r = w / 2, n = items.length, seg = Math.PI * 2 / n;
      ctx.clearRect(0, 0, w, w);
      ctx.save(); ctx.translate(r, r);
      for (let i = 0; i < n; i++) {
        const a = rot + i * seg, c = colorIdx(i);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, a, a + seg); ctx.closePath();
        ctx.fillStyle = colors[c]; ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = w * 0.004; ctx.stroke();
        ctx.save(); ctx.rotate(a + seg / 2);
        ctx.fillStyle = textOn[c]; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.font = `${Math.round(w * (n > 12 ? 0.04 : 0.05))}px Huninn, "Noto Sans TC", sans-serif`;
        ctx.fillText(label(items[i]), r - w * 0.05, 0);
        ctx.restore();
      }
      ctx.beginPath(); ctx.arc(0, 0, r * 0.13, 0, Math.PI * 2);
      ctx.fillStyle = css.getPropertyValue('--foam').trim(); ctx.fill();
      ctx.beginPath(); ctx.arc(0, 0, r * 0.07, 0, Math.PI * 2);
      ctx.fillStyle = css.getPropertyValue('--amber-deep').trim(); ctx.fill();
      ctx.restore();
    }
    const who = () => { $('#w-who', root).textContent = current(); };
    const under = () => { const seg = Math.PI * 2 / items.length; let a = (-Math.PI / 2 - rot) % (Math.PI * 2); if (a < 0) a += Math.PI * 2; return Math.floor(a / seg); };

    function spin() {
      if (spinning) return;
      spinning = true; keepAwake();
      if (spun) items = shuffle(pool).slice(0, SHOW);
      spun = true;
      $('#w-spin', root).disabled = true; $('#w-result', root).innerHTML = '';
      const n = items.length, seg = Math.PI * 2 / n, win = Math.floor(Math.random() * n);
      const target = -Math.PI / 2 - (win + 0.5) * seg + (Math.random() - 0.5) * seg * 0.6;
      let delta = (target - rot) % (Math.PI * 2); if (delta < 0) delta += Math.PI * 2;
      const start = rot, end = rot + delta + Math.PI * 2 * (5 + Math.floor(Math.random() * 3));
      const t0 = performance.now(), dur = 4200; let last = under();
      const step = now => {
        const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 3);
        rot = start + (end - start) * e; draw();
        const u = under(); if (u !== last) { last = u; beep(900, 0.03, 'triangle', 0.05); }
        if (t < 1) { raf = requestAnimationFrame(step); return; }
        rot %= Math.PI * 2; spinning = false; $('#w-spin', root).disabled = false;
        const by = current();
        nextTurn();
        $('#w-result', root).innerHTML = `<div class="result">${esc(fill(items[win], by))}<small>下一位：${esc(current())}</small></div>`;
        beep(520, 0.15, 'sawtooth', 0.08); setTimeout(() => beep(780, 0.25, 'sawtooth', 0.08), 140); buzz([80, 60, 120]);
        who();
      };
      raf = requestAnimationFrame(step);
    }

    $('#w-spin', root).onclick = spin;
    cv.onclick = spin;
    $('#w-text', root).value = pool.join('\n');
    count();
    $('#w-save', root).onclick = () => {
      const next = $('#w-text', root).value.split('\n').map(s => s.trim()).filter(Boolean);
      if (next.length < 2) { $('#w-result', root).innerHTML = '<p class="hint">題庫至少要 2 題，請再多寫幾行。</p>'; return; }
      pool = next; store.set('wheel-v2', pool); items = shuffle(pool).slice(0, SHOW); spun = false; rot = 0; draw(); count();
      $('#w-text', root).value = pool.join('\n');
      $('#w-result', root).innerHTML = `<p class="hint">已儲存 ${pool.length} 題，轉盤更新了。</p>`;
    };
    function count() { $('#w-count', root).textContent = `題庫共 ${pool.length} 題，每轉一次換一批`; }
    $('#w-reset', root).onclick = () => { $('#w-text', root).value = WHEEL_DEFAULT.join('\n'); };
    who(); size();
    window.addEventListener('resize', size);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', size); };
  }
});

registerGame({
  id: 'bomb', name: '終極密碼', en: 'NUMBER BOMB', color: '#ff9a9a', tag: '刺激 · 心理戰', desc: '範圍越縮越小，猜中的人喝', minPlayers: 2,
  art(ctx, w, h) {
    const g = ctx.createRadialGradient(w / 2, h * 0.6, w * 0.1, w / 2, h * 0.6, h * 0.75); g.addColorStop(0, '#ff6b5b'); g.addColorStop(1, '#3b0a0a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    const rnd = seeded(42); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 0; i < 22; i++) {
      ctx.save(); ctx.translate(rnd() * w, rnd() * h); ctx.rotate((rnd() - 0.5) * 0.8);
      ctx.font = `${Math.round(w * (0.08 + rnd() * 0.1))}px Bungee, sans-serif`; ctx.fillStyle = `rgba(255,230,210,${0.08 + rnd() * 0.14})`;
      ctx.fillText(String(1 + Math.floor(rnd() * 99)), 0, 0); ctx.restore();
    }
    const cx = w / 2, cy = h * 0.64, r = w * 0.3;
    ctx.save(); ctx.translate(cx + r * 0.55, cy - r * 0.8); ctx.rotate(0.6); ctx.fillStyle = '#2a2a2a'; ctx.fillRect(-r * 0.2, -r * 0.18, r * 0.4, r * 0.3); ctx.restore();
    ctx.beginPath(); ctx.moveTo(cx + r * 0.68, cy - r * 0.95); ctx.quadraticCurveTo(cx + r * 1.05, cy - r * 1.6, cx + r * 0.55, cy - r * 1.75);
    ctx.lineWidth = w * 0.02; ctx.strokeStyle = '#d9b380'; ctx.stroke();
    const sx = cx + r * 0.55, sy = cy - r * 1.75;
    ctx.save(); ctx.translate(sx, sy); ctx.fillStyle = '#ffe066';
    for (let i = 0; i < 10; i++) { ctx.rotate(Math.PI / 5); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(w * 0.015, -w * (i % 2 ? 0.05 : 0.09)); ctx.lineTo(-w * 0.015, -w * (i % 2 ? 0.05 : 0.09)); ctx.fill(); }
    ctx.beginPath(); ctx.arc(0, 0, w * 0.025, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore();
    const bg = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r); bg.addColorStop(0, '#5a5a5a'); bg.addColorStop(1, '#0d0d0d');
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fillStyle = bg; ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx - r * 0.4, cy - r * 0.45, r * 0.2, r * 0.11, -0.7, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fill();
    ctx.font = `${Math.round(r * 0.9)}px Bungee, sans-serif`; ctx.fillStyle = '#ff5a4e'; ctx.fillText('?', cx, cy + r * 0.08);
  },
  mount(root) {
    // lo、hi 是邊界（猜過的數字），密碼一定在兩者之間、不含邊界
    let max = store.get('bombMax', 100), lo, hi, secret, buf = '', history = [];
    root.innerHTML = `<div class="stack" id="b-box"></div>`;
    const box = $('#b-box', root);

    function start() { lo = 1; hi = max; secret = 2 + Math.floor(Math.random() * (max - 2)); buf = ''; history = []; render(); }
    function render(msg = '') {
      box.innerHTML = `
        <div class="seg" role="group" aria-label="範圍">
          <button data-max="100" aria-pressed="${max === 100}">1 – 100</button>
          <button data-max="1000" aria-pressed="${max === 1000}">1 – 1000</button>
        </div>
        <div class="turn">輪到 <b>${esc(current())}</b> 猜</div>
        <div class="range"><span>${lo}</span><i>～</i><span>${hi}</span></div>
        <p class="hint" style="text-align:center;margin-top:-8px">${hi - lo - 1 === 1 ? `只剩 ${lo + 1} 了，${esc(current())} 必中！` : `密碼在兩數之間（不含 ${lo} 和 ${hi}）・還剩 <b style="color:var(--amber)">${hi - lo - 1}</b> 個可能`}</p>
        <div class="entry" aria-live="polite">${buf || '&nbsp;'}</div>
        <div class="pad">
          ${[1,2,3,4,5,6,7,8,9].map(d => `<button data-d="${d}">${d}</button>`).join('')}
          <button class="clr" data-d="c">清除</button><button data-d="0">0</button><button class="go" data-d="go">猜！</button>
        </div>
        <div class="msg">${esc(msg)}</div>
        ${history.length ? `<div class="chips" style="justify-content:center">${history.map(h => `<span class="chip" style="padding:4px 12px">${esc(h.who)} <b style="font-family:var(--num);font-weight:400;color:${h.up ? 'var(--mint)' : 'var(--cherry)'}">${h.g}${h.up ? '↑' : '↓'}</b></span>`).join('')}</div>` : ''}`;
      box.querySelectorAll('[data-max]').forEach(b => b.onclick = () => { max = +b.dataset.max; store.set('bombMax', max); start(); });
      box.querySelectorAll('[data-d]').forEach(b => b.onclick = () => press(b.dataset.d));
    }
    function press(d) {
      keepAwake();
      if (d === 'c') { buf = ''; beep(300, 0.04); return render(); }
      if (d === 'go') return guess();
      if (buf.length >= String(max).length) return;
      buf = (buf + d).replace(/^0+/, ''); beep(700, 0.03, 'triangle'); render();
    }
    function guess() {
      const g = parseInt(buf, 10); buf = '';
      if (!(g > lo && g < hi)) { beep(200, 0.15); return render(`請輸入 ${lo + 1} 到 ${hi - 1} 之間的數字`); }
      if (g === secret) return boom();
      const who = current();
      if (g < secret) lo = g; else hi = g;
      history.push({ who, g, up: g < secret });
      nextTurn(); buzz(40); beep(500, 0.08, 'triangle');
      render(`${who} 猜 ${g}，${g < secret ? '太小了' : '太大了'}，安全！`);
    }
    function boom() {
      const loser = current(); nextTurn();
      buzz([200, 80, 200, 80, 400]);
      [180, 140, 100].forEach((f, i) => setTimeout(() => beep(f, 0.3, 'sawtooth', 0.12), i * 120));
      box.innerHTML = `
        <div class="boom"><span class="kaboom">炸！</span></div>

  art(ctx, w, h) {

  },
  mount(root) {
    let spies = players.length >= 7 ? 2 : 1, roles = [], alive = [], words, dealIdx, armed = null;
    root.innerHTML = `<div class="stack" id="s-box"></div>`;
    const box = $('#s-box', root);

    function setup() {
      const maxSpies = Math.max(1, Math.floor((players.length - 1) / 2));
      spies = Math.min(spies, maxSpies);
      box.innerHTML = `
        <p class="hint">平民拿到同一個詞，臥底拿到很像但不同的詞，而且沒人知道自己是哪一邊。輪流用一句話描述自己的詞，然後投票淘汰最可疑的人。</p>
        <div class="stepper"><span>臥底人數</span><div class="ctl"><button id="s-minus" aria-label="減少">−</button><b>${spies}</b><button id="s-plus" aria-label="增加">+</button></div></div>
        <div class="result" style="font-size:1.1rem">被投出的平民喝一杯<small>臥底全被抓 → 臥底喝兩杯；臥底撐到最後 → 所有平民各喝一杯</small></div>
        <button class="btn big" id="s-start">發詞（${players.length} 人）</button>`;
      $('#s-minus', box).onclick = () => { spies = Math.max(1, spies - 1); setup(); };
      $('#s-plus', box).onclick = () => { spies = Math.min(maxSpies, spies + 1); setup(); };
      $('#s-start', box).onclick = startRound;
    }
    function startRound() {
      const pair = shuffle(pick(WORD_PAIRS));
      words = { civ: pair[0], spy: pair[1] };
      const spySet = new Set(shuffle(players.map((_, i) => i)).slice(0, spies));
      roles = players.map((name, i) => ({ name, spy: spySet.has(i), out: false }));
      dealIdx = 0; keepAwake(); dealCover();
    }
    function dealCover() {
      const p = roles[dealIdx];
      box.innerHTML = `
        <div class="reveal">
          <span class="hint">把手機交給</span>
          <span class="who">${esc(p.name)}</span>
          <span class="hint">其他人不要偷看</span>
          <button class="btn big" id="s-see">看我的詞</button>
        </div>
        <p class="hint" style="text-align:center">${dealIdx + 1} / ${roles.length}</p>`;
      $('#s-see', box).onclick = dealShow;
    }
    function dealShow() {
      const p = roles[dealIdx];
      box.innerHTML = `
        <div class="reveal">
          <span class="hint">${esc(p.name)} 的詞是</span>
          <span class="word">${esc(p.spy ? words.spy : words.civ)}</span>
          <button class="btn" id="s-ok">${dealIdx < roles.length - 1 ? '記住了，蓋起來交給下一位' : '記住了，開始描述'}</button>
        </div>`;
      buzz(30);
      $('#s-ok', box).onclick = () => { dealIdx++; dealIdx < roles.length ? dealCover() : play(); };
    }
    function play(msg = '') {
      const live = roles.filter(r => !r.out);
      const first = pick(live).name;
      box.innerHTML = `
        ${msg ? `<div class="result">${msg}</div>` : ''}
        <div class="turn">從 <b>${esc(first)}</b> 開始，順時針每人說一句</div>
        <p class="hint" style="text-align:center">說完後討論、投票，點被投出的人（再點一次確認）</p>
        <div class="plist">${roles.map((r, i) => `<button data-i="${i}" class="${r.out ? 'out' : ''}" ${r.out ? 'disabled' : ''}>${esc(r.name)}</button>`).join('')}</div>
        <button class="btn ghost" id="s-quit">直接公布答案</button>`;
      armed = null;
      box.querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
        const i = +b.dataset.i;
        if (armed !== i) {
          box.querySelectorAll('.armed').forEach(x => { x.classList.remove('armed'); x.textContent = roles[+x.dataset.i].name; });
          armed = i; b.classList.add('armed'); b.textContent = `確定投 ${roles[i].name}？`; beep(400, 0.05); return;
        }
        eliminate(i);
      });
      $('#s-quit', box).onclick = () => end(null);
    }
    function eliminate(i) {
      const r = roles[i]; r.out = true;
      const spyLeft = roles.filter(x => !x.out && x.spy).length, civLeft = roles.filter(x => !x.out && !x.spy).length;
      buzz(r.spy ? [100, 50, 100] : 150);
      if (spyLeft === 0) return end('civ');
      if (spyLeft >= civLeft) return end('spy');
      play(r.spy ? `${esc(r.name)} 是臥底！<small>還有 ${spyLeft} 個臥底藏著</small>` : `${esc(r.name)} 是平民，喝一杯！<small>臥底還在，繼續描述</small>`);
    }
    function end(winner) {
      const spyNames = roles.filter(r => r.spy).map(r => r.name).join('、');
      const civs = roles.filter(r => !r.spy).map(r => r.name).join('、');
      const head = winner === 'civ' ? '平民獲勝！' : winner === 'spy' ? '臥底獲勝！' : '公布答案';
      const drink = winner === 'civ' ? `${esc(spyNames)} 喝兩杯` : winner === 'spy' ? `${esc(civs)} 各喝一杯` : '';
      [523, 659, 784].forEach((f, k) => setTimeout(() => beep(f, 0.18, 'triangle', 0.08), k * 130));
      box.innerHTML = `
        <div class="result">${head}${drink ? `<small>${drink}</small>` : ''}</div>
        <div class="reveal">
          <span class="hint">平民的詞</span><span class="word">${esc(words.civ)}</span>
          <span class="hint">臥底的詞（${esc(spyNames)}）</span><span class="word" style="color:var(--cherry)">${esc(words.spy)}</span>
        </div>
        <div class="row"><button class="btn ghost" id="s-setup">調整設定</button><button class="btn" id="s-again">再來一局</button></div>`;
      $('#s-again', box).onclick = startRound;
      $('#s-setup', box).onclick = setup;
    }
    setup();
  }
});

  ctx.fillStyle = 'rgba(0,0,0,.35)'; rr(ctx, -s / 2 + s * 0.06, -s / 2 + s * 0.1, s, s, s * 0.18); ctx.fill();
  ctx.fillStyle = '#fbf7ee'; rr(ctx, -s / 2, -s / 2, s, s, s * 0.18); ctx.fill();
  ctx.fillStyle = v === 1 || v === 4 ? '#d62c2c' : '#1b1b1b';
  PIPS[v].forEach(i => { ctx.beginPath(); ctx.arc((i % 3 - 1) * s * 0.28, (Math.floor(i / 3) - 1) * s * 0.28, s * (v === 1 ? 0.15 : 0.08), 0, Math.PI * 2); ctx.fill(); });
  ctx.restore();
}
registerGame({
  id: 'liar', name: '吹牛', en: "LIAR'S DICE", color: '#ffd36b', tag: '心理戰 · 人手一機', ribbon: 'NEW', desc: '每人用自己手機當骰盅，喊數唬爛，被開就喝', minPlayers: 1, needText: '每人一支手機，名單填自己就好',
  art(ctx, w, h) {
    const g = ctx.createRadialGradient(w / 2, h * 0.6, w * 0.1, w / 2, h * 0.6, h * 0.8); g.addColorStop(0, '#22915f'); g.addColorStop(1, '#08321f');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = '#5a3420'; ctx.lineWidth = w * 0.05; ctx.strokeRect(0, 0, w, h);
    bubbles(ctx, w, h, 21, 16, 'rgba(255,255,255,.06)');
    ctx.save(); ctx.translate(w * 0.36, h * 0.6); ctx.rotate(-0.35);
    const cw = w * 0.42, ch = w * 0.46;
    const cg = ctx.createLinearGradient(-cw / 2, 0, cw / 2, 0); cg.addColorStop(0, '#5e1b16'); cg.addColorStop(0.45, '#b8402f'); cg.addColorStop(1, '#5e1b16');
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0, ch / 2 + w * 0.02, cw * 0.55, w * 0.05, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = cg; ctx.beginPath(); ctx.moveTo(-cw * 0.32, -ch / 2); ctx.lineTo(cw * 0.32, -ch / 2); ctx.lineTo(cw / 2, ch / 2); ctx.lineTo(-cw / 2, ch / 2); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = w * 0.018;
    [-0.3, 0.32].forEach(t => { const y = ch * t, half = cw * (0.32 + (0.18 * (t + 0.5))); ctx.beginPath(); ctx.moveTo(-half, y); ctx.lineTo(half, y); ctx.stroke(); });
    ctx.fillStyle = '#7a2a20'; ctx.beginPath(); ctx.ellipse(0, -ch / 2, cw * 0.32, w * 0.035, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    dieArt(ctx, w * 0.72, h * 0.7, w * 0.22, 0.3, 1);
    dieArt(ctx, w * 0.8, h * 0.47, w * 0.17, -0.4, 6);
    dieArt(ctx, w * 0.26, h * 0.88, w * 0.17, -0.2, 4);
    dieArt(ctx, w * 0.56, h * 0.9, w * 0.15, 0.15, 3);
  },
  mount(root) {
    let n = store.get('liarN', 5), wild = store.get('liarWild', true);
    let dice = [], rolled = false, open = false, peeking = false, lastShake = 0, motion = null;
    const dieHTML = v => `<span class="die ${v === 1 || v === 4 ? 'red' : ''} ${v === 1 ? 'one' : ''}" role="img" aria-label="${v} 點">${[...Array(9)].map((_, i) => `<i class="${PIPS[v].includes(i) ? 'on' : ''}"></i>`).join('')}</span>`;
    const cupSVG = `<svg viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="50" cy="90" rx="40" ry="6" fill="rgba(0,0,0,.35)"/><path d="M28 14 H72 L88 88 H12 Z" fill="#a1342b"/><path d="M24 34 H76 M17 72 H83" stroke="#f2c14e" stroke-width="5"/><ellipse cx="50" cy="14" rx="22" ry="5" fill="#6e241d"/></svg>`;
    root.innerHTML = `
      <div class="stack">
        <div class="cup-box" id="l-cup" tabindex="0" aria-label="骰盅，按住偷看"></div>
        <button class="btn big" id="l-roll">搖骰</button>
        <button class="btn red" id="l-open" disabled>開！翻給大家看</button>
        <div id="l-tally"></div>
        <div class="seg" role="group" aria-label="骰子數量">${[3, 4, 5, 6].map(k => `<button data-n="${k}" aria-pressed="${k === n}">${k} 顆骰</button>`).join('')}</div>
        <div class="seg" role="group" aria-label="1 點規則">
          <button data-w="1" aria-pressed="${wild}">1 點萬用</button>
          <button data-w="0" aria-pressed="${!wild}">1 不萬用（齋）</button>
        </div>
        <button class="btn ghost" id="l-motion">開啟「甩手機搖骰」</button>
        <details class="editor"><summary>怎麼玩</summary>
          <ol class="rules">
            <li>每個人用<b>自己的手機</b>打開這個網址，進「吹牛」。</li>
            <li>大家一起按「搖骰」，<b>按住骰盅</b>偷看自己的骰子，別給人看。</li>
            <li>輪流喊「幾個幾」，例如「4 個 5」就是全場至少有 4 顆 5 點。</li>
            <li>下一個人要喊更大：數量變多，或數量一樣但點數更大。</li>
            <li>覺得上一個人在唬爛，就喊「開！」。大家按「開！」把手機翻給大家看，下面會幫你算好每種點數有幾顆。</li>
            <li>全場真的有那麼多 → 喊開的人喝；不夠 → 被開的人喝。</li>
            <li>1 點萬用：1 可以當任何點數。有人喊過「幾個 1」，這局 1 就不萬用（叫「齋」），記得切換。</li>
          </ol>
        </details>
      </div>`;
    const cup = $('#l-cup', root), openBtn = $('#l-open', root);
    function render() {
      if (!rolled) cup.innerHTML = `<div class="cup-cover">${cupSVG}<span>先按「搖骰」</span></div>`;
      else if (open || peeking) cup.innerHTML = `<div class="dice">${dice.map(dieHTML).join('')}</div>`;
      else cup.innerHTML = `<div class="cup-cover">${cupSVG}<span>按住偷看</span></div>`;
      openBtn.disabled = !rolled;
      openBtn.textContent = open ? '蓋起來' : '開！翻給大家看';
      const tally = $('#l-tally', root);
      if (!open) { tally.innerHTML = ''; return; }
      const c = [0, 0, 0, 0, 0, 0, 0]; dice.forEach(v => c[v]++);
      tally.innerHTML = `
        <p class="hint" style="text-align:center;margin-bottom:6px">我的骰子各有幾顆${wild ? '（2～6 點已加上萬用的 1）' : '（1 不萬用）'}</p>
        <div class="tally">${[1, 2, 3, 4, 5, 6].map(f => `<div>${f} 點<b>${wild && f !== 1 ? c[f] + c[1] : c[f]}</b></div>`).join('')}</div>`;
    }
    function roll() {
      dice = Array.from({ length: n }, () => 1 + Math.floor(Math.random() * 6));
      rolled = true; open = false; peeking = false; keepAwake();
      cup.classList.remove('shaking'); void cup.offsetWidth; cup.classList.add('shaking');
      for (let i = 0; i < 6; i++) setTimeout(() => beep(180 + Math.random() * 260, 0.04, 'square', 0.05), i * 60);
      buzz([30, 30, 30, 30, 60]);
      render();
    }
    $('#l-roll', root).onclick = roll;
    openBtn.onclick = () => { open = !open; if (open) { beep(660, 0.2, 'sawtooth', 0.08); buzz(120); } render(); };
    const peek = on => { if (!rolled || open) return; peeking = on; render(); };
    cup.onpointerdown = e => { e.preventDefault(); peek(true); };
    cup.onpointerup = cup.onpointerleave = cup.onpointercancel = () => peek(false);
    cup.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); peek(true); } };
    cup.onkeyup = () => peek(false);
    root.querySelectorAll('[data-n]').forEach(b => b.onclick = () => {
      n = +b.dataset.n; store.set('liarN', n);
      root.querySelectorAll('[data-n]').forEach(x => x.setAttribute('aria-pressed', x === b));
      rolled = false; open = false; render();
    });
    root.querySelectorAll('[data-w]').forEach(b => b.onclick = () => {
      wild = b.dataset.w === '1'; store.set('liarWild', wild);
      root.querySelectorAll('[data-w]').forEach(x => x.setAttribute('aria-pressed', x === b));
      render();
    });
    $('#l-motion', root).onclick = async e => {
      const btn = e.currentTarget;
      if (motion) { window.removeEventListener('devicemotion', motion); motion = null; btn.textContent = '開啟「甩手機搖骰」'; return; }
      try {
        if (typeof DeviceMotionEvent === 'undefined') throw new Error('unsupported');
        if (typeof DeviceMotionEvent.requestPermission === 'function' && await DeviceMotionEvent.requestPermission() !== 'granted') throw new Error('denied');
        motion = ev => {
          const a = ev.accelerationIncludingGravity; if (!a) return;
          const m = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
          if (m > 28 && Date.now() - lastShake > 1200) { lastShake = Date.now(); roll(); }
        };
        window.addEventListener('devicemotion', motion);
        btn.textContent = '甩手機搖骰：已開啟（點一下關閉）';
      } catch (err) { btn.textContent = '這支手機不能用甩的，請按「搖骰」'; }
    };
    render();
    return () => { if (motion) window.removeEventListener('devicemotion', motion); };
  }
});

/* ---------- 路由與畫面 ---------- */
const view = $('#view');
let cleanup = null, currentId = 'home';

function home() {
  view.innerHTML = `
    <section class="hero">
      <h2>今晚誰喝？</h2>
      <p>${players.length} 位玩家：${players.map(esc).join('、')}。手機放桌子中間輪流玩。</p>
    </section>
    <div class="library-head"><span><strong>所有遊戲</strong>（${GAMES.length}）</span><span>點封面開始</span></div>
    <div class="shelf">
      ${GAMES.map(g => `
        <div class="cap-item">
          <button class="cap" data-g="${g.id}" style="--c:${g.color}" aria-label="${esc(g.name)}">
            <canvas data-art="${g.id}"></canvas>
            <span class="cap-logo">${esc(g.name)}<em>${esc(g.en)}</em></span>
            ${g.ribbon ? `<span class="cap-ribbon">${esc(g.ribbon)}</span>` : ''}
            <span class="cap-chip">${esc(g.tag)}</span>
          </button>
          <small>${esc(g.desc)}${players.length < g.minPlayers ? `（需要 ${g.minPlayers} 人以上）` : ''}</small>
        </div>`).join('')}
      <div class="cap-item" aria-hidden="true">
        <div class="cap soon"><span>＋<b>更多遊戲</b></span></div>
        <small>之後再加進來</small>
      </div>
    </div>`;
  view.querySelectorAll('[data-g]').forEach(b => b.onclick = () => show(b.dataset.g));
  paintCovers();
}

function paintCovers() {
  view.querySelectorAll('canvas[data-art]').forEach(cv => {
    const g = GAMES.find(x => x.id === cv.dataset.art);
    const rect = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    const w = Math.round((rect.width || 200) * dpr), h = Math.round((rect.height || 300) * dpr);
    cv.width = w; cv.height = h;
    try { g.art(cv.getContext('2d'), w, h); } catch (e) {}
  });
}
try { document.fonts.ready.then(() => { if (currentId === 'home') paintCovers(); }); } catch (e) {}
window.addEventListener('resize', () => { if (currentId === 'home') paintCovers(); });

function welcome() {
  view.innerHTML = `
    <section class="hero">
      <h2>今晚誰喝？</h2>
      <p>先輸入今晚的玩家，照座位順時針一個一個加。「左邊、右邊」的懲罰會照這個順序算。</p>
    </section>
    <div class="stack">
      <form class="add-row" id="w-form">
        <input type="text" id="w-input" placeholder="輸入名字" maxlength="10" autocomplete="off" aria-label="玩家名字">
        <button class="btn" type="submit">加入</button>
      </form>
      <div class="chips" id="w-chips"></div>
      <p class="hint" id="w-msg"></p>
      <div class="need" id="w-need"></div>
      <button class="btn big" id="w-go"></button>
    </div>`;
  const msg = $('#w-msg'), go = $('#w-go');
  function draw() {
    $('#w-chips').innerHTML = players.length
      ? players.map((p, i) => `<span class="chip">${esc(p)}<button data-rm="${i}" aria-label="移除 ${esc(p)}">×</button></span>`).join('')
      : '<span class="hint">還沒有玩家，從上面輸入第一個名字</span>';
    $('#w-chips').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { players.splice(+b.dataset.rm, 1); store.set('players-v4', players); draw(); });
    $('#w-need').innerHTML = `<strong>各遊戲人數</strong><ul>${GAMES.map(g => `<li class="${players.length >= g.minPlayers ? 'ok' : ''}"><span>${esc(g.name)}</span><b>${g.needText || `${g.minPlayers} 人以上`}${players.length >= g.minPlayers ? ' ✓' : ''}</b></li>`).join('')}</ul>`;
    go.disabled = players.length < 1;
    go.textContent = players.length < 1 ? '至少輸入 1 個名字' : `開始玩（${players.length} 人）`;
  }
  $('#w-form').onsubmit = e => {
    e.preventDefault();
    const input = $('#w-input'), name = input.value.trim();
    if (!name) return;
    if (players.includes(name)) { msg.textContent = `已經有「${name}」了，換個名字`; return; }
    players.push(name); store.set('players-v4', players); input.value = ''; msg.textContent = ''; input.focus(); draw();
  };
  go.onclick = () => { turn = 0; renderPlayers(); show('home'); };
  draw();
}

function show(id) {
  if (cleanup) { try { cleanup(); } catch (e) {} cleanup = null; }
  if (id === 'welcome' || players.length < 1) {
    currentId = 'welcome'; $('#back').hidden = true; $('#players-btn').hidden = true; $('#title').textContent = '乾杯遊戲機';
    window.scrollTo(0, 0); welcome(); return;
  }
  $('#players-btn').hidden = false;
  const g = GAMES.find(x => x.id === id);
  if (g && players.length < g.minPlayers) { openSheet(`${g.name}需要至少 ${g.minPlayers} 位玩家，先加人吧。`); id = 'home'; }
  currentId = g && id !== 'home' ? id : 'home';
  const game = GAMES.find(x => x.id === currentId);
  $('#back').hidden = !game;
  $('#title').textContent = game ? game.name : '乾杯遊戲機';
  window.scrollTo(0, 0);
  if (game) { view.innerHTML = ''; const root = document.createElement('div'); view.appendChild(root); cleanup = game.mount(root) || null; }
  else home();
}

/* ---------- 玩家管理 ---------- */
function renderPlayers() {
  $('#pcount').textContent = players.length;
  $('#chips').innerHTML = players.map((p, i) => `<span class="chip">${esc(p)}<button data-rm="${i}" aria-label="移除 ${esc(p)}">×</button></span>`).join('');
  $('#chips').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    if (players.length <= 1) { $('#sheet-title').textContent = '至少要留 1 位玩家'; return; }
    players.splice(+b.dataset.rm, 1); turn = 0; store.set('players-v4', players); renderPlayers();
  });
}
function openSheet(msg) { $('#sheet-title').textContent = msg || '今晚的玩家'; renderPlayers(); $('#sheet').hidden = false; }
function closeSheet() { $('#sheet').hidden = true; show(currentId); }
$('#players-btn').onclick = () => openSheet();
$('#sheet-close').onclick = closeSheet;
$('#sheet').onclick = e => { if (e.target.id === 'sheet') closeSheet(); };
$('#add-form').onsubmit = e => {
  e.preventDefault();
  const name = $('#p-input').value.trim();
  if (!name) return;
  if (players.includes(name)) { $('#sheet-title').textContent = `已經有「${name}」了，換個名字`; return; }
  players.push(name); store.set('players-v4', players); $('#p-input').value = ''; $('#sheet-title').textContent = '今晚的玩家'; renderPlayers();
};
$('#back').onclick = () => show('home');

/* ---------- 啟動 ---------- */
window.claude?.hot?.snapshot?.(() => ({ view: currentId }));
function start(data) { renderPlayers(); show((data && data.view) || 'welcome'); }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
